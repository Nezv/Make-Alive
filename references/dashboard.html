1.2","text":"Rarity tiers with a colour and a glow on the pickup","done":false,"tags":["#perf","#vfx"],"subs":[],"notes":[]},{"num":"3.1.1.3","text":"Per-mission seeded rolls so every peer and every retry with the same seed agrees","done":false,"tags":["#net"],"subs":[],"notes":[]},{"num":"3.1.1.4","text":"Lootbox opening: lid springs, light spills out, items rise and settle","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"3.1.1.5","text":"Searching takes time for big containers, with a progress ring","done":false,"tags":["#ui"],"subs":[],"notes":[]},{"num":"3.1.1.6","text":"Placement rule: good loot is off the main route","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.1.2","name":"Containers: lootbox, ammo crate, ammo cartons","status":" ","id":"S152","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=containers`, `--host --map=corridor --shot-at=2`","tags":["#loot","#art"],"ready":true,"notes":["Today these are boxes in `lootbox.gd`, `ammo_crate.gd`, `ammo_box.gd`; the same nodes and states get new looks."],"details":[{"num":"3.1.2.1","text":"Card: a steel supply box, a military ammunition crate, a carton per calibre; references of each","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.1.2.2","text":"Round 1 · form: sizes against a hand and a rifle; the lids and their hinge lines","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.1.2.3","text":"Round 2 · structure: latches, hinges, rope or steel handles, corner guards, the crate's stacking feet, the cartons' flaps and tape","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.1.2.4","text":"Round 3 · surface: stencilled lettering and lot numbers, chipped olive paint, the calibre stripe and brand-free print on the cartons, worn corners","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.1.2.5","text":"States: shut, open (the lid hinge already animates), empty, broken open","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.1.2.6","text":"Review: the corridor shot and the rack at 1 m","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/containers.py`: `lootbox` (pressed steel chest, clasps, lid), `ammo_crate` (boards, cleats, rope handles, the rounds inside, lid) and `ammo_carton` (band, tape, print) have references and round 1, built. Left: rounds 2 and 3, the empty / broken states, swapping them into `lootbox.gd`, `ammo_crate.gd`, `ammo_box.gd` (the lootbox's lid hinges on its -Z edge today: turn the node)."]}]},{"num":"3.1.3","name":"Carried things: medkit, bandage, pills, planks, backpack","status":" ","id":"S153","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=carried`, `--host --map=corridor --wheel --shot-at=3`","tags":["#loot","#art"],"ready":true,"notes":[],"details":[{"num":"3.1.3.1","text":"Card: a red medical bag with a white cross, a bandage roll, a pill bottle, rough planks with nails, a hiking backpack; references of each","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.1.3.2","text":"Round 1 · form: sizes in a hand (the first-person heal and the wheel show them close)","done":false,"tags":["#ui"],"subs":[],"notes":[]},{"num":"3.1.3.3","text":"Round 2 · structure: zips, straps and buckles, the roll's loose end and gauze weave, the bottle's cap and label, nail heads and split ends on the planks","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"3.1.3.4","text":"Round 3 · surface: dirt and blood on the bag, fabric texture, the label's print, wood grain and saw marks","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"3.1.3.5","text":"The item wheel's icons rendered from these models, replacing the box icons of S014","done":false,"tags":["#ui"],"subs":[],"notes":[]},{"num":"3.1.3.6","text":"The heal animation (S015) holds the real bandage; the dropped backpack (`backpack.gd`) is this one","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"3.1.3.7","text":"Review: the wheel and the heal at 1080p, the rack at 1 m","done":false,"tags":["#ui"],"subs":[],"notes":[]}]},{"num":"3.1.4","name":"Loot in houses","status":" ","id":"S256","from":"","needs":"S246, S152, S153","size":"M","asset":"","rounds":"","test":"`tests/test_house_loot.gd`","see":"`--house-rack`","tags":["#loot"],"ready":false,"notes":[],"details":[{"num":"3.1.4.1","text":"Room dressing slots carry loot by room kind (kitchen, bedroom, bathroom cabinet, shop counter), seeded per house so every peer agrees","done":false,"tags":["#net"],"subs":[],"notes":[]},{"num":"3.1.4.2","text":"Lootboxes, ammo cartons and carried things (medkit, bandage, pills, planks) from the library's models","done":false,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.1.4.3","text":"What was taken is part of the house's state (late joiners), capped like drops","done":false,"tags":["#perf","#net"],"subs":[],"notes":[]},{"num":"3.1.4.4","text":"Loot found scales with difficulty (`ammo found`)","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.1.5","name":"Searched and restocked","status":" ","id":"S303","from":"","needs":"S256, S264","size":"S","asset":"","rounds":"","test":"","see":"","tags":["#loot"],"ready":false,"notes":[],"details":[{"num":"3.1.5.1","text":"Searched containers are marked (lid open, drawers out) on every peer","done":false,"tags":["#net"],"subs":[],"notes":[]},{"num":"3.1.5.2","text":"Loot restocks after `Config.LOOT_RESTOCK` in-game days in open world, never in missions","done":false,"tags":["#gameplay"],"subs":[],"notes":[]},{"num":"3.1.5.3","text":"Quality by place: a gun shop, a pharmacy, a police station beat a flat","done":false,"tags":["#map"],"subs":[],"notes":[]}]},{"num":"3.1.6","name":"Scavenging parts","status":" ","id":"S304","from":"","needs":"S014, S092","size":"M","asset":"","rounds":"","test":"","see":"","tags":["#loot","#base"],"ready":false,"notes":[],"details":[{"num":"3.1.6.1","text":"Dismantle cars, furniture and appliances with a held use for parts (scrap, cloth, nails, wire, fuel)","done":false,"tags":["#gameplay"],"subs":[],"notes":[]},{"num":"3.1.6.2","text":"Tools speed it up (crowbar, wrench); noise draws zombies (S020)","done":false,"tags":["#gameplay","#sound"],"subs":[],"notes":[]},{"num":"3.1.6.3","text":"Parts are the input to crafting (3.4, 4.2)","done":false,"tags":[],"subs":[],"notes":[]}]}]},{"num":"3.2","name":"Zombie spawn rate and hordes","q":"Do zombies come at the right rate by day and night, with horde nights?","tags":["#ai","#gameplay"],"items":[{"num":"3.2.1","name":"Spawn rate by time and place","status":" ","id":"S305","from":"","needs":"S028, S264","size":"M","asset":"","rounds":"","test":"`tests/test_open_world.gd`","see":"","tags":["#ai","#gameplay"],"ready":true,"notes":[],"details":[{"num":"3.2.1.1","text":"Spawn density per area and time of day in `Config` (fewer by day, more at night, more in the centre)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.2.1.2","text":"Heat (S020) and the director (S028) raise it; quiet play lowers it","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.2.1.3","text":"Sleeping groups in buildings that wake when entered","done":false,"tags":["#map"],"subs":[],"notes":[]},{"num":"3.2.1.4","text":"A spawn never happens in a player's sight (MapData.sees)","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.2.2","name":"Horde nights","status":" ","id":"S306","from":"","needs":"S305, S308","size":"M","asset":"","rounds":"","test":"","see":"","tags":["#ai","#gameplay"],"ready":false,"notes":[],"details":[{"num":"3.2.2.1","text":"Every Nth night (Config.OPEN_HORDE_NIGHT) a horde that knows where the players are and comes for the safe house","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.2.2.2","text":"Warnings: sirens far off, the sky turns red at dusk, screamers (S079) on the roofs","done":false,"tags":["#vfx","#sound"],"subs":[],"notes":[]},{"num":"3.2.2.3","text":"Diggers and climbers among them (S074, S078) so walls are tested","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.2.2.4","text":"Survived: a loot drop by air at dawn","done":false,"tags":["#loot"],"subs":[],"notes":[]}]}]},{"num":"3.3","name":"Building variance","q":"Are buildings different every run, complete inside, and quick to generate?","tags":["#map"],"items":[{"num":"3.3.1","name":"House interiors: layout","status":"~","id":"S246","from":"","needs":"S043","size":"L","asset":"","rounds":"","test":"`tests/test_house_plan.gd`","see":"`tools\\houses.ps1`, `--house-rack`","tags":["#map"],"ready":true,"notes":["Asked for after the plan was written: the town's ordinary houses get empty floors to walk (until now only the five POIs had interiors). Rooms and proportions only: the furniture is slots for S193's elements."],"details":[{"num":"3.3.1.1","text":"`HousePlan` (`scripts/world/house_plan.gd`): the fixed frame from a house's data (bays of both facades, street door, stair cage against the party wall in the middle or on the court, refends, flues), the same on every floor; mirrored for a door on the right","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.3.1.2","text":"`HouseFloor`: per floor, seeded: corridor beside the stair (an entrée when wide, none in a narrow house), the allée and passage to the court on the ground floor, rooms cut between windows, partitions lined up with the walls behind and below, kinds (dwelling or shop floor), doors near corners with clear leaves, enfilades; a layout that breaks a rule is tried again","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.3.1.3","text":"Passages in the player's size (`Config.INTERIOR_*`): corridors 1.2 m, doors 0.9 m, rooms 2.2 m, a way 0.72 m wide between furniture to every door and a window","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.3.1.4","text":"`RoomDressing`: paint per room (palettes by kind, dado, boiseries, wallpaper, cornice, wear), lamps and switches, furniture slots per kind (fireplaces on the flues)","done":true,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.3.1.5","text":"`InteriorBuilder`: walls with door and window gaps, painted faces, slabs with the stair well, flights and rails, door leaves, lights, collision; `--house-rack`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.3.1.6","text":"`tools\\houses.ps1`: the sample house's three floors and eight others as JSON, drawn by `tools/house_plans.py`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.3.1.7","text":"Houses of `CityBlocks` laid out from their own footprint (non-rectangular corners, wings, back buildings), hôtels and post-war slabs","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.3.1.8","text":"A house's street door opens (S191) and its floors are built only when a player comes near (budget per house)","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"3.3.1.9","text":"Round 1 · plans: the sample's floors and the variants against plans of real Paris houses before Haussmann (references on a card first)","done":false,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.3.1.10","text":"Review: the three floors walked at eye height in `--house-rack`","done":false,"tags":["#anim"],"subs":[],"notes":[]}]},{"num":"3.3.2","name":"Random room seeding","status":" ","id":"S307","from":"","needs":"S246, S193","size":"L","asset":"","rounds":"","test":"`tests/test_house_plan.gd`","see":"","tags":["#map"],"ready":false,"notes":[],"details":[{"num":"3.3.2.1","text":"Building types beyond the row house: shop, flat block, office, clinic, police post, workshop, each with its own room kinds","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.3.2.2","text":"Furniture and loot slots per room kind, seeded per building so every peer agrees (S256)","done":false,"tags":["#loot"],"subs":[],"notes":[]},{"num":"3.3.2.3","text":"Story rooms: a barricaded bedroom, a suicide, a family's last meal, a looted pharmacy (rare, seeded)","done":false,"tags":["#story"],"subs":[],"notes":[]}]},{"num":"3.3.3","name":"Window, door and stairs completeness","status":" ","id":"S308","from":"","needs":"S246, S191, S192","size":"M","asset":"","rounds":"","test":"`tests/test_house_plan.gd`","see":"","tags":["#map"],"ready":false,"notes":[],"details":[{"num":"3.3.3.1","text":"Every opening on a facade is real from inside: glass, frame, shutters, curtains","done":false,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.3.3.2","text":"Every door has a leaf that opens, locks or breaks (S191); every floor joins by stairs; roofs by a hatch","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.3.3.3","text":"Windows can be broken, climbed through and boarded (S055)","done":false,"tags":["#gameplay"],"subs":[],"notes":[]},{"num":"3.3.3.4","text":"A check walks every house: no floor unreachable, no door into a wall","done":false,"tags":["#tool"],"subs":[],"notes":[]}]},{"num":"3.3.4","name":"World generation speed","status":" ","id":"S309","from":"","needs":"S246","size":"M","asset":"","rounds":"","test":"`tests/test_house_streamer.gd`","see":"","tags":["#map","#perf"],"ready":false,"notes":[],"details":[{"num":"3.3.4.1","text":"House layout on worker threads (already), meshes built in slices under a per-frame budget","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.3.4.2","text":"A cache of built houses by seed for the session","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.3.4.3","text":"Generation time per area measured in a test, with a limit in `Config`","done":false,"tags":["#tool"],"subs":[],"notes":[]}]}]},{"num":"3.4","name":"Open world run","q":"Can a group survive days in an area: a safe house, needs, hand crafting, a way out?","tags":["#gameplay"],"items":[{"num":"3.4.1","name":"Open World on the areas","status":" ","id":"S257","from":"","needs":"S051","size":"M","asset":"","rounds":"","test":"`tests/test_game_modes.gd`","see":"`--mode=open_world`","tags":["#gameplay"],"ready":false,"notes":["PR 8 added the mode on the whole town (day and night clock, hordes by night). It moves onto the areas and gets what it lacks."],"details":[{"num":"3.4.1.1","text":"Runs on one area, or two joined by a street, not the whole town","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.4.1.2","text":"Open houses to search (S256) and a safe house to hold through a horde night","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.4.1.3","text":"A way to leave: any area's extraction ends the run with its score","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.4.2","name":"Safe house","status":" ","id":"S310","from":"","needs":"S055, S257","size":"M","asset":"","rounds":"","test":"","see":"","tags":["#gameplay","#base"],"ready":false,"notes":[],"details":[{"num":"3.4.2.1","text":"Claim any house with one door: it becomes the respawn point and the horde night's target","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.4.2.2","text":"Board windows and doors with planks (S055), repair them, they break under hits","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.4.2.3","text":"Store items in a chest that persists for the run","done":false,"tags":["#loot"],"subs":[],"notes":[]}]},{"num":"3.4.3","name":"Survival needs","status":" ","id":"S311","from":"","needs":"S014, S264","size":"M","asset":"","rounds":"","test":"","see":"","tags":["#gameplay"],"ready":true,"notes":[],"details":[{"num":"3.4.3.1","text":"Hunger, thirst and fatigue that drain over days and slow stamina refill when low","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.4.3.2","text":"Cold in snow and rain (S266, S110): shelter and fire warm you","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"3.4.3.3","text":"Food and water as loot; eating and drinking from the wheel","done":false,"tags":["#loot","#ui"],"subs":[],"notes":[]},{"num":"3.4.3.4","text":"Off in missions; a toggle in open world","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.4.4","name":"Hand crafting","status":" ","id":"S312","from":"","needs":"S304","size":"M","asset":"","rounds":"","test":"","see":"","tags":["#gameplay","#base"],"ready":false,"notes":[],"details":[{"num":"3.4.4.1","text":"Recipes from parts (S304): bandage, splint, molotov, planks, a pipe bomb, arrows for the crossbow","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.4.4.2","text":"Craft from the wheel, takes time, interrupted by a hit","done":false,"tags":["#ui"],"subs":[],"notes":[]}]}]},{"num":"3.5","name":"The whole town (later)","q":"The town in detail everywhere, once the five maps ship.","tags":["#map"],"items":[{"num":"3.5.1","name":"Trace the OpenStreetMap tiles","status":"x","id":"S039","from":"","needs":"none","size":"L","asset":"","rounds":"","test":"`tests/test_city_osm.gd`","see":"redraw `references/city_plan.png`","tags":["#map"],"ready":false,"notes":[],"details":[{"num":"3.5.1.1","text":"`tools/trace_osm.py` reads `references/1.png` to `9.png` into `scripts/world/city_osm.gd` (generated, never edited by hand)","done":true,"tags":[],"subs":[{"text":"Each tile registered to `joinville.png` pixels by two named control points per tile, kept in the tool","done":true},{"text":"Building footprints: the brown-grey polygons, simplified to a few corners, area and centroid","done":true},{"text":"Street casings by colour class: red trunk, orange, yellow, white residential, grey pedestrian","done":true},{"text":"Water, parks, parking lots, forest stipple as polygons","done":true}],"notes":[]},{"num":"3.5.1.2","text":"Overlay picture `references/osm_on_reference.png` proves the registration by eye","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.1.3","text":"Test: the terminal, the Prefeitura and the hospital footprints land inside their `CityData.POIS` lots","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.1.4","text":"Gaps between tiles reported, not guessed","done":true,"tags":[],"subs":[],"notes":["What this gives the town: a plan to simplify (S040) and a density map for the blocks (S043), not footprints to rebuild one by one.","The tiles are at four times joinville.png's zoom (their scale bars); `--register` finds each tile's place by cross-correlating its buildings with joinville.png's (match 0.64 to 0.77) and the control points are kept in `TILES`. 1301 footprints (convex, simplified), streets as 1-pixel cells per class, areas as polygons; the overlay is generated, not committed. The nine tiles cover the centre in an uneven patchwork: what their bounding box leaves uncovered is `CityOsm.GAPS`"]}]},{"num":"3.5.2","name":"Street network 2","status":"x","id":"S040","from":"","needs":"S039","size":"L","asset":"","rounds":"","test":"`tests/test_street_net.gd`, `tests/test_city_map.gd`","see":"`--city-plan`","tags":["#map"],"ready":false,"notes":["Joinville's own streets, not an invented plan: the street grid is Joinville's, dressed as a French town (setts, pavements, pans coupés, invented French names). The map is the whole of `joinville.png` (and the hill road's hairpin above it), not a part cut out round the POIs; what is kept in detail and what only as a far LOD is decided after a performance pass."],"details":[{"num":"3.5.2.1","text":"`CityData.STREETS` traced off `joinville.png` by `tools/trace_streets.py` into `CityStreets`: the main streets (`principale`) where the bus routes of `joinville_main_streets.png` run, every other street a `rue`; the hill road by hand off the topography","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.2.2","text":"Invented French street names for every street (`CityData.name_of`); never a real street of a real town on purpose","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.2.3","text":"Per street: carriageway width, one-way direction, pavement width each side, surface kind (setts or asphalt)","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.2.4","text":"Junctions as real shapes: chamfered corners (pans coupés), T and skewed cross","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.2.5","text":"Streets as meshes following the polyline with mitred joints, not grid cells; the 4 m grid stays for navigation only","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.2.6","text":"Only what lies inside a mission area is built in detail (S051)","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.2.7","text":"`--city-plan` and the menu's map redrawn from the new plan","done":true,"tags":["#ui"],"subs":[],"notes":["Done: 328 traced streets (76 main) and the hill road, `StreetNet` for junctions and strips, meshes in `CityMap._street_surfaces`. A first version invented an old core, a boulevard ring with a rond-point and faubourgs, inside a map cut to the hull of the POIs; both were dropped for Joinville's streets and the whole picture. Buildings still stand on the 4 m grid's BLOCK cells until S043 builds the îlots along the street lines. The detail area is a parameter of `CityMap` that nothing sets yet (S051 will)."]}]},{"num":"3.5.3","name":"Block massing","status":"x","id":"S043","from":"","needs":"S039, S040","size":"L","asset":"complex","rounds":"2","test":"`tests/test_city_blocks.gd`","see":"`tools\\shots.ps1 city_`, `--city-plan`","tags":["#map","#art"],"ready":false,"notes":["The traced footprints say how dense each part of town is and where the big buildings sit; the blocks are Paris's before Haussmann, not Joinville's lots."],"details":[{"num":"3.5.3.1","text":"Îlots: each block between the new streets is closed by a row of narrow houses along its edge with courtyards and passages inside, seeded widths per house (two to four windows); footprints from `CityOsm` inside it set its density and where a big hall, court or garden breaks the row","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.3.2","text":"Height from a class picked by street, place and seed","done":true,"tags":[],"subs":[{"text":"Old core: four to six floors on narrow fronts, steep roofs with dormers, leaning a little","done":true},{"text":"Houses on the main streets: four or five floors, stone ground floor, plastered above, mansard roofs","done":true},{"text":"Hôtels particuliers: a stone house between a front court behind a gate and a garden behind","done":true},{"text":"A few post-war blocks at the edge of town, where the hospital tower and the bus station stand; no skyline of towers","done":true},{"text":"Ateliers: long low halls with glass roofs by the river","done":true}],"notes":[]},{"num":"3.5.3.3","text":"Roofs are part of the mass: pitched and mansard roofs with ridges and hips, the tall party-wall chimney stacks left to the kits","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.3.4","text":"Collision is the block, one mesh per city block, test counts draws","done":true,"tags":["#perf"],"subs":[],"notes":[]},{"num":"3.5.3.5","text":"Blocks outside every mission area: low-detail silhouettes only","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.3.6","text":"Round 1 · skyline: from the place du marché, the bridge and the hill: a sea of grey slate and red tile roofs bristling with chimney pots, the church tower and the town hall's campanile above it","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.3.7","text":"Round 2 · roofscape: the îlots and courtyards from the helicopter's height against old Paris views and plans on the card (the Turgot plan's bird's-eye view)","done":true,"tags":[],"subs":[],"notes":[]},{"num":"3.5.3.8","text":"Review: the three views side by side with the references","done":true,"tags":[],"subs":[],"notes":["Done: `CityBlocks` (`scripts/world/city_blocks.gd`): îlots from the 4 m grid's BLOCK runs, outlines straightened onto the building lines; rows of houses in whole window bays, corner houses, wings across a court, back buildings from `CityOsm` and a seeded court fill, hôtels behind a gate, garden walls; classes core / main (mansards over stone) / rue / faubourg / post-war (hospital, bus station, a few at the edge) / ateliers (saw-tooth, by the river). About 34 000 houses, one mesh, one collision shape per îlot. Card and both rounds: `references/elements/city_blocks.md`. Left to the kits: chimney stacks and dormers (S159); no passages through the rows yet (the street plan has no covered passages); the church tower and campanile are S188 and S214. Joinville's blocks are big (180 îlots), so the courts are deep; the far LOD waits for S051's mission areas (silhouettes already work outside a detail area)."]}]},{"num":"3.5.4","name":"The river","status":" ","id":"S045","from":"","needs":"S040, S004, S165, S174","size":"L","asset":"complex","rounds":"3","test":"`tests/test_river.gd`","see":"`--host --shot-cam` on a bridge","tags":["#map","#art"],"ready":false,"notes":["Inside the mission areas first (S051, S249); the rest of the town is S259.","The river runs where Joinville's does; its banks are Paris's quays."],"details":[{"num":"3.5.4.1","text":"Channel cut below street level: high stone quay walls with mooring rings, cobbled ramps (ports) and stairs down to a lower quay at the water, the quay road above with its parapet; grass banks and willows out of the centre","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"3.5.4.2","text":"Water: one mesh, shader in code with slow flow along the river line, small ripples, dark green-brown, sky and lamp reflections as stretched streaks","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.3","text":"The bridges of S165 at the crossings of the new plan","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.4","text":"Floating things drifting with the flow: debris, a body, a sunk barge, an upturned rowing boat (S184), seeded","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.5","text":"Plane trees (S174) along the upper quay; the parapet's empty bouquinistes' boxes","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.6","text":"Water is not walkable; falling in wades the player to a ramp or stairs slowly, zombies stay out","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"3.5.4.7","text":"Mist over the water at night","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.8","text":"Round 1 · form: the channel's width, depth, quay walls and ramps against the OSM water and the card's references of the Paris quays","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.9","text":"Round 2 · water: colour, flow, reflections, the line where water meets the wall","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.10","text":"Round 3 · night: the lamps' reflections, mist","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.4.11","text":"Review: the bridge shot and a view along the lower quay","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.5.5","name":"Squares and landmarks","status":" ","id":"S049","from":"","needs":"S044, S047, S166, S173, S187, S188, S189, S190","size":"M","asset":"","rounds":"3","test":"`tests/test_landmarks.gd`","see":"`--host --shot-cam` on the place du marché","tags":["#map"],"ready":false,"notes":["Inside the mission areas first (S051, S249); the rest of the town is S259.","Assembly of the finished landmarks, exterior only. They stand where the plan of S040 puts them (the place du marché where Praça da Bandeira is, the church near it), not on traced footprints."],"details":[{"num":"3.5.5.1","text":"The place du marché: setts, the fountain (S187) in the middle, old chestnuts, lanterns (S166), benches and bins (S173), the empty market stalls, tall plastered houses with shops closing it","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.5.2","text":"The church (S188) on its parvis off the market","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.5.3","text":"The old cemetery (S189) on the slope behind the church","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.5.4","text":"The jardin public at the foot of the hill (S190), seen only on the lookout mission","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.5.5","text":"Round 1 · layout: the square's plan against old French market squares on the card (how irregular it is, how the streets enter it)","done":false,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.5.5.6","text":"Round 2 · style match: fixed `--shot-cam` views of the square and the church beside the card's references (old Paris engravings and photos of its surviving pre-Haussmann streets)","done":false,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.5.5.7","text":"Round 3 · decay: the abandoned square (litter, a fallen lantern, a car crashed into the fountain's basin) without losing the place","done":false,"tags":["#art"],"subs":[],"notes":[]},{"num":"3.5.5.8","text":"Review: the style match sheet","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.5.6","name":"The market fountain","status":" ","id":"S187","from":"","needs":"S141","size":"M","asset":"complex","rounds":"4","test":"`tests/test_elements.gd`","see":"`--prop-rack=monument`","tags":["#map","#art"],"ready":true,"notes":[],"details":[{"num":"3.5.6.1","text":"Card: photos of the Paris fountains of about 1800: a stone basin with a column or an obelisk in the middle, lion-mask spouts, a figure on top, the iron railing round it","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.6.2","text":"Round 1 · form: the basin's plan and rim height, the column's height and section, the steps round it","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.6.3","text":"Round 2 · structure: the spouts and their masks, the column's courses and capital, carved garlands and an inscription on the base, the railing","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.6.4","text":"Round 3 · surface: stone weathering, green streaks under the spouts, graffiti and a quarantine notice taped on, still water with leaves","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.6.5","text":"Round 4 · figure: the figure on top (a winged Victory) as a low-poly sculpture that reads from 10 m","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.6.6","text":"Review: from the square's corners and at 1 m","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/monument.py`: `market_fountain` (basin, tier with lion masks and jets, pedestal with its inscription and beasts, banded column, palm capital, globe, a blocked-out Victory) has references and round 1, built. Left: the railing, the masks and sphinxes, rounds 2 to 4 (the Victory's sculpture)."]}]},{"num":"3.5.7","name":"The church","status":" ","id":"S188","from":"","needs":"S141","size":"L","asset":"complex","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=church`","tags":["#map","#art"],"ready":true,"notes":[],"details":[{"num":"3.5.7.1","text":"Card: photos of old Paris parish churches: a Gothic nave and apse with flying buttresses, a classical front of columns and a pediment added in the 1700s, a square bell tower (put them in `references/elements/` first)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.7.2","text":"Round 1 · form: its silhouette and roof as seen from the street and from the hill; the tower is the town's landmark","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.7.3","text":"Round 2 · structure: the front's columns, pediment and portal, the tracery windows, the buttresses and pinnacles, the belfry's louvres, the doors and steps of the parvis","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"3.5.7.4","text":"Round 3 · surface: limestone gone grey and black with soot, the slate roofs, a clock face, weathering","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.7.5","text":"Review: beside the references at 10 m and 100 m","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.5.8","name":"The old cemetery","status":" ","id":"S189","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=cemetery`","tags":["#map","#art"],"ready":true,"notes":[],"details":[{"num":"3.5.8.1","text":"Card: photos of the Paris cemeteries of the early 1800s: family chapels like little houses, obelisks, columns, iron crosses and railings round graves, cobbled alleys under trees, the gate and the wall","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.8.2","text":"Round 1 · form: the chapels', tombs' and stones' shapes and sizes, their rows on the slope along the alleys","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.8.3","text":"Round 2 · structure: carved lettering and urns, the chapels' doors and stained glass, the iron crosses' scrolls and railings, the gate's bars and posts","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.8.4","text":"Round 3 · surface: lichen, tilt and cracks, rust, broken chapel doors","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.8.5","text":"Review: an alley at 1 m and the slope at 30 m","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/cemetery.py`: `tomb_chapel` (a classical chapel with its name, cross and grilled door opening out), `tomb_cross` (cast iron on a pedestal with its plaque), `tomb_slab` (border, slab, headstone, railing), `obelisk`, `tomb_gothic` (steep roof, crockets, pinnacles on diagonal buttresses, pointed door opening out) and `cemetery_gate` (round-topped pylons with roundels and garlands as at Père-Lachaise, the lintel of wreaths, the name, wall bays, iron leaves) have round 1, built. `tomb_column` (the broken column with its drape) too. Left: the keeper's lodge, rows on the slope, rounds 2 and 3."]}]},{"num":"3.5.9","name":"Jardin public gate and pond","status":" ","id":"S190","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=park`","tags":["#map","#art"],"ready":true,"notes":[],"details":[{"num":"3.5.9.1","text":"Card: photos of French public gardens: the gilded iron gate between stone piers, a round basin with a stone rim, a bandstand (kiosque à musique), gravel paths, iron chairs (put them in `references/elements/` first); tile 1 shows where the garden lies","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.9.2","text":"Round 1 · form: the gate, the basin's edge, the bandstand and the ring of paths","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.9.3","text":"Round 2 · structure: railings, signs, the basin's rim and jet, the bandstand's columns and roof, the chairs","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.9.4","text":"Round 3 · surface: water plants, moss, rust, chairs tipped into the basin","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.9.5","text":"Review: beside the references","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/park.py`: `bandstand` (octagonal base, columns, railing, brackets, zinc roof, lantern) has references and round 1, built; so do `park_chair` (the iron garden chair), `park_basin` (a 6 m round basin, stone roll, the vasque) and `park_gate` (gilded leaves opening between stone piers with urns, the overthrow and crest). Left: the jet itself, gravel paths, a plain photo of a chair, rounds 2 and 3."]}]},{"num":"3.5.10","name":"From Joinville to the town","status":" ","id":"S245","from":"","needs":"S040","size":"M","asset":"","rounds":"","test":"`tests/test_city_map.gd`","see":"`--host`, the menu","tags":["#map"],"ready":true,"notes":["The game's text still names Joinville and its real places; the town becomes an invented French one in the style of Paris around 1800, on the same plan."],"details":[{"num":"3.5.10.1","text":"An invented French town name, its street names (S040) and its coat of arms (one shape, used by S155, S186, S218), in `CityData`","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.10.2","text":"`Missions` titles and briefs in French names: the gare routière, the Hôtel-Dieu, the hôtel de ville, the caserne, the telegraph tower on the hill; mission ids (`terminal`, `hospital`, `prefeitura`, `batalhao`, `mirante`) stay as they are","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.10.3","text":"The menu's map: the invented names on the pins, the old core, the main streets and the quays drawn","done":false,"tags":["#ui"],"subs":[],"notes":[]},{"num":"3.5.10.4","text":"`CLAUDE.md` and `TODO.md` follow: the city is described as the town, the Joinville references as its plan","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"3.5.11","name":"The whole town in detail","status":" ","id":"S259","from":"","needs":"S258, S044, S045, S046, S047, S048, S049","size":"L","asset":"","rounds":"","test":"`tests/test_city_map.gd`","see":"`--map=town --host`","tags":["#map"],"ready":false,"notes":["Not before the five areas ship. Everything outside the areas at full detail: every îlot with its facades, every street dressed, the river's whole length, the squares and landmarks."],"details":[{"num":"3.5.11.1","text":"A far LOD for whatever is not near the players, streamed as they move","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"3.5.11.2","text":"Free play and the Open World over the whole town","done":false,"tags":[],"subs":[],"notes":[]},{"num":"3.5.11.3","text":"The frame rate holds (`tools\\perf.ps1 town`)","done":false,"tags":[],"subs":[],"notes":[]}]}]}]},{"num":"4","name":"State of Decay","meaning":"What carries between runs: survivors who grow, a base with facilities, crafting, a community.","areas":[{"num":"4.1","name":"Progression","q":"Do we have a progression tree: survivor skills, levels, progression outside the game?","tags":["#progression"],"items":[{"num":"4.1.1","name":"Progression","status":" ","id":"S127","from":"","needs":"S026, S106","size":"M","asset":"","rounds":"","test":"`tests/test_progression.gd`","see":"","tags":["#progression"],"ready":false,"notes":[],"details":[{"num":"4.1.1.1","text":"`user://profile.cfg`: missions done per difficulty, records, total kills, unlocked items","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"4.1.1.2","text":"Finishing missions unlocks the next ones and starting loadout options (a better const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const items = [];
for (const p of PLAN) for (const a of p.areas) for (const it of a.items) items.push([p, a, it]);
const det = items.reduce((n, [, , it]) => n + it.details.length, 0);
const detDone = items.reduce((n, [, , it]) => n + it.details.filter(d => d.done).length, 0);
const nDone = items.filter(([, , it]) => it.status === "x").length;
const nStarted = items.filter(([, , it]) => it.status === "~").length;
const nReady = items.filter(([, , it]) => it.ready).length;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
document.getElementById("finding").textContent =
  `${nDone} of ${items.length} items are done and ${nStarted} are started. ${nReady} can be started now. Phase 1 is ${pct(PLAN[0].areas.flatMap(a => a.items).filter(i => i.status === "x").length, PLAN[0].areas.flatMap(a => a.items).length)}% built.`;
document.getElementById("figs").innerHTML = [
  [pct(nDone, items.length) + "%", "of items done"],
  [`${detDone}/${det}`, "details done"],
  [nStarted, "items started"],
  [nReady, "ready to start"],
].map(([b, s]) => `<div class="fig"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
const tally = list => ({ n: list.length, x: list.filter(i => i.status === "x").length, s: list.filter(i => i.status === "~").length, r: list.filter(i => i.ready).length });
document.getElementById("map").innerHTML = PLAN.map(p => {
  const t = tally(p.areas.flatMap(a => a.items));
  return `<div class="prow"><div class="pname">${esc(p.num)}&ensp;${esc(p.name)}<small>${t.x} of ${t.n} done</small></div><div class="parcels">` +
    p.areas.map(a => { const c = tally(a.items); return `<button class="parcel" type="button" style="flex-grow:${Math.max(c.n, 2)}" data-go="${esc(a.num)}" title="${esc(a.num + " " + a.name + ": " + c.x + " done, " + c.s + " started, " + c.n + " items")}"><i style="width:${pct(c.x, c.n)}%"></i><em style="left:${pct(c.x, c.n)}%;width:${pct(c.s, c.n)}%"></em><u style="width:${pct(c.r, c.n)}%"></u><span>${esc(a.num)} ${esc(a.name)}</span></button>`; }).join("") +
    `</div></div>`;
}).join("");
const STATUSES = [["all", "All"], ["todo", "To do"], ["started", "Started"], ["done", "Done"], ["ready", "Ready now"]];
const state = { q: "", status: "all", tag: "" };
try { Object.assign(state, JSON.parse(localStorage.getItem("ma-dash") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("ma-dash", JSON.stringify(state)); } catch (e) {} };
const seg = document.getElementById("status");
seg.innerHTML = STATUSES.map(([k, l]) => `<button type="button" data-st="${k}">${l}</button>`).join("");
const tagCount = {};
for (const [, , it] of items) {
  const all = new Set(it.tags.concat(it.details.flatMap(d => d.tags)));
  for (const t of all) tagCount[t] = (tagCount[t] || 0) + 1;
}
const tagsEl = document.getElementById("tags");
tagsEl.innerHTML = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<button type="button" data-tag="${esc(t)}">${esc(t)}<small>${n}</small></button>`).join("");
const tagOf = (it, t) => it.tags.includes(t) || it.details.some(d => d.tags.includes(t));
const kind = it => it.status === "x" ? "done" : it.status === "~" ? "started" : "todo";
function matches(it) {
  if (state.status === "ready" ? !it.ready : state.status !== "all" && kind(it) !== state.status) return false;
  if (state.tag && !tagOf(it, state.tag)) return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    const hay = [it.name, it.id, it.num, it.from].concat(it.details.map(d => d.text), it.notes).join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const hl = s => {
  let h = fmt(s);
  if (state.q.length > 1) { const q = esc(state.q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); h = h.replace(new RegExp("(" + q + ")(?![^<]*>)", "gi"), "<mark>$1</mark>"); }
  return h;
};
function itemHtml(it, open) {
  const data = [["id", it.id + (it.from ? " (split from " + it.from + ")" : "")], ["needs", it.needs], ["size", it.size], ["asset", it.asset], ["rounds", it.rounds], ["tags", it.tags.join(" ")], ["test", it.test], ["see", it.see]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${fmt(v)}</dd>`).join("");
  const dets = it.details.map(d => `<li class="${d.done ? "d" : ""}"><span class="dn">${d.done ? "✓ " : ""}${esc(d.num.split(".").pop())}</span><span><span class="dt">${hl(d.text)}</span> ${d.tags.length ? `<span class="dtags">${esc(d.tags.join(" "))}</span>` : ""}` +
    (d.subs.length ? `<ul class="sub">${d.subs.map(s => `<li>${s.done ? "✓ " : ""}${fmt(s.text)}</li>`).join("")}</ul>` : "") +
    d.notes.map(n => `<p class="note">${fmt(n)}</p>`).join("") + `</span></li>`).join("");
  const mark = it.status === "x" ? "✓" : it.status === "~" ? "◐" : "○";
  const k = kind(it) + (it.ready && it.status !== "x" ? " ready" : "");
  return `<details class="item ${k}"${open ? " open" : ""}><summary><span class="st">${mark}</span><span class="inum">${esc(it.num)}</span><span class="iname">${hl(it.name)}</span>` +
    (it.ready ? `<span class="ready-mark">ready</span>` : "") +
    `<span class="meta">${esc(it.id)}${it.size ? " · " + esc(it.size) : ""} · ${it.details.filter(d => d.done).length}/${it.details.length}</span><span class="chip">${esc(it.tags.join(" "))}</span></summary>` +
    `<div class="body"><dl class="data">${data}</dl>${it.notes.map(n => `<p class="note">${fmt(n)}</p>`).join("")}<ul class="det">${dets}</ul></div></details>`;
}
const tree = document.getElementById("tree");
const openAreas = new Set();
function render() {
  for (const b of seg.children) b.setAttribute("aria-pressed", b.dataset.st === state.status);
  for (const b of tagsEl.children) b.setAttribute("aria-pressed", b.dataset.tag === state.tag);
  const filtering = state.q || state.status !== "all" || state.tag;
  let shown = 0;
  tree.innerHTML = PLAN.map(p => {
    const areas = p.areas.map(a => {
      const its = a.items.filter(matches);
      if (!its.length) return "";
      shown += its.length;
      const c = tally(a.items);
      const open = openAreas.has(a.num) || (filtering && its.length < 40);
      return `<details class="area" id="a${esc(a.num)}" data-a="${esc(a.num)}"${open ? " open" : ""}><summary><span class="anum">${esc(a.num)}</span><span class="aname">${esc(a.name)}<span class="aq">${esc(a.q)}</span></span>` +
        `<span class="mwrap"><span class="mtext">${c.x} done · ${c.s} started · ${c.n} items</span><span class="meter"><i style="width:${pct(c.x, c.n)}%"></i><em style="width:${pct(c.s, c.n)}%"></em></span></span></summary>` +
        `<div class="items">${open ? its.map(it => itemHtml(it, filtering && (state.q || state.tag) && its.length <= 3)).join("") : ""}</div></details>`;
    }).join("");
    if (!areas) return "";
    const t = tally(p.areas.flatMap(a => a.items));
    return `<section class="phase"><h2>${esc(p.num)}&ensp;${esc(p.name)}</h2><p>${esc(p.meaning)} ${t.x} of ${t.n} items done.</p>${areas}</section>`;
  }).join("") || `<p class="empty">Nothing matches. Clear the search or pick another tag.</p>`;
  document.getElementById("count").textContent = `${shown} of ${items.length} items shown`;
}
tree.addEventListener("toggle", e => {
  const d = e.target;
  if (!d.classList || !d.classList.contains("area")) return;
  const a = d.dataset.a;
  if (d.open) {
    openAreas.add(a);
    const box = d.querySelector(".items");
    if (!box.children.length) {
      const area = PLAN.flatMap(p => p.areas).find(x => x.num === a);
      box.innerHTML = area.items.filter(matches).map(it => itemHtml(it, false)).join("");
    }
  } else openAreas.delete(a);
}, true);
seg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.status = b.dataset.st; save(); render(); });
tagsEl.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.tag = state.tag === b.dataset.tag ? "" : b.dataset.tag; save(); render(); });
const q = document.getElementById("q");
q.value = state.q;
let timer = 0;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { state.q = q.value.trim(); save(); render(); }, 150); });
document.getElementById("openall").addEventListener("click", () => { for (const p of PLAN) for (const a of p.areas) openAreas.add(a.num); render(); });
document.getElementById("closeall").addEventListener("click", () => { openAreas.clear(); render(); });
document.getElementById("map").addEventListener("click", e => {
  const b = e.target.closest(".parcel"); if (!b) return;
  state.q = ""; state.status = "all"; state.tag = ""; q.value = ""; save();
  openAreas.add(b.dataset.go); render();
  const el = document.getElementById("a" + b.dataset.go); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
render();
}
</script>
