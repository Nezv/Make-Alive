<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Alive Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: a production board read by the people building the game
   IDEA a survey map's legend: the plan as territory, each area a parcel filled as it is built
   PICTURE the territory strip: one row per phase, one parcel per area sized by its items, inked as they are done
   COLOUR land ground, ink, sea band, contour brown for started, magenta for what is ready or selected
   TYPE Overpass 800 for figures and titles, Overpass for text
   LAYOUT laptop: title and figures over the full-width strip, filters, then the tree; phone: the same stacked */
:root{color-scheme:light dark;--bg:light-dark(#fbfbf2,#0d1c24);--ink:light-dark(#13242e,#e3ecef);--soft:light-dark(#4d5d66,#9fb2ba);--sea:light-dark(#bfe3ee,#12313d);--brown:light-dark(#a8551b,#e0965c);--mag:light-dark(#d6127e,#ff5aa8);--line:light-dark(#dcdccf,#24414d);--panel:light-dark(#ffffff,#112630);--todo:light-dark(#ecebdf,#1b3642)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Overpass,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,3.5vw,48px) max(4vw,16px)}
.top{background:var(--sea)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-weight:800;font-size:clamp(32px,4.4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.finding{font-size:18px;margin:0 0 20px;max-width:70ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px 24px;margin:0 0 22px}
.fig b{display:block;font-weight:800;font-size:clamp(28px,3.4vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.fig span{color:var(--soft);font-size:14px}
.map{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:10px;align-items:stretch}
.pname{font-weight:800;font-size:14px;line-height:1.2;padding-top:6px}
.pname small{display:block;font-weight:400;color:var(--soft)}
.parcels{display:flex;flex-wrap:wrap;gap:3px;min-height:58px}
.parcel{position:relative;flex:1 1 0;min-width:6.8em;min-height:58px;border:0;border-radius:3px;padding:5px 6px;text-align:left;font:600 12px/1.2 Overpass,sans-serif;color:var(--ink);cursor:pointer;overflow:hidden;background:var(--todo)}
.parcel i{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.9}
.parcel em{position:absolute;inset:0 auto 0 0;background:var(--brown);opacity:.85}
.parcel span{position:relative;display:block;mix-blend-mode:normal;padding:1px 3px;border-radius:2px;background:color-mix(in srgb,var(--bg) 82%,transparent);width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parcel u{position:absolute;left:0;bottom:0;height:5px;background:var(--mag)}
.parcel:hover,.parcel:focus-visible{outline:2px solid var(--mag);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--soft)}
.legend b{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,16px)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
input[type=search]{font:16px Overpass,sans-serif;padding:9px 12px;border:1px solid var(--soft);border-radius:6px;background:var(--panel);color:var(--ink);width:min(22em,100%);min-height:44px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button{font:600 14px Overpass,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:40px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.tags button{font-size:13px;padding:4px 9px;min-height:32px}
.tags button small{color:var(--soft);font-weight:400;margin-left:3px}
.tags button[aria-pressed=true] small{color:var(--bg)}
.count{font-size:14px;color:var(--soft);margin-left:auto}
main{padding:8px max(4vw,16px) 64px}
.phase{margin-top:34px}
.phase>h2{font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.01em;margin:0 0 4px}
.phase>p{margin:0 0 12px;color:var(--soft);max-width:75ch}
details.area{border-top:1px solid var(--line)}
details.area>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:3.4em minmax(0,1fr) 11em;gap:4px 12px;padding:12px 0;align-items:start}
details.area>summary::-webkit-details-marker{display:none}
.anum{font-weight:800;font-variant-numeric:tabular-nums}
.aname{font-weight:800;font-size:18px;line-height:1.25}
.aq{display:block;font-weight:400;font-size:15px;color:var(--soft);margin-top:2px}
.meter{height:10px;border-radius:5px;background:var(--todo);overflow:hidden;display:flex;margin-top:6px}
.meter i{background:var(--ink)}
.meter em{background:var(--brown)}
.mwrap{display:block}
.mtext{font-size:13px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.items{padding:0 0 14px 3.4em}
details.item{border-left:3px solid var(--todo);margin:6px 0;background:var(--panel);border-radius:0 6px 6px 0}
details.item.done{border-left-color:var(--ink)}
details.item.started{border-left-color:var(--brown)}
details.item.ready{border-left-color:var(--mag)}
details.item>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:9px 12px}
details.item>summary::-webkit-details-marker{display:none}
.st{font-weight:800;width:1.2em;flex:none}
.inum{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px;white-space:nowrap}
.iname{font-weight:600;flex:1 1 14em}
.meta{font-size:13px;color:var(--soft);white-space:nowrap}
.chip{font-size:12px;color:var(--soft);white-space:nowrap}
.ready-mark{font-size:12px;font-weight:800;color:var(--mag);white-space:nowrap}
.body{padding:0 14px 12px 34px;font-size:15px}
.data{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;font-size:14px;margin:0 0 8px}
.data dt{color:var(--soft)}
.data dd{margin:0;overflow-wrap:anywhere}
ul.det{list-style:none;margin:6px 0 0;padding:0}
ul.det>li{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:2px 8px;padding:4px 0;border-top:1px dashed var(--line)}
ul.det li.d{color:var(--soft)}
ul.det li.d .dt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--soft) 50%,transparent)}
.dn{font-variant-numeric:tabular-nums;font-size:13px;color:var(--soft);white-space:nowrap}
.dtags{font-size:12px;color:var(--brown);white-space:nowrap}
ul.sub{margin:2px 0 0;padding-left:1.1em;font-size:14px}
.note{font-size:14px;color:var(--soft);margin:2px 0}
code{font-size:.9em;background:color-mix(in srgb,var(--sea) 60%,transparent);padding:0 3px;border-radius:3px;overflow-wrap:anywhere}
mark{background:color-mix(in srgb,var(--mag) 25%,transparent);color:inherit}
.empty{padding:40px 0;color:var(--soft)}
@media(max-width:600px){.prow{grid-template-columns:1fr}.pname{padding:0}details.area>summary{grid-template-columns:2.8em minmax(0,1fr)}details.area>summary .mwrap{grid-column:2}.items{padding-left:0}.body{padding-left:14px}}
@media(min-width:901px){.bar{position:sticky}}
@media(max-width:900px){.bar{position:static}}
</style>
</head>
<body>
<header class="band top"><div class="wrap">
<h1>Make Alive management dashboard</h1>
<p class="finding" id="finding"></p>
<div class="figs" id="figs"></div>
<div class="map" id="map" aria-label="Every area by phase, sized by its items and filled as they are done"></div>
<div class="legend"><span><b style="background:var(--ink)"></b>done</span><span><b style="background:var(--brown)"></b>started</span><span><b style="background:var(--todo);outline:1px solid var(--line)"></b>to do</span><span><b style="background:var(--mag)"></b>ready to start (needs met), the strip under a parcel</span></div>
</div></header>
<div class="bar"><div class="wrap">
<input type="search" id="q" placeholder="Search items and details" aria-label="Search items and details">
<div class="seg" id="status" role="group" aria-label="Status"></div>
<button id="openall" type="button">Open all</button>
<button id="closeall" type="button">Close all</button>
<span class="count" id="count"></span>
<div class="tags" id="tags" role="group" aria-label="Tags"></div>
</div></div>
<main><div class="wrap" id="tree"></div></main>
<script>
{

","test":"`tests/test_outfit_models.gd`","see":"`--host --outfit-rack=1`","tags":["#anim","#art"],"ready":false,"notes":[],"details":[{"num":"1.1.2.1","text":"Garment kit `tools/models/clothes.py`, fitted by slicing the body ✅","done":true,"tags":[],"subs":[{"text":"Shirts and jackets: long, short or no sleeves; crew, collar or high neck; tucked or over the trousers; open front ✅","done":true},{"text":"Trousers and shorts with an optional belt ✅","done":true},{"text":"Shoes, sneakers, boots ✅","done":true},{"text":"Headgear: police cap, hard hat, helmet, fire helmet, nurse's cap ✅","done":true}],"notes":[]},{"num":"1.1.2.2","text":"One continuous surface per garment: sleeves out of the armhole, legs out of the seat, no break at any joint ✅","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.1.2.3","text":"Helper bones turning half as far as each limb joint, so cloth bends without pinching ✅","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.1.2.4","text":"Pieces cut below each joint, closed by wounds; piece ids in the .glb's second UV channel ✅","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.1.2.5","text":"Nine outfits on the male and the female body (18 models), plain colours, worn by every walking zombie ✅","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.1.2.6","text":"Sex picked from the id per outfit (`Characters.FEMALE_SHARE`) ✅","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.1.2.7","text":"Tools: `outfits.py --sketch` (posed previews without Blender), `--folds`, `--outfit-rack`, `--rack-sever` ✅","done":true,"tags":[],"subs":[],"notes":[]}]},{"num":"1.1.3","name":"Bite variants","status":"~","id":"S138","from":"","needs":"S137","size":"L","asset":"complex","rounds":"","test":"`tests/test_bite_variants.gd`","see":"`python tools/models/outfits.py --bites nurse --f`","tags":["#anim","#art"],"ready":true,"notes":["Agent: Opus 5.5 at effort max. Geometry-heavy work with many look-and-fix rounds; it needs the whole pipeline (body, skeleton, clothes, rig, piece cuts) in its head at once. Plan first, then build one bite end to end before the other nine."],"details":[{"num":"1.1.3.1","text":"Optimized variant producer in `tools/models/`: from one outfit and body, many variants that share what they can","done":false,"tags":[],"subs":[{"text":"Clothes swaps per variant (sleeve length, open or closed, hat or none, colour sets)","done":false},{"text":"Variants picked from the zombie id, the same on every peer; the wire unchanged","done":true},{"text":"Budget: triangles and texture memory per variant kept close to the plain model, loading stays before the first spawn","done":true}],"notes":[]},{"num":"1.1.3.2","text":"Ten bites, each a named region torn out of flesh and clothes together, e.g.","done":true,"tags":[],"subs":[{"text":"Left or right side of the abdomen, left or right lower ribs, upper chest, shoulder, upper arm, forearm, thigh, calf, neck and jaw","done":true},{"text":"The hole cuts the body and every garment over it, with a torn ragged edge (not a clean cut) and blood-dark rims","done":true},{"text":"Only that region's bones show under it (a few ribs, the radius and ulna, a length of femur, a piece of spine), never the whole skeleton model","done":true},{"text":"Inside the hole: wound flesh, the bone section, depth, so no see-through; the piece it belongs to stays closed for gibs","done":true}],"notes":[]},{"num":"1.1.3.3","text":"Bites survive the existing rules: helpers bend them, they come off with their piece, stumps still close","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.1.3.4","text":"Contact sheet of every bone, clothes and body variant of the female nurse in one isometric picture, shown in chat when done","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.1.4","name":"Outfit details: uniforms","status":" ","id":"S139","from":"","needs":"S137","size":"L","asset":"complex","rounds":"3","test":"`tests/test_outfit_models.gd`","see":"`--host --outfit-rack=2`","tags":["#anim","#art"],"ready":true,"notes":["The nine outfits are plain colours per garment today. This step does the four uniforms; the civilians are S235."],"details":[{"num":"1.1.4.1","text":"Card per uniform with photos of the real ones: the Santa Catarina military police, the army's field uniform, the firefighters (Corpo de Bombeiros), a prison uniform","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.4.2","text":"Round 1 · form: the garments' cut against the photos: pocket shapes, collars, belts with their gear, boots","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.4.3","text":"Round 2 · structure: patches and badges, name tapes, rank, epaulettes, button lines, zips, the firefighters' hi-vis reflective bands, cargo pockets with flaps, holsters and pouches on the belts","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.4.4","text":"Round 3 · surface: camouflage print, fabric weave, stitching, dirt, blood and tears that follow the seams","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.1.4.5","text":"Review: the outfit rack front and back at 1 m beside the photos","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.1.5","name":"Outfit details: civilians","status":" ","id":"S235","from":"","needs":"S137","size":"L","asset":"complex","rounds":"3","test":"`tests/test_outfit_models.gd`","see":"`--host --outfit-rack=1`","tags":["#anim","#art"],"ready":true,"notes":[],"details":[{"num":"1.1.5.1","text":"Card: civilian, worker, office, nurse and doctor, with photos of each kind of clothing","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.5.2","text":"Round 1 · form: shirt and trouser cuts, collars and cuffs, the doctor's long coat, the nurse's scrubs, the worker's overalls","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.5.3","text":"Round 2 · structure: ties, lanyards with ID cards, a stethoscope, pens in pockets, aprons, tool belts, buttons, prints on t-shirts","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.5.4 subs":[],"notes":[]},{"num":"1.1.14.2","text":"Rise in stages, chosen by pose: roll to the side, push up on the arms, a knee, stand with a stagger; each a goal pose the rig eases through","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.14.3","text":"Missing limbs change the rise: one arm pushes and slips, no legs means it drags itself instead","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.14.4","text":"Crawling out from under a car or a bed, hands first","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.14.5","text":"Dead that are really dead: a share of lying bodies never rise (seeded by id), so players cannot tell","done":false,"tags":["#gameplay"],"subs":[],"notes":[]},{"num":"1.1.14.6","text":"The rise wakes on noise and sight (S072) and is interrupted by a shove or a hit","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.1.15","name":"Organic motion","status":" ","id":"S261","from":"","needs":"S071","size":"M","asset":"","rounds":"","test":"`tests/test_humanoid.gd`","see":"`--host --demo`","tags":["#anim","#art"],"ready":false,"notes":[],"details":[{"num":"1.1.15.1","text":"Layered noise on every joint by id: breathing, weight shift, small tremors; never two zombies in step","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.15.2","text":"Tempo per zombie: some slow and heavy, some twitchy and fast, from the id","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.15.3","text":"Feet on the ground: foot placement on slopes, kerbs and stairs, no sliding (stride from speed)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.15.4","text":"Head and eyes look at the nearest noise or player, the body follows late","done":false,"tags":["#ai"],"subs":[],"notes":[]},{"num":"1.1.15.5","text":"Collisions in a crowd push shoulders and heads apart, a stumble when shoved by another zombie","done":false,"tags":["#ai"],"subs":[],"notes":[]},{"num":"1.1.15.6","text":"Cheap at distance: the noise layers drop past `Config.ZOMBIE_DETAIL_RANGE` (see 2.3)","done":false,"tags":["#perf"],"subs":[],"notes":[]}]},{"num":"1.1.16","name":"Feeding on corpses","status":" ","id":"S262","from":"","needs":"S072, S081","size":"M","asset":"","rounds":"","test":"`tests/test_feeding.gd`","see":"","tags":["#anim","#art","#ai","#story"],"ready":false,"notes":[],"details":[{"num":"1.1.16.1","text":"Feeding groups: two to five kneel round one body, shoulder to shoulder, each with its own cycle (S072's FEEDING state)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.16.2","text":"The body they feed on: an opened corpse prop with a blood pool that grows, torn clothes, a limb pulled away","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.1.16.3","text":"Sounds: wet tearing, chewing, grunts, falling quiet when one looks up (S082)","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"1.1.16.4","text":"They are slow to notice: hearing range halved while feeding, then the whole group rises together","done":false,"tags":["#gameplay"],"subs":[],"notes":[]},{"num":"1.1.16.5","text":"Placed by map data and by the director in quiet streets","done":false,"tags":["#map"],"subs":[],"notes":[]}]},{"num":"1.1.17","name":"Corpses for a devastated town","status":" ","id":"S263","from":"","needs":"S137, S081","size":"M","asset":"complex","rounds":"","test":"`tests/test_corpses.gd`","see":"`--prop-rack=corpses`","tags":["#anim","#art","#story"],"ready":false,"notes":[],"details":[{"num":"1.1.17.1","text":"A corpse kit from the zombie bodies and outfits: lying poses frozen from the ragdoll, mesh-merged, no rig","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.1.17.2","text":"States: fresh, bloated, decayed to bone; burnt; in a body bag; under a sheet","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.17.3","text":"Arrangements: heaps at a barricade, rows on a triage floor, one slumped in a car, hanging out of a window, half under rubble","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.17.4","text":"Devastation level per area in map data (0 calm to 3 overrun) decides how many and which","done":false,"tags":["#map"],"subs":[],"notes":[]},{"num":"1.1.17.5","text":"Instanced (MultiMesh per pose) and capped by `Config`","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.1.17.6","text":"Flies and a faint smell haze over the worst (small particles, S004)","done":false,"tags":["#vfx"],"subs":[],"notes":[]}]},{"num":"1.1.18","name":"Death and ragdolls","status":" ","id":"S081","from":"","needs":"S071","size":"M","asset":"","rounds":"","test":"`tests/test_ragdoll.gd`","see":"`--host --demo --bot --shot-at=2,4`","tags":["#anim","#art"],"ready":false,"notes":[],"details":[{"num":"1.1.18.1","text":"Death animation before the ragdoll by cause: headshot drop, torso crumple to the knees, run-death tumble that carries momentum","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.18.2","text":"Ragdoll impulse from the killing shot's direction and calibre; shotguns lift them off the ground","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.18.3","text":"Twitching: a hand or leg jerks for a few seconds on some corpses","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.18.4","text":"Corpses settle, then become static corpses as now; caps unchanged","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.1.18.5","text":"Piles: corpses stack at choke points without jitter","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.1.18.6","text":"Explosions throw ragdolls and loose limbs","done":false,"tags":[],"subs":[],"notes":[]}]}]},{"num":"1.2","name":"Assets: building exteriors","q":"Do we have enough assets to dress the outsides of buildings: facades, windows, shopfronts, roofs, signs?","tags":["#art"],"items":[{"num":"1.2.1","name":"Facades","status":" ","id":"S044","from":"","needs":"S043, S157, S158, S159, S160, S161, S162, S163, S164","size":"L","asset":"","rounds":"2","test":"`tests/test_facades.gd`","see":"`--host --shot-cam` street level, day and night","tags":["#art"],"ready":false,"notes":["Inside the mission areas first (S051, S249); the rest of the town is S259.","Assembly: the blocks of S043 dressed from the facade kits; nothing modelled here."],"details":[{"num":"1.2.1.1","text":"Facade grammar per block class: which kit, how many floors, where the shops, carriage gates and signs go, seeded per building","done":false,"tags":[],"subs":[{"text":"Timber-framed houses (S161) in the old core; plastered stone houses (S162) on the main streets with wooden shopfronts (S158) under French windows (S157); the few post-war blocks (S163) at the edge; ateliers (S164) by the river","done":false},{"text":"Roofs, dormers and balconies (S159), painted and hanging signs (S160) by the shop kinds of the street","done":false}],"notes":[]},{"num":"1.2.1.2","text":"The town's mix: plaster fronts in creams, ochres and greys, a stone hôtel behind its gate, a leaning timber house, a later infill where one burnt","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"1.2.1.3","text":"Night: a seeded few windows lit warm or TV-blue behind the shutters, some flickering, most dark","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.1.4","text":"Decay by street: shutters closed or hanging, broken windows, soot above burnt ones, quarantine tape across doors (the kits' states)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.1.5","text":"House numbers on blue enamel plates by the doors","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.1.6","text":"Round 1 · composition: three street views (old core, a main street, the river ateliers) for variety; no two neighbours alike","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.1.7","text":"Round 2 · night and decay: the same views at night and in the abandoned state","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.1.8","text":"Review: the three views, day and night","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.2.2","name":"Window kit","status":" ","id":"S157","from":"","needs":"S141","size":"L","asset":"complex","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=windows`","tags":["#art"],"ready":true,"notes":[],"details":[{"num":"1.2.2.1","text":"Card: photos of old Paris windows: tall French casements (fenêtres à la française) with small panes, louvred wooden shutters folding against the wall, low iron railings across the opening (garde-corps), the small windows of the timber houses, post-war ribbon glazing for the few new blocks","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.2.2","text":"Round 1 · form: sizes and proportions per kind (tall, narrow, regular), how deep each sits in the wall, sills, the plaster or stone surrounds","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.2.3","text":"Round 2 · structure: frames and glazing bars, the shutters' louvres, hinges and catches, the garde-corps' bars and scrolls, drip edges","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.2.4","text":"Round 3 · surface: old glass that reflects the sky unevenly, dirt in the frame corners, flaking paint on the frames and shutters, net curtains behind some","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.2.5","text":"States: open, shut, shutters closed, broken (shards left in the frame), boarded, burnt with soot above; lit warm, TV-blue or dark at night (emission)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.2.6","text":"Review: each kind at 1 m and on a test wall at 10 m, by day and night","done":false,"tags":[],"subs":[],"notes":["Under way: the tall French casement `window_french` (card `references/elements/window_french.md`, family `tools/models/props/windows.py`) has its references, round 1 and round 2 (the cast garde-corps, pentures and pins, catch and bolt, jet d'eau, battement, the sill's drip; built, sketch close-ups, the rack's sheet not shot); the timber houses' small casement and the post-war ribbon glazing are the family's next elements, each with its own card."]}]},{"num":"1.2.3","name":"Shopfront kit","status":" ","id":"S158","from":"","needs":"S141, S157","size":"L","asset":"complex","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=shopfronts`","tags":["#art"],"ready":false,"notes":[],"details":[{"num":"1.2.3.1","text":"Card: photos of old Paris shopfronts: the wooden front applied to the house (devanture en applique) with pilasters, a deep fascia and the side boxes that hold the night shutters, painted in dark green, oxblood or black","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.2.3.2","text":"Round 1 · form: bay widths, the glazed front and its door, the fascia, the shutter boxes, awning depths","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.3.3","text":"Round 2 · structure: the panels and mouldings, small-paned shop windows, the wooden shutter panels put up at night, the bars across them, striped fabric awnings (stores) on arms, a stone step, counters and shelves seen through the glass","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.3.4","text":"Round 3 · surface: gilded or painted lettering on the fascia, posters and prices in the windows, dirty glass, flaking paint, tags on the shutters","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.2.3.5","text":"States: open, shutters up, half shuttered, forced (panels torn off), looted (glass out, shelves bare)","done":false,"tags":["#loot"],"subs":[],"notes":[]},{"num":"1.2.3.6","text":"Review: a row of six fronts at 1 m and 10 m","done":false,"tags":[],"subs":[],"notes":["Under way: `shopfront` (card `references/elements/shopfront.md`, family `tools/models/props/shopfronts.py`): the central-door layout with its night shutters has its references, round 1 and round 2 (fluted pilasters with console capitals, the fascia's end blocks, letterbox and kick plate, studded shutters, the rolled store, the shop's counter and shelves); the other layouts (tall glass without the hed","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.5.6","text":"Review: an office corner at eye height","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/office.py`: `desk` (laminate top, steel frame, pedestal with its top drawer pulling out), `office_chair`, `filing_cabinet` (four drawers, the top one pulling out on its files), `shelving` (archive boxes and binders seeded), `desk_computer` (monitor, keyboard, mouse, phone, tower), `beam_seating`, `vending_machine` (coils of goods, lit panel) and `water_cooler` have round 1, built (no photos yet: Commons refused requests). `reception_counter` too. Left: photos, the knocked-over and ransacked states, rounds 2 and 3."]}]},{"num":"1.3.6","name":"Light fittings and signs","status":" ","id":"S194","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=fittings`","tags":["#art","#map"],"ready":true,"notes":[],"details":[{"num":"1.3.6.1","text":"Card: recessed and hanging tube fixtures, emergency lights, exit signs (the green running figure, SORTIE DE SECOURS), switches, fire alarm points, extinguishers","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.3.6.2","text":"Round 1 · form: sizes and mountings","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.6.3","text":"Round 2 · structure: diffusers and bare tubes, chains and wires, the exit sign's box, switch plates","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.6.4","text":"Round 3 · surface: dead insects in the diffusers, yellowed plastic, dust","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.3.6.5","text":"States: lit, dead, flickering, hanging by one wire (the swing of S108)","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"1.3.6.6","text":"Review: a ceiling at night with every state","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/fittings.py`: `tube_light` (two-tube batten on chains, lit), `exit_sign` (the BAES with its lit green face), `extinguisher` (on its bracket) and `alarm_point` have round 1, built. `emergency_light` (the BAES d'ambiance) and `switch_socket` too; the louvre panel is in `ceiling_grid`. Left: the states (dead, flickering, hanging by one chain: S108), rounds 2 and 3."]}]},{"num":"1.3.7","name":"Elevator","status":" ","id":"S195","from":"","needs":"S141, S191","size":"M","asset":"complex","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=elevator`","tags":["#art","#map"],"ready":false,"notes":[],"details":[{"num":"1.3.7.1","text":"Card: a hospital elevator: the car, the landing doors, the shaft","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.7.2","text":"Round 1 · form: a car a bed fits in, the shaft and pit, landing doors","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.7.3","text":"Round 2 · structure: the car's panel, mirror and handrail, the door tracks and the gap to pry, guide rails, cables, the ladder in the shaft","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.7.4","text":"Round 3 · surface: brushed steel with scratches, grime in the tracks, the emergency light inside","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.7.5","text":"States: stuck between floors, doors pried apart","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.7.6","text":"Review: from the landing and from inside","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.3.8","name":"Clutter","status":" ","id":"S196","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=clutter`","tags":["#art","#map"],"ready":true,"notes":[],"details":[{"num":"1.3.8.1","text":"Card: papers and folders, broken glass, food packaging, phones, cups, bags, a fallen picture frame, cables","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.8.2","text":"Round 1 · form: sizes, and how they lie on a floor","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.8.3","text":"Round 2 · structure: folded and crumpled papers, shards, packaging shapes","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.8.4","text":"Round 3 · surface: print as texture (no real brands), stains, blood","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.3.8.5","text":"Review: a floor of it at 1 m","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/clutter.py`: `papers` (an office floor's sheets, folder, cup, phone, pen), `shards` (a window's glass on a floor) and `picture_frame` (fallen face to the wall, its glass out) have round 1, built. `food_litter` (packets, cans, a cup, a bag, a pizza box) too. Left: cables, photos, rounds 2 and 3."]}]},{"num":"1.3.9","name":"Barricades","status":" ","id":"S055","from":"","needs":"S014, S054, S153","size":"M","asset":"","rounds":"","test":"`tests/test_barricade.gd`","see":"","tags":["#art","#map"],"ready":false,"notes":[],"details":[{"num":"1.3.9.1","text":"Barricade point on doors and windows: holds up to five planks","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.9.2","text":"Building: hold use, a plank from the inventory goes up with a hammer animation, three knocks, each plank at a slightly different angle","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"1.3.9.3","text":"Zombies attack it: planks crack, splinter and fly off one at a time, arms reach through the gaps","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.9.4","text":"Repair while it stands","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.9.5","text":"Shooting through the gaps works, planks are bullet cover otherwise","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.3.9.6","text":"Plank piles as pickups","done":false,"tags":["#loot"],"subs":[],"notes":[]},{"num":"1.3.9.7","text":"State through `get_state` / `apply_state`","done":false,"tags":[],"subs":[],"notes":[]}]}]},{"num":"1.4","name":"Assets: streets, vehicles and street dressing","q":"Do we have the roads, kerbs, street signs, lamps, cars and the wreckage of the evacuation?","tags":["#art"],"items":[{"num":"1.4.1","name":"Road surface","status":" ","id":"S041","from":"","needs":"S040, S155","size":"L","asset":"complex","rounds":"3","test":"`tests/test_road_surface.gd`","see":"`--host --shot-cam` over the rue du Marché, `--street-rack`","tags":["#art"],"ready":false,"notes":["Inside the mission areas first (S051, S249); the rest of the town is S259."],"details":[{"num":"1.4.1.1","text":"Surfaces as vertex colour and one shared material, no textures","done":false,"tags":[],"subs":[{"text":"Pavés: square sandstone and granite setts in rows on the old streets, the squares and the quays, slightly domed each, the joints dark; drawn in vertex colour with height noise","done":false},{"text":"The old lanes dished to a gutter (ruisseau) down the middle, as before pavements","done":false},{"text":"Asphalt on the main streets: dark, patched, a lighter worn track per lane","done":false}],"notes":[]},{"num":"1.4.1.2","text":"Markings as thin overlay meshes in one draw per street, French style","done":false,"tags":[],"subs":[{"text":"White dashed centre and lane lines on the asphalt, none on the setts","done":false},{"text":"Zebra crossings (passages piétons) as white bars, on the setts too","done":false},{"text":"BUS lettering and lanes near the bus station, painted arrows, give-way triangles, yellow zigzags at the bus stops, parking bays and PAYANT lettering","done":false}],"notes":[]},{"num":"1.4.1.3","text":"The road details of S155 placed: manholes, gutters and kerb drains, raised crossings, cracks and potholes seeded per street, setts missing in patches","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.4.1.4","text":"Camber: the main streets crowned, the old lanes falling to the middle","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.1.5","text":"`--street-rack`: a 30 m strip of every surface and marking side by side","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.1.6","text":"Round 1 · form: the strips' crowns and dishes, kerb lines and the markings' widths against the card's French references","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.1.7","text":"Round 2 · structure: the setts' rows and joints, sunk and lifted ones, asphalt patches over setts, faded and cracked paint","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.1.8","text":"Round 3 · wet and night: the same strips at night and wet (S110 when it exists), lamp pools, the setts' shine, water running in the ruisseau","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.1.9","text":"Review: the street rack sheet and the rue du Marché shot","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.4.2","name":"Sidewalks","status":" ","id":"S042","from":"","needs":"S040, S156","size":"M","asset":"complex","rounds":"3","test":"`tests/test_sidewalks.gd`","see":"`--host --shot-cam` on a street corner, `--street-rack`","tags":["#art","#anim"],"ready":false,"notes":["Inside the mission areas first (S051, S249); the rest of the town is S259."],"details":[{"num":"1.4.2.1","text":"Kerb as a real 12 to 15 cm step of long granite blocks, players and zombies walk it without a jump","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.2","text":"Paving kinds by street","done":false,"tags":[],"subs":[{"text":"Poured grey asphalt pavements with the granite kerb, the Parisian kind","done":false},{"text":"Stone flags on the squares and in front of the public buildings","done":false},{"text":"No pavement in the narrowest lanes: setts wall to wall, stone bollards (bornes chasse-roues) guarding the house corners and the carriage gates","done":false}],"notes":[]},{"num":"1.4.2.3","text":"Dropped kerbs at the portes cochères and crossings, studded tactile strips at corners","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.4","text":"Tree pits with cast-iron grilles on the main streets; the walls, railings and gates of S156 where buildings stand back","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.5","text":"Sidewalks are nav cells: zombies use them, hordes spill onto the road","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.6","text":"Round 1 · form: kerb heights and pavement widths per street, the flags' sizes against the photos","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.7","text":"Round 2 · structure: joints, cracked and patched asphalt, broken kerb stones, the bornes' worn tops","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.8","text":"Round 3 · surface: grime, gum, stains, moss and weeds in the joints, darker where wet","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.2.9","text":"Review: the street rack and the corner shot beside the references","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.4.3","name":"Road details: manholes, drains, humps","status":" ","id":"S155","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=road_details`","tags":["#art","#vfx"],"ready":true,"notes":[],"details":[{"num":"1.4.3.1","text":"Card: photos of French manhole covers (regards), kerb drains (bouches d'égout) with their cast-iron mouths, the stone gutter channels, raised crossings","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.3.2","text":"Round 1 · form: round and square covers with their frames, the kerb drain's mouth and its stone, the gutter's dish, the raised crossing's ramps","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.3.3","text":"Round 2 · structure: cast patterns and lettering on the covers (the town's invented name and arms), the grate bars, the crossing's painted marks, setts laid round the covers","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.3.4","text":"Round 3 · surface: rust and polish where tyres pass, leaves and silt in the drains, faded paint, patches and potholes as decals with depth","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.3.5","text":"States: a missing cover (an open hole), a drain overflowing in rain (S110)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.3.6","text":"Review: the rack and a street strip at 1 m and 10 m","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/road.py`: `manhole` (round cover in its square frame, after a Paris regard: rings, EAUX / ÉGOUTS cast round the ring, slot, the checker of studs baked by `road.Checker`, the shaft and rungs; the cover a part that lies pried off), `manhole_square` (radiating diamonds) and `valve_cover` (GAZ) have references and round 1, built. `gully_grate` (two slotted grates in a concrete surround) and `speed_hump` (a flat-topped hump with its painted teeth) have round 1 too. Left: the kerb drain's mouth in the kerb (bouche d'égout; no square-on reference found yet), the gutter's dish, rounds 2 and 3."]}]},{"num":"1.4.4","name":"Bridges","status":" ","id":"S165","from":"","needs":"S141","size":"M","asset":"complex","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=bridges`","tags":["#art"],"ready":true,"notes":[],"details":[{"num":"1.4.4.1","text":"Card: photos of old Paris bridges: a stone bridge of round arches with half-round bays over the piers, and an early cast-iron footbridge","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.4.2","text":"Round 1 · form: deck widths and spans, the arches and piers in the water, pavements; a road bridge and a footbridge","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.4.3","text":"Round 2 · structure: stone parapets with copings and the bays' benches, the piers' cutwaters, carved masks on the cornice, lanterns on the parapet, the footbridge's iron arches and wooden deck","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.4.4","text":"Round 3 · surface: stains below the spouts, moss at the waterline, graffiti under the arches, rust on the ironwork","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.4.5","text":"Review: each bridge from the quay and from the water at 10 m and 50 m","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/bridges.py`: `bridge_stone` (three elliptical arches, archivolts, cutwaters rising into half-round bays with benches, cornice on corbels with masks, parapet, road and pavements; ashlar painted) and `bridge_foot` (one cast-iron span of five ribs with rings, oak deck, railings, lanterns) have round 1, built (the Pont Neuf's photos on the stone bridge's card; the footbridge's still to fetch: Commons refused requests). Left: the footbridge's photos, the demi-lunes' corbels, lanterns on the stone parapet, steps to the lower quay, rounds 2 and 3."]}]},{"num":"1.4.5","name":"Street lamps","status":" ","id":"S166","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=lamps_street`","tags":["#art"],"ready":true,"notes":[],"details":[{"num":"1.4.5.1","text":"Card: the réverbère of about 1800 (a lantern with a reflector hung on a rope across the street), the lantern on an iron wall bracket (potence), the cast-iron candelabrum of the main streets and quays, the modern mast on the outer roads","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.5.2","text":"Round 1 · form: the lanterns' shapes, the brackets' curves, the candelabrum's height, base and arms","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.5.3","text":"Round 2 · structure: the réverbère's glass, reflector and hook, the bracket's scrolls, the candelabrum's base with its access door and fluted column, the lantern's panes and crown","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.5.4","text":"Round 3 · surface: dark green or black paint with chips, stickers on the posts, rust at the foot, insects in the glass","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.5.5","text":"States: lit (warm, a little flicker in the old lanterns), dead, flickering (S108), bent by a crash, a lantern hanging askew","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.5.6","text":"Review: each lamp at 1 m and 10 m, and lit at night","done":false,"tags":[],"subs":[],"notes":["Under way: family `tools/models/props/lamps.py`: `lamp_post` (Marville's cast-iron candélabre: slab, pedestal with cartouches, bell, collar, leaves and flutes, capital, the shared lantern lit) and `wall_lantern` (the same lantern on a scrolled wall bracket) have references and round 1, built. `lamp_mast` (the modern mast: conical pole, arm, flat lit head) and `reverbere` (the 1800 lantern with its reflector, hook and rope stubs) have round 1 too. Left: rounds 2 and 3, the lit / dead / flickering switch per instance (S046)."]}]},{"num":"1.4.6","name":"Lantern ropes and wires","status":" ","id":"S167","from":"","needs":"S141","size":"L","asset":"complex","rounds":"4","test":"`tests/test_elements.gd`","see":"`--prop-rack=poles`","tags":["#art"],"ready":true,"notes":["What hangs in the air of the old town is the réverbères' ropes across the streets, run through pulleys to a locked box on the wall to lower them; wooden poles only on the hill road and the outskirts."],"details":[{"num":"1.4.6.1","text":"Card: engravings and photos of réverbères on their ropes, the wall boxes and pulleys, later wires on wall brackets, wooden poles with crossarms on the edge of town","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.6.2","text":"Round 1 · form: the anchors' heights, the ropes' spans across a street, the boxes' size, the pole heights and crossarms' levels","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.6.3","text":"Round 2 · structure: pulleys and hooks, the wall box with its iron door and lock, wall brackets with insulators, the pole's crossarms, stays and their ground anchors, cable boxes at the poles' foot","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.6.4","text":"Round 3 · surface: weathered grey wood with cracks, rust on the fittings, stapled flyers, stencilled numbers","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.6.5","text":"Round 4 · cables: catenaries with their sag, the lantern's weight pulling the span into a V, wires between poles along the hill road, a few broken and hanging down","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.6.6","text":"States: a rope cut and its lantern smashed in the street, a leaning pole, sparks (S114)","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.4.6.7","text":"Review: a street of three spans and a stretch of hill road at 10 m, and a wall box at 1 m","done":false,"tags":[],"subs":[],"notes":["Under way: in `tools/models/props/lamps.py`: `reverbere` (the lantern on its hook, the rope's start each way) and `rope_box` (the locked wall box, pulley and rope) have round 1, built. `utility_pole` (crossarms, insulators, wires, stay) and `wall_insulators` (the bracket where the wires meet a house) too. Left: the spans as catenaries between anchors, seeded per street, rounds 2 to 4."]}]},{"num":"1.4.7","name":"Traffic lights","status":" ","id":"S168","from":"","needs":"S141","size":"M","asset":"simple","rounds":"3","test":"`tests/test_elements.gd`","see":"`--prop-rack=traffic_lights`","tags":["#art"],"ready":true,"notes":[],"details":[{"num":"1.4.7.1","text":"Card: photos of French traffic lights on short poles at the kerb, with the small repeater lights at eye height and the pedestrian heads","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.7.2","text":"Round 1 · form: poles, signal heads with three lenses, the repeaters, pedestrian heads, the controller cabinet","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.7.3","text":"Round 2 · structure: visors, backplates, push-button boxes, the cabinet's door and vents, bolts and clamps","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.4.7.4","text":"Round 3 · surface: faded paint, dirty lenses, stickers on the poles and cabinet","done":false," ear`, `start_revive`, `client_revive`); damage, a sprint, walking off or letting go cancels it; the bleed-out clock waits while it runs","done":true},{"text":"The progress ring round the crosshair (`ProgressRing`, `Hud.ring_for`), for heals too","done":true}],"notes":[]},{"num":"1.13.6.5","text":"Revived at partial HP with a get-up animation and brief invulnerability","done":true,"tags":["#anim"],"subs":[{"text":"`Config.REVIVE_HP` and `Config.REVIVE_INVULN` seconds in which nothing hurts them","done":true},{"text":"The get-up animation (`Humanoid.Anim.GETUP` for `Config.GETUP_TIME` on others, the view rising for yourself)","done":true}],"notes":[]},{"num":"1.13.6.6","text":"Zombies prefer standing players, finish downed ones when nobody else is near","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.13.6.7","text":"All downed at once fails the mission","done":true,"tags":[],"subs":[],"notes":[]}]},{"num":"1.13.7","name":"Death and spectating","status":"x","id":"S017","from":"","needs":"S016","size":"M","asset":"","rounds":"","test":"`tests/test_spectate.gd`","see":"","tags":["#gameplay"],"ready":false,"notes":[],"details":[{"num":"1.13.7.1","text":"Death camera: pulls back and up from the body, slow orbit, zombies feed on the corpse","done":true,"tags":[],"subs":[],"notes":["`Spectator.orbit_goal`; the body is `Game.player_body` (a ragdoll of their own look on every peer), zombies within `Config.FEED_RANGE` go to it (`Zombie.feed_at`, `State.FEED`, `Anim.FEED`) until someone alive comes close; `--feed` shows it"]},{"num":"1.13.7.2","text":"Spectate living teammates: next / previous, smoothed third-person follow, their HP and ammo shown","done":true,"tags":[],"subs":[{"text":"Fire and aim cycle through the standing, `Spectator`, a camera that eases behind and above them, their name, HP and gun on screen (`Game.spectate_text`)","done":true},{"text":"Their ammo: the magazine travels in `client_state` and in the player snapshot (`PlayerWire` 24 bytes, `mag`)","done":true}],"notes":[]},{"num":"1.13.7.3","text":"Respawn rules per mission from map data: at the next checkpoint, after a timer, or never","done":true,"tags":[],"subs":[],"notes":["`respawn` in the data: `true` at once, seconds, `\"checkpoint\"`, `false` never; the dead are `PlayerStatus.dead` (out, frozen, hidden from the others by `ACTION_DEAD`, no shooting or using) until then"]},{"num":"1.13.7.4","text":"Respawn arrival: door kicked open or drop from a truck bed, not a pop","done":true,"tags":[],"subs":[],"notes":["A drop off a truck bed: the view falls `Config.ARRIVE_DROP` (`LocalPlayer.arrive`), others see dust kicked up (`Fx.Kind.ARRIVAL`)"]},{"num":"1.13.7.5","text":"Dead players keep text chat and pings","done":true,"tags":[],"subs":[],"notes":["T opens the chat line (`Hud.open_chat`, `Game.say` → `host_chat` → `chat_line`), Z pings where you look (`Game.ping` → `host_ping` → `ping_at`, `Config.PING_TIME`); hooks `on_chat`, `on_ping`"]}]},{"num":"1.13.8","name":"Stamina and movement","status":"x","id":"S018","from":"","needs":"none","size":"M","asset":"","rounds":"","test":"`tests/test_movement.gd`","see":"","tags":["#gameplay"],"ready":false,"notes":[],"details":[{"num":"1.13.8.1","text":"Stamina: sprint drains, walking refills, empty forces a walk and heavy breathing","done":true,"tags":["#vfx","#anim"],"subs":[],"notes":[]},{"num":"1.13.8.2","text":"Crouch: lower capsule and camera, quieter steps, tighter spread","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.13.8.3","text":"Jump with coyote time, landing dip scaled by fall speed, fall damage above a height","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.13.8.4","text":"Vault over waist-high cover when sprinting into it (hands on, legs over, 0.5 s)","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.13.8.5","text":"Weight: heavy guns sprint slower","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.13.8.6","text":"Remote players show crouch and jump","done":true,"tags":[],"subs":[],"not .2","text":"Rule: every alive player inside starts the countdown, anyone leaving pauses it, downed players must be carried in or revived","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.2.3","text":"Zone look: green flare smoke column rising 30 m and leaning with the wind, ground ring of pulsing light strips, particles drifting up inside","done":true,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.14.2.4","text":"Countdown: big numerals on the HUD, beeps that rise in pitch for the last five","done":true,"tags":["#ui"],"subs":[],"notes":[]},{"num":"1.14.2.5","text":"Success: fade to white, `on_extracted`, end screen","done":true,"tags":["#ui"],"subs":[],"notes":[]}]},{"num":"1.14.3","name":"Defend objective","status":"x","id":"S023","from":"","needs":"S021","size":"M","asset":"","rounds":"","test":"`tests/test_defend.gd`","see":"","tags":["#gameplay"],"ready":false,"notes":[],"details":[{"num":"1.14.3.1","text":"Waves from map data: size, types, which closets, gap between waves","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.3.2","text":"Wave grows with player count, each wave bigger and from more directions","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.3.3","text":"Between waves: a calm with a countdown, time to barricade and restock","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.3.4","text":"Last wave does not end, it lasts until the helicopter is down","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.3.5","text":"HUD: wave number, zombies left, helicopter ETA","done":true,"tags":["#ui"],"subs":[],"notes":[]},{"num":"1.14.3.6","text":"Siren at each wave start, `on_horde_incoming` already exists","done":true,"tags":[],"subs":[],"notes":[]}]},{"num":"1.14.4","name":"Helicopter","status":"x","id":"S024","from":"","needs":"S022, S004","size":"L","asset":"","rounds":"","test":"`tests/test_helicopter.gd`","see":"`--host --map=corridor --heli --shot-at=3,6,9`","tags":["#gameplay"],"ready":false,"notes":[],"details":[{"num" ","name":"Game modes: extraction, defense, open world","status":"x","id":"S264","from":"","needs":"S021","size":"L","asset":"","rounds":"","test":"`tests/test_game_modes.gd`","see":"","tags":["#gameplay"],"ready":false,"notes":[],"details":[{"num":"1.14.9.1","text":"`GameModes.apply` builds a mode's map data on every peer from where the players start","done":true,"tags":["#net"],"subs":[],"notes":[]},{"num":"1.14.9.2","text":"Extraction: a checkpoint halfway and a way out toward the next POI, snapped to a street","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.9.3","text":"Defense: three waves round the start, the last until the helicopter is down","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.9.4","text":"Open world: day / dusk / night / dawn clock, hordes by night, a horde night every few nights, respawn","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.14.9.5","text":"Menu buttons and `--mode=`; the clock goes to late joiners in `welcome`","done":true,"tags":["#ui","#net"],"subs":[],"notes":[]}]}]},{"num":"1.15","name":"Zombie behaviour and types","q":"Do zombies sense, gather, climb and come in every kind the missions need?","tags":["#ai"],"items":[{"num":"1.15.1","name":"Room on the wire","status":"x","id":"S070","from":"","needs":"none","size":"M","asset":"","rounds":"","test":"`tests/test_zombie_wire.gd`","see":"","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.1.1","text":"Type field widened to hold twelve types, state field to hold the new states, still 13 bytes","done":true,"tags":[],"subs":[],"notes":["4 bits of type, 5 of state; the id is 24 bits now"]},{"num":"1.15.1.2","text":"Flags packed into spare bits: burning, armoured parts left, climbing, crawling","done":true,"tags":[],"subs":[],"notes":["`ZombieWire.FLAG_*` and a 4-bit `armour`; the host sets only crawling so far, the rest wait for their steps"]},{"num":"1.15.1.3","text":"Packet test at the zombie cap still passes","done":true,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.15.1.4","text":"Version byte in `welcome` so a mismatched build is refused with a clear message","done":true,"tags":["#net"],"subs":[],"notes":["`Config.PROTOCOL_VERSION` (bump it with any change to what is on the wire), sent in `request_join` and `welcome`; `Game.join_refused` takes the client back to the menu with the message"]},{"num":"1.15.1.5","text":"Interest management: when the count exceeds one packet, each client gets the nearest zombies every tick and the far ones every few ticks","done":true,"tags":[],"subs":[],"notes":["`Interest.pick`; today's cap of 60 fits in one packet with eight players, so it only starts to matter above `Interest.budget`. Clients keep a zombie that missed a packet for `Config.ZOMBIE_STALE` seconds"]}]},{"num":"1.15.2","name":"Senses and ambient zombies","status":" ","id":"S072","from":"","needs":"S020, S071","size":"L","asset":"","rounds":"","test":"`tests/test_zombie_senses.gd`","see":"","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.2.1","text":"States before CHASE: DORMANT (standing still, lying, slumped in a car), FEEDING (kneeling on a corpse), WANDER","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.2.2","text":"Sight cone and range, shorter in the dark, widened by a flashlight shining on them","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.2.3","text":"Hearing from the noise system","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"1.15.2.4","text":"Alert: head snaps up, a scream that wakes others within a radius, then the chase","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"1.15.2.5","text":"Feeding animation: kneel, tear, head jerks up with a strip, blood on the mouth","done":false,"tags":["#vfx","#anim"],"subs":[],"notes":[]},{"num":"1.15.2.6","text":"Trapped ones: behind glass slapping it, seat-belted in cars, under a gate reaching out","done":false,"tags":["#sound"],"subs":[],"notes":[]},{"num":"1.15.2.7","text":"Banging on a closed door in rhythm, the door shakes","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.2.8","text":"Sneaking past is possible: crouch, no light, suppressed guns","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.15.3","name":"Crowd movement","status":" ","id":"S073","from":"","needs":"S052","size":"M","asset":"","rounds":"","test":"`tests/test_crowd.gd`","see":"","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.3.1","text":"Separation steering so a horde spreads across the street instead of stacking","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.3.2","text":"Lanes: fast ones overtake on the outside","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.3.3","text":"Funnel at doors and gaps: pressure builds, the ones in front are pushed through","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.3.4","text":"Shoving reactions: a staggered zombie bumps its neighbours into a stumble","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"1.15.3.5","text":"Tripping over corpses and crawlers at a seeded chance, pinned in tests","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.3.6","text":"Host tick cost at the zombie cap stays in budget (S009)","done":false,"tags":["#perf"],"subs":[],"notes":[]}]},{"num":"1.15.4","name":"Climbing and vaulting","status":" ","id":"S074","from":"","needs":"S071, S255","size":"L","asset":"","rounds":"","test":"`tests/test_zombie_climb.gd`","see":"`--host --demo --climb`","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.4.1","text":"Nav links typed VAULT (waist high), CLIMB (up to a floor), DROP","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.4.2","text":"Vault animation: hands slap the top, belly over, tumble down the other side, get up","done":false,"tags":["#sound","#anim"],"subs":[],"notes":[]},{"num":"1.15.4.3","text":"Climb animation: jump, grab the edge, feet scrabble, pull up; fingers show on the ledge first","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"1.15.4.4","text":"Drop: fall, heavy landing, a broken ankle limp at a seeded chance","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.4.5","text":"Windows: head and arms through, drag the body over the sill, glass tears at them","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.4.6","text":"Shot while climbing: falls back onto the ones below","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.4.7","text":"Cars are vaulted over, fences climbed, barricades clawed at first","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.15.5","name":"Zombies through stairs, doors and floors","status":" ","id":"S255","from":"","needs":"S051","size":"L","asset":"","rounds":"","test":"`tests/test_zombie_levels.gd`","see":"`--mission=mirante --bot`, `--house-rack --zombies`","tags":["#ai"],"ready":false,"notes":["Today zombies can't climb the lookout tower's stairs or the hospital's fire stair, and can't come into the open houses (their grid has the block solid)."],"details":[{"num":"1.15.5.1","text":"The area's navigation has levels: stairs, landings, decks and floors as linked cells, not only the ground grid","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.5.2","text":"Doorways of open houses and the POIs' interiors are links; a shut door blocks until it is broken","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.5.3","text":"Zombies follow players up the tower and the fire stair, into houses and from floor to floor","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.5.4","text":"The director's closets may be inside (a house's court, a stair)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.5.5","text":"Host tick at the zombie cap stays in budget","done":false,"tags":["#perf"],"subs":[],"notes":[]}]},{"num":"1.15.6","name":"Crawler","status":" ","id":"S075","from":"","needs":"S071, S242","size":"S","asset":"","rounds":"","test":"`tests/test_zombie_crawler.gd`","see":"","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.6.1","text":"Spawns legless: under cars, in stairwells, under beds","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.6.2","text":"Silent until close, grabs an ankle: the player is slowed until it is shoved or shot","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.6.3","text":"Hard to see: low, in the dark, flashlights help","done":false,"tags":["#vfx"],"subs":[],"notes":[]}]},{"num":"1.15.7","name":"Bloater","status":" ","id":"S076","from":"","needs":"S070, S004, S238","size":"M","asset":"","rounds":"","test":"`tests/test_zombie_bloater.gd`","see":"`--zombie-rack=1`","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.7.1","text":"Slow waddle, gurgling","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.7.2","text":"Death or close contact: bursts","done":false,"tags":[],"subs":[{"text":"Belly swells for 0.4 s first as a warning","done":false},{"text":"Wet explosion: chunks, a ring of bile on the floor, a green mist cloud that lingers","done":false},{"text":"Damage and a knock-back in the radius, bile on the screen of players caught","done":false}],"notes":[]},{"num":"1.15.7.3","text":"Bile puddle draws other zombies to it","done":false,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.15.7.4","text":"Kill it at range, or use it against a horde","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.15.8","name":"Spitter","status":" ","id":"S077","from":"","needs":"S070, S004, S239","size":"M","asset":"","rounds":"","test":"`tests/test_zombie_spitter.gd`","see":"","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.8.1","text":"Keeps distance, climbs to high ground, strafes between spits","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.8.2","text":"Spit: rears the head back with a throat bulge, then a glowing green arc with a drip trail","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.8.3","text":"Lands as an acid pool: bubbles, steam wisps, eats HP while stood in, fades in seconds","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.8.4","text":"Host simulates the arc; clients get start, velocity and time","done":false,"tags":["#net"],"subs":[],"notes":[]},{"num":"1.15.8.5","text":"Dies easily, flees when approached","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.15.9","name":"Brute","status":" ","id":"S078","from":"","needs":"S070, S071, S240","size":"L","asset":"","rounds":"","test":"`tests/test_zombie_brute.gd`","see":"","tags":["#ai"],"ready":false,"notes":[],"details":[{"num":"1.15.9.1","text":"Armour plates on torso and arms as separate parts with their own HP; plates crack, then fly off, showing flesh","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.9.2","text":"Charge: lowers the shoulder, paws the ground, a straight run that throws players and zombies aside and ends in a stumble if it misses","done":false,"tags":["#anim"],"subs":[],"notes":[]},{"num":"1.15.9.3","text":"Smashes doors and barricades in one hit, flips small wrecks aside","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.9.4","text":"Ground slam at close range with a dust ring and a camera shake","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.9.5","text":"Weak spot: the head and the back after a missed charge","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.9.6","text":"At most one or two alive (director budget)","done":false,"tags":["#perf"],"subs":[],"notes":[]}]},{"num":"1.15.10","name":"Screamer","status":" ","id":"S079","from":"","needs":"S070, S028, S241","size":"M","asset":"","rounds":"","test":"`tests/test_zombie_screamer.gd`","see":"","tags":["#ai","#sound"],"ready":false,"notes":[],"details":[{"num":"1.15.10.1","text":"On sight of a player it stands still, arches back and screams for three seconds","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.10.2","text":"The scream is visible: ripple rings of distorted air, nearby glass rattles, the player's view trembles","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.10.3","text":"Finished scream calls a horde through the director; killing it mid-scream stops it","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.10.4","text":"Runs away between screams","done":false,"tags":[],"subs":[],"notes":[]}]},{"num":"1.15.11","name":"Armoured dead","status":" ","id":"S080","from":"","needs":"S070","size":"M","asset":"","rounds":"","test":"`tests/test_zombie_armour.gd`","see":"","tags":["#ai"],"ready":true,"notes":[],"details":[{"num":"1.15.11.1","text":"Soldier: helmet stops pistol and SMG headshots until knocked off, vest halves torso damage","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.11.2","text":"Riot cop: visor helmet, limb pads, sometimes still holding a shield in front","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.11.3","text":"Firefighter: helmet and thick coat, immune to fire","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.11.4","text":"Helmets are parts: a hit knocks them off with a clang and they roll away","done":false,"tags":[],"subs":[],"notes":[]},{"num":"1.15.11.5","text":"Bullets on armour spark and ricochet instead of bleeding","done":false,"tags":["#vfx"],"subs":[],"notes":[]},{"num":"1.15.11.6","text":"Weighted by place: soldiers at the barracks, cops at checkpoints","done":false,"tags":[],"subs":[],"notes":[]}]}]},{"num":"1.16","name":"Foundations and tools","q":"Are the shared systems and the tools that check them in place?","tags":["#tool"],"items":[{"num":"1.16.1","name":"Mind map of this file","status":"x","id":"S001","from":"","needs":"none","size":"S","asset":"","rounds":"","test":"`python tools/steps_map.py --check`","see":"open `references/steps_map.html`","tags":["#tool"],"ready":false,"notes":[],"details":[{"num":"1.16.1.1","text":"`tools/steps_map.py` parses the format above","done":true,"tags":[],"subs":[{"text":"Fails with file and line on a broken id, duplicate id, unknown `needs`, or ition on walkable nav, every spawn closet out of sight of every player spawn, ids unique","done":true,"tags":["#anim"],"subs":[],"notes":[]},{"num":"1.16.2.5","text":"`--zones` debug flag draws zones, closets and routes as coloured wireframes","done":true,"tags":["#perf"],"subs":[],"notes":[]}]},{"num":"1.16.3","name":"Mission hooks","status":"x","id":"S003","from":"","needs":"none","size":"S","asset":"","rounds":"","test":"`tests/test_hooks_mission.gd`","see":"","tags":["#tool"],"ready":false,"notes":[],"details":[{"num":"1.16.3.1","text":"`on_mission_started(mission)`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.2","text":"`on_objective_reached(objective_id, by_player)`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.3","text":"`on_extraction_ready(zone)`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.4","text":"`on_extracted(player_ids)`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.5","text":"`on_mission_failed(reason)`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.6","text":"`on_checkpoint_reached(checkpoint_id)`","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.7","text":"`on_player_downed`, `on_player_revived`, `on_noise(position, loudness, by_player)` declared now, fired by later steps","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.3.8","text":"All host only, all visible to `spy(g)`","done":true,"tags":[],"subs":[],"notes":[]}]},{"num":"1.16.4","name":"Effects kit","status":"x","id":"S004","from":"","needs":"none","size":"L","asset":"","rounds":"","test":"`tests/test_fx_kit.gd`","see":"`--host --demo --fx-rack`","tags":["#tool"],"ready":false,"notes":[],"details":[{"num":"1.16.4.1","text":"`scripts/fx/fx.gd`: every later effect is built from these","done":true,"tags":[],"subs":[{"text":"Pooled particle bursts (CPU particles from `MeshKit` quads and boxes), never allocated in a fight","done":true},{"text":"Pooled omni lights with a life curve, never casting shadows","done":true},{"text":"Pooled decals as one MultiMesh per kind (bullet hole, scorch, crack, puddle)","done":true},{"text":"Pooled billboards (smoke puff, flash, spark) with flipbook-free animation: scale, spin, colour, alpha over life","done":true},{"text":"Trails (ribbon mesh rebuilt per frame, capped length)","done":true}],"notes":[]},{"num":"1.16.4.2","text":"One budget: `Config.FX_MAX_*` per pool, oldest is reused, test proves the cap holds under a 500-burst spam","done":true,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.16.4.3","text":"One wire: `Game.play_fx(kind, position, direction, arg)` on the host, sent as the reliable `world_fx` RPC on its own channel, every peer plays it locally","done":true,"tags":["#net"],"subs":[],"notes":[]},{"num":"1.16.4.4","text":"Quality tiers LOW / MEDIUM / HIGH scale counts and lifetimes","done":true,"tags":["#perf"],"subs":[],"notes":[]},{"num":"1.16.4.5","text":"`--fx-rack` shows every registered effect looping in a row, labelled","done":true,"tags":[],"subs":[],"notes":[]}]},{"num":"1.16.5","name":"Sound engine","status":"x","id":"S005","from":"","needs":"none","size":"L","asset":"","rounds":"","test":"`tests/test_sfx.gd`","see":"","tags":["#tool","#sound"],"ready":false,"notes":[],"details":[{"num":"1.16.5.1","text":"`sfx.gd` synthesis primitives, all cached `AudioStreamWAV`","done":true,"tags":[],"subs":[{"text":"Noise (white, pink, brown), sine, saw, square, FM pair","done":true},{"text":"Envelopes (attack, decay, sustain, release), exponential tails","done":true},{"text":"Filters (one-pole low and high pass, band pass, comb), soft clip, bit-crush","done":true},{"text":"Layers and pitch sweep, seeded so a sound is the same on every run","done":true}],"notes":[]},{"num":"1.16.5.2","text":"Voice pool: `Config.SFX_VOICES` 3D players plus a few 2D, steals the quietest / farthest","done":true,"tags":[],"subs":[],"notes":[]},{"num":"1.16.5.3","text":"Buses made in code: Master, Guns, Zombies, World, UI, Music, each with a volume" `","done":true,"tags":["#net"],"subs":[],"notes":[]},{"num":"2.1.1.8","text":"Round 1 · day: the clear and overcast presets (sky colour, clouds, the light on the plaster) against the card's references","done":true,"tags":[],"subs":[],"notes":[]},{"num":"2.1.1.9","text":"Round 2 · dusk and night: the town's glow under the clouds, the dark hill, the moon and stars","done":true,"tags":[],"subs":[],"notes":[]},{"num":"2.1.1.10","text":"Round 3 · storm and backdrop: the storm preset, the roofscape and the hill seen from each mission's start","done":true,"tags":[],"subs":[],"notes":[]},{"num":"2.1.1.11","text":"Review: every preset from the same three viewpoints in one sheet","done":true,"tags":[],"subs":[],"notes":["Done: `TimeOfDay` (five presets as data: clear, overcast, dusk, night, storm; `Missions.INFO[..].sky`, `MapData.sky`, the host's `--time=`, sent in `welcome`), `SkyDome` (environment, sun or moon, depth fog to `fog_max` at the far plane, lightning) and one sky shader (`SkyShader`) that also paints the backdrop past the far plane (`Config.VIEW_FAR` 1200 m): the hill and the roofscape from a horizon profile worked out from the map's heights for where the camera stands, the town from above out of `CityPicture` with its lamps at night, the fires' smoke columns, and the church, campanile, telegraph tower and mill as silhouettes until S188, S214 and S230 build them. No draw call; measured 8.2 ms with 60 zombies in the city, the same as a plain sky. Card and rounds: `references/elements/sky.md`, sheets `sky_r1..r4`, `sky_rfinal`. Left: plaster reads light (the town's vertex colours are linear; the exposure makes up for it at night), the mission starts hide the backdrop behind their placeholder buildings, no drawn lightning bolt."]}]},{"num":"2.1.2","name":"Flashlight","status":" ","id":"S107","from":"","needs":"S004","size":"M","asset":"","rounds":"","test":"`tests/test_flashlight.gd`","see":"`--host --time=night --flashlight --shot-at=2`","tags":["#vfx"],"ready":tr ]},{"num":"2.6.6.4","text":"Lights anything flammable in the splash","done":false,"tags":["#vfx"],"subs":[],"notes":[]}]},{"num":"2.6.7","name":"Flashbang, noise lure, flare","status":" ","id":"S096","from":"","needs":"S093, S072","size":"M","asset":"","rounds":"","test":"`tests/test_tactical_throwables.gd`","see":"","tags":["#weapon","#sound","#vfx"],"ready":false,"notes":[],"details":[{"num":"2.6.7.1","text":"Flashbang: zombies in sight of it stagger blind for seconds; players looking at it get a white screen that fades through an after-image, and ringing","done":false,"tags":["#ui"],"subs":[],"notes":[]},{"num":"2.6.7.2","text":"Noise lure (an alarm clock taped to a pipe): rings, zombies gather on it, then it pops","done":false,"tags":[],"subs":[],"notes":[]},{"num":"2.6.7.3","text":"Road flare: red sputtering light with drifting sparks and red smoke, zombies avoid it a little, marks the extraction","done":false,"tags":[],"subs":[],"notes":[]},{"num":"2.6.7.4","text":"Each a pickup and a wheel slot","done":false,"tags":["#ui","#loot"],"subs":[],"notes":[]}]}]},{"num":"2.7","name":"Player models","q":"Do we have variable player models for the survivors?","tags":["#art","#anim"],"items":[{"num":"2.7.1","name":"Survivor models","status":" ","id":"S243","from":"","needs":"S136, S137","size":"L","asset":"complex","rounds":"4","test":"`tests/test_body_model.gd`","see":"`--host --survivor-rack`","tags":["#art","#anim"],"ready":true,"notes":[],"details":[{"num":"2.7.1.1","text":"Card: four distinct survivor looks, one per player slot, with living faces (photos of the kinds of clothing)","done":false,"tags":[],"subs":[],"notes":[]},{"num":"2.7.1.2","text":"Round 1 · form: four bodies and outfits from the garment kit: a tactical vest, a jacket, a hoodie, backpack straps","done":false,"tags":[],"subs":[],"notes":[]},{"num":"2.7.1.3","text":"Round 2 · structure: living faces (eyes, brows, a mouth that is not a zombie's), hair styles, pouches and gear","done":false,"tags":[],
