<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make Alive: steps</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #cfd6de; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.drag { cursor: grabbing; }
  #bar { position: fixed; left: 12px; top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar b { font-size: 15px; margin-right: 6px; color: #fff; }
  button, label.tog { background: #1a1f26; color: #cfd6de; border: 1px solid #333c47; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; user-select: none; }
  button:hover, label.tog:hover { border-color: #6b7a8c; }
  #legend { position: fixed; left: 12px; bottom: 10px; display: flex; gap: 14px; color: #8b97a5; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #tip { position: fixed; display: none; max-width: 440px; background: #161b22; border: 1px solid #3a4553; border-radius: 6px; padding: 9px 12px; pointer-events: none; box-shadow: 0 6px 24px #000a; }
  #tip h4 { margin: 0 0 4px; font-size: 14px; color: #fff; }
  #tip .k { color: #8b97a5; }
  #tip ul { margin: 4px 0 0; padding-left: 18px; }
  #tip code { color: #e6c07b; font-family: Consolas, monospace; font-size: 12px; }
  .link { fill: none; stroke: #2b333d; stroke-width: 1; }
  .link.done { stroke: #2f6b45; }
  .dep { fill: none; stroke: #c0843a; stroke-width: 1.1; opacity: .5; }
  .dep.hot { stroke: #ffd27a; opacity: 1; stroke-width: 2; }
  .dep.cold { opacity: .08; }
  text { fill: #8b97a5; font-size: 11px; paint-order: stroke; stroke: #0d0f12; stroke-width: 3px; stroke-linejoin: round; }
  .node { cursor: default; }
  .node.step { cursor: pointer; }
  .done > circle { fill: #3fb968; } .done > text { fill: #6fd391; }
  .start > circle { fill: #ffe066; stroke: #fff3b0; stroke-width: 2; } .start > text { fill: #fff; font-weight: 600; }
  .blocked > circle { fill: #39424d; } .blocked > text { fill: #5d6875; }
  .open > circle { fill: #7d8996; } .open > text { fill: #aab4bf; }
  .phase > circle { fill: #4a90d9; } .phase > text { fill: #dbe7f5; font-size: 13px; font-weight: 600; }
  .phase.done > circle { fill: #3fb968; }
  .root > circle { fill: #fff; } .root > text { fill: #fff; font-size: 15px; font-weight: 700; }
  .step.folded > circle { stroke-dasharray: none; }
  .step.has > circle { stroke: #0d0f12; stroke-width: 1; }
  .step.folded.has > text { text-decoration: none; }
</style>
</head>

<script>
const PHASES = [{"id": "P01", "n": "Foundations", "c": [{"id": "S001", "n": "Mind map of this file", "d": true, "start": false, "needs": [], "size": "S", "rounds": 0, "test": "`python tools/steps_map.py --check`", "see": "open `references/steps_map.html`", "notes": [], "c": [{"n": "`tools/steps_map.py` parses the format above", "d": true, "notes": [], "c": [{"n": "Fails with file and line on a broken id, duplicate id, unknown `needs`, or a `needs` cycle", "d": true, "notes": [], "c": []}, {"n": "`--next` prints the steps that can be started now", "d": true, "notes": [], "c": []}, {"n": "`--stats` prints done / total per phase", "d": true, "notes": [], "c": []}]}, {"n": "Writes `references/steps_map.html`, one self-contained file, no libraries", "d": true, "notes": [], "c": [{"n": "Radial tree: root, phases, steps, features, sub-features", "d": true, "notes": [], "c": []}, {"n": "Done nodes green, startable steps bright, blocked steps dim", "d": true, "notes": [], "c": []}, {"n": "Click a step to fold or unfold it, hover shows its spec notes and `needs`", "d": true, "notes": [], "c": []}, {"n": "Dependency arrows between steps as a toggle", "d": true, "notes": [], "c": []}]}, {"n": "Line in `CLAUDE.md` Commands", "d": true, "notes": [], "c": []}]}, {"id": "S002", "n": "Map data format", "d": true, "start": false, "needs": [], "size": "L", "rounds": 0, "test": "`tests/test_map_data.gd`", "see": "`--host --map=corridor`", "notes": [], "c": [{"n": "`scripts/world/map_data.gd`: one dictionary per mission area", "d": true, "notes": [], "c": [{"n": "Player spawns (one per player slot, facing)", "d": true, "notes": [], "c": []}, {"n": "Zombie spawn closets (position, radius, which wave uses them)", "d": true, "notes": [], "c": []}, {"n": "Horde routes (polyline from closet to the play area)", "d": true, "notes": [], "c": []}, {"n": "Zones (id, polygon or box, floor range) for extraction, checkpoints, triggers", "d": true, "notes": [], "c": []}, {"n": "Doors, lootboxes, ammo cated in a fight", "d": true, "notes": [], "c": []}, {"n": "Pooled omni lights with a life curve, never casting shadows", "d": true, "notes": [], "c": []}, {"n": "Pooled decals as one MultiMesh per kind (bullet hole, scorch, crack, puddle)", "d": true, "notes": [], "c": []}, {"n": "Pooled billboards (smoke puff, flash, spark) with flipbook-free animation: scale, spin, colour, alpha over life", "d": true, "notes": [], "c": []}, {"n": "Trails (ribbon mesh rebuilt per frame, capped length)", "d": true, "notes": [], "c": []}]}, {"n": "One budget: `Config.FX_MAX_*` per pool, oldest is reused, test proves the cap holds under a 500-burst spam", "d": true, "notes": [], "c": []}, {"n": "One wire: `Game.play_fx(kind, position, direction, arg)` on the host, sent as the reliable `world_fx` RPC on its own channel, every peer plays it locally", "d": true, "notes": [], "c": []}, {"n": "Quality tiers LOW / MEDIUM / HIGH scale counts and lifetimes", "d": true, "notes": [], "c": []}, {"n": "`--fx-rack` shows every registered effect looping in a row, labelled", "d": true, "notes": [], "c": []}]}, {"id": "S005", "n": "Sound engine", "d": true, "start": false, "needs": [], "size": "L", "rounds": 0, "test": "`tests/test_sfx.gd`", "see": "", "notes": [], "c": [{"n": "`sfx.gd` synthesis primitives, all cached `AudioStreamWAV`", "d": true, "notes": [], "c": [{"n": "Noise (white, pink, brown), sine, saw, square, FM pair", "d": true, "notes": [], "c": []}, {"n": "Envelopes (attack, decay, sustain, release), exponential tails", "d": true, "notes": [], "c": []}, {"n": "Filters (one-pole low and high pass, band pass, comb), soft clip, bit-crush", "d": true, "notes": [], "c": []}, {"n": "Layers and pitch sweep, seeded so a sound is the same on every run", "d": true, "notes": [], "c": []}]}, {"n": "Voice pool: `Config.SFX_VOICES` 3D players plus a few 2D, steals the quietest / farthest", "d": true, "notes": [], "c": []}, {"n": "Buses made in code: Master, Guns, Zombies, World, UI, Music, each with a volume", "d": true, "notes": [], "c": []}, {"n": "Distance attenuation and a low-pass by distance on every 3D voice", "d": true, "notes": [], "c": []}, {"n": "`Sfx.play(name, position, pitch_jitter)` and `Sfx.play_ui(name)` as the only entry points", "d": true, "notes": [], "c": []}, {"n": "Existing gunshot moved onto it", "d": true, "notes": [], "c": []}]}, {"id": "S006", "n": "Settings store", "d": true, "start": false, "needs": [], "size": "S", "rounds": 0, "test": "`tests/test_settings.gd`", "see": "", "notes": [], "c": [{"n": "`scripts/settings.gd` autoload, saved to `user://settings.cfg`", "d": true, "notes": [], "c": [{"n": "Mouse sensitivity, invert Y, FOV, aim-toggle or hold", "d": true, "notes": [], "c": []}, {"n": "Volume per bus", "d": true, "notes": [], "c": []}, {"n": "Graphics tier, fps cap, vsync, window mode, show draws", "d": true, "notes": [], "c": []}, {"n": "Key bindings from `controls.gd`", "d": true, "notes": [], "c": []}, {"n": "Player name", "d": true, "notes": [], "c": []}]}, {"n": "`changed(key)` signal, live apply", "d": true, "notes": [], "c": []}, {"n": "Unknown or broken file falls back to defaults without a crash", "d": true, "notes": [], "c": []}]}, {"id": "S007", "n": "Balance sheet", "d": true, "start": false, "needs": [], "size": "S", "rounds": 0, "test": "`tools\\test.ps1 balance`", "see": "", "notes": [], "c": [{"n": "`tools\\balance.ps1` prints a table: every gun against every zombie type", "d": true, "notes": [], "c": [{"n": "Shots and seconds to kill for head, torso, legs", "d": true, "notes": [], "c": []}, {"n": "Damage per magazine, kills per magazine, seconds per reload", "d": true, "notes": [], "c": []}, {"n": "Effective range from spread", "d": true, "notes": [], "c": []}]}, {"n": "Test asserts ordering rules (a sniper headshot kills a walker, the pistol is never the best DPS)", "d": true, "notes": [], "c": []}, {"n": "Writes `references/balance.md`", "d": true, "notes": [], "c": []}]}, {"id": "S008", "n": "Bot playtests", "d": true, "start": false, "needs": ["S002"], "size": "M", "rounds": 0, "test": "`tests/test_bot_scenarios.gd`", "see": "", "notes": [], "c": [{"n": "Bot can follow nav to a zone, open doors, shoot what blocks it, reload", "d": true, "notes": [], "c": []}, {"n": "Scenario format: map, mission, seed, time limit, expected outcome", "d": true, "notes": [], "c": []}, {"n": "Corridor scenarios: the bot crosses the map with the director running, and holds the spawn against a horde", "d": true, "notes": ["Fighting through a full horde in the open kills the bot most runs: no such scenario until the bot or the balance changes"], "c": []}, {"n": "Scenarios run headless at accelerated time inside the suite, total under 20 s", "d": true, "notes": [], "c": []}, {"n": "A failing scenario prints where the bot died or got stuck", "d": true, "notes": [], "c": []}]}, {"id": "S009", "n": "Performance budget", "d": true, "start": false, "needs": [], "size": "M", "rounds": 0, "test": "`tests/test_budget.gd`", "see": "", "notes": [], "c": [{"n": "Per map: mesh, surface, light, shadow caster and collision shape counts, and the surfaces in view from a fixed set of cameras (the headless stand-in for draw calls)", "d": true, "notes": [], "c": []}, {"n": "Budgets in `Config.BUDGET_*`, test fails when a map goes over", "d": true, "notes": [], "c": []}, {"n": "Zombie count cap per map proven: host tick time with the cap alive stays under the frame", "d": true, "notes": [], "c": []}, {"n": "Snapshot size at the cap fits one packet", "d": true, "notes": ["Players are packed by `PlayerWire` (22 bytes each), names travel once through `Game.player_names`", "Zombie positions are sent relative to an anchor, so they survive anywhere in the city"], "c": []}, {"n": "`tools\\perf.ps1` windowed run prints average and worst frame over 30 s with a horde", "d": true, "notes": [], "c": []}]}, {"id": "S010", "n": "Screenshot gallery", "d": true, "start": false, "needs": [], "size": "S", "rounds": 0, "test": "", "see": "`tools\\shots.ps1`", "notes": [], "c": [{"n": "`tools\\shots.ps1` takes a fixed set of shots into `references/shots/` (ignored by git)", "d": true, "notes": [], "c": [{"n": "Gun rack, zombie racks front and back, fx rack", "d": true, "notes": [], "c": []}, {"n": "One street view and one landmark view per mission", "d": true, "notes": [], "c": []}, {"n": "Viewmodel in aim, sprint, reload for the current weapon", "d": true, "notes": [], "c": []}]}, {"n": "`--shot-cam=x,y,z,yaw,pitch` places a free camera so shots repeat exactly, `--poi-cam` looks at a mission's place", "d": true, "notes": [], "c": []}, {"n": "Contact sheet `references/shots/index.html`", "d": true, "notes": [], "c": []}]}, {"id": "S140", "n": "Element pipeline and review loop", "d": true, "start": false, "needs": ["S136"], "size": "L", "rounds": 0, "test": "`tests/test_elements.gd`", "see": "`python tools/models/review.py hydrant`", "notes": ["Props, building parts, vehicles and guns are made the way the characters are: Python geometry, baked and exported by Blender into `assets/models/props/`, never edited by hand. GDScript boxes stay only for blockouts and the test maps."], "c": [{"n": "`python tools/models/props.py <name>` builds one element from `tools/models/props/<family>.py`; `--sketch` draws it flat-shaded without Blender in seconds, `--quick` shapes only", "d": true, "notes": [], "c": []}, {"n": "Bake per element: albedo with ambient occlusion, a wear mask (edges, cavities, what faces the sky) painted from the card's materials, emission for anything lit, a LOD chain", "d": true, "notes": [], "c": []}, {"n": "Named moving parts and states in the .glb (doors, lids, shutters, magazines, actions, wheels; clean, abandoned, damaged, burnt), loaded by `PropModel` with their nodes; repeated elements as MultiMesh", "d": true, "notes": [], "c": []}, {"n": "Registry `scripts/models/elements.gd`: name, model, size, triangles per LOD, draws, parts, states; `tests/test_elements.gd` checks every entry (loads, size within 5 % of the card, budgets, parts, states, LODs)", "d": true, "notes": [], "c": []}, {"n": "`--prop-rack=<name>` (with `--state=` and `--part=open`) in a neutral, evenly lit room; `python tools/models/review.py <name> --round=N` shoots the sheet (eight angles, 1 m, 10 m, 50 m) beside the card's references into `references/elements/reviews/<name>_r<N>.jpg`", "d": true, "notes": [], "c": []}, {"n": "`references/elements/_template.md`, the card", "d": true, "notes": [], "c": []}, {"n": "A fire hydrant taken through three rounds as the worked example, its card and sheets kept", "d": true, "notes": [], "c": []}]}, {"id": "S141", "n": "Detail kit", "d": true, "start": false, "needs": ["S140"], "size": "L", "rounds": 0, "test": "`tests/test_elements.gd`", "see": "`python tools/models/review.py kit`", "notes": [], "c": [{"n": "Shapes: chamfered and bevelled boxes, lathed profiles, sweeps along a path (pipes, rails, handrails, cables with sag), extrusions with inset and raised panels, linear and radial arrays, window and door frames, vents and slots", "d": true, "notes": [], "c": []}, {"n": "Surfaces as geometry or bake: brick bonds, concrete block, stone setts, interlocking pavers, clay roof tiles in rows with ridge caps, corrugated and ribbed sheet, grilles and mesh, louvres, board-formed concrete", "d": true, "notes": [], "c": []}, {"n": "Lettering: block and stencil fonts as geometry or painted into the bake (signs, plates, roof paint, road words), numbers", "d": true, "notes": [], "c": []}, {"n": "Wear: chipped paint on edges, rust running from fixings, water stains below sills and joints, soot, moss and algae on shaded faces, dirt at the foot of walls, posters and graffiti as decals", "d": true, "notes": [], "c": []}, {"n": "Damage: dents, broken glass with holes and cracks, bullet pocks, a burnt version of every material, cut lines for collapse", "d": true, "notes": [], "c": []}, {"n": "The kit sheet: every helper side by side on the rack", "d": true, "notes": [], "c": []}]}]}, {"id": "P02", "n": "Survival loop", "c": [{"id": "S011", "n": "Limited ammo", "d": true, "start": false, "needs": [], "size": "M", "rounds": 0, "test": "`tests/test_ammo.gd`", "see": "", "notes": [], "c": [{"n": "Ammo types by calibre: 9 mm, 5.7, 5.8, 7.62, 9x39, 12 gauge, .338, 7.62R", "d": true, "notes": [], "c": []}, {"n": "Reserve per type in `weapon_state.gd`, reload takes from it, partial reload when short", "d": true, "notes": [], "c": []}, {"n": "Shotgun shell-by-shell reload stops when the reserve is empty", "d": true, "notes": [], "c": []}, {"n": "Dry fire: click, small viewmodel twitch, no shot sent", "d": true, "notes": [], "c": []}, {"n": "Starting reserve per mission in map data, test maps keep infinite ammo behind `GameMap.infinite_ammo`", "d": true, "notes": [], "c": []}, {"n": "Host knows each player's reserve (sent on change, not per snapshot) so pickups are honest", "d": true, "notes": [], "c": []}, {"n": "HUD shows magazine / reserve", "d": true, "notes": [], "c": []}]}, {"id": "S012", "n": "Ammo pickups and crates", "d": true, "start": false, "needs": ["S011", "S002"], "size": "M", "rounds": 0, "test": "`tests/test_ammo_pickups.gd`", "see": "`--host --map=corridor --shot-at=2`", "notes": [], "c": [{"n": "Ammo box interactable: small carton per calibre, coloured stripe, count printed as box pips", "d": true, "notes": [], "c": []}, {"n": "Ammo crate: military green, gives the held gun's type, limited uses, lid hinge animation", "d": true, "notes": [], "c": []}, {"n": "Zombie drops: seeded by zombie id, rare, soldiers and cops more often", "d": true, "notes": [], "c": []}, {"n": "Pickup feel: box hops to the player over 0.15 s, shrinks, small \"+30\" rises on the HUD", "d": true, "notes": [], "c": []}, {"n": "`on_ammo_picked_up` hook", "d": true, "notes": [], "c": []}]}, {"id": "S013", "n": "Loadout", "d": true, "start": false, "needs": ["S011"], "size": "M", "rounds": 0, "test": "`tests/test_loadout.gd`", "see": "", "notes": [], "c": [{"n": "Slots: two primaries, one sidearm, one melee", "d": true, "notes": [], "c": []}, {"n": "Picking up with full slots swaps: the old gun drops at the feet as a `WeaponPickup` with its magazine count", "d": true, "notes": [], "c": []}, {"n": "Number keys follow slots, wheel cycles, last-weapon key", "d": true, "notes": [], "c": []}, {"n": "Holster and draw animation per swap (existing draw timer), slower for heavy guns", "d": true, "notes": [], "c": []}, {"n": "Start: pistol only on missions, everything on test maps (`all_weapons`)", "d": true, "notes": [], "c": []}, {"n": "Dropped guns sync to late joiners", "d": true, "notes": [], "c": []}]}, {"id": "S014", "n": "Inventory and item wheel", "d": true, "start": false, "needs": ["S013"], "size": "L", "rounds": 0, "test": "`tests/test_inventory.gd`", "see": "`--host --map=corridor --wheel --shot-at=3`", "notes": [], "c": [{"n": "`scripts/inventory.gd`, no nodes: counted stacks with caps", "d": true, "notes": [], "c": [{"n": "Medkit, bandage, painkillers", "d": true, "notes": [], "c": []}, {"n": "Throwable slots (filled later)", "d": true, "notes": [], "c": []}, {"n": "Keys and keycards by id", "d": true, "notes": [], "c": []}, {"n": "Planks for barricades", "d": true, "notes": [], "c": []}]}, {"n": "Host owns it, client gets its own inventory on change", "d": true, "notes": [], "c": []}, {"n": "Hold a key for a radial wheel: eight wedges, icons drawn from boxes, mouse direction picks, time slows nothing", "d": true, "notes": [], "c": [{"n": "Eight wedges (`ItemWheel`, `ItemWheelView`): hold Tab, the mouse moves a pointer instead of the view, release picks", "d": true, "notes": [], "c": []}, {"n": "Icons drawn from boxes (`ItemIcons`), a little hop when a wedge is lit", "d": true, "notes": [], "c": []}]}, {"n": "Quick-use keys for heal (H) and throwable (G)", "d": true, "notes": [], "c": []}, {"n": "Drop on death as a backpack other players can loot", "d": true, "notes": ["Medkit and bandage heal at once for now; painkillers and throwables are consumed with no effect until S015 and S093 write theirs in `GameHooks.on_item_used`."], "c": []}]}, {"id": "S015", "n": "Bleeding and healing", "d": true, "start": false, "needs": ["S014"], "size": "M", "rounds": 0, "test": "`tests/test_bleeding.gd`", "see": "", "notes": [], "c": [{"n": "Bleed chance on a hit, stacks to three, ticks HP, pinned in tests", "d": true, "notes": [], "c": []}, {"n": "Bandage stops bleeding, medkit restores HP over its use time, painkillers give decaying temporary HP", "d": true, "notes": ["The medkit and bandage are spent and heal only when their use time (`Inventory.use_time`) is over; a hit or a sprint cancels them and the item stays in the pack"], "c": []}, {"n": "Use animation in first person: gun lowers, hands wrap a bandage (four eased poses), cancelled by sprint or damage", "d": true, "notes": ["`Viewmodel.heal` / `heal_goal` / `heal_t`, `HEAL_POSES`, `heal_hands(t)`; the player sets them from `status`; `--pose=heal` shows it"], "c": []}, {"n": "Others see the heal pose on the remote player", "d": true, "notes": ["`Humanoid.Anim.HEAL`, picked by `RemotePlayer.anim_for` from `PlayerWire.ACTION_HEAL`"], "c": []}, {"n": "Bleeding look: red drops from the lower screen edge, drip trail decals behind the player, heartbeat when low", "d": true, "notes": ["`BleedDrops` on the HUD, `BleedTrail` + `Game.update_drips` (every peer, from `ACTION_BLEED`), `Heartbeat` and the `heartbeat` sound"], "c": []}, {"n": "`on_player_bleeding`, `on_player_healed` hooks (and `on_item_use_cancelled`)", "d": true, "notes": [], "c": []}]}, {"id": "S016", "n": "Downed and revive", "d": true, "start": false, "needs": ["S015", "S003"], "size": "L", "rounds": 0, "test": "`tests/test_downed.gd`", "see": "`tools\\play2.ps1`", "notes": [], "c": [{"n": "At 0 HP a player is downed, not dead: bleed-out timer, pistol only, crawl speed", "d": true, "notes": ["Only while a teammate is still standing to get them up: t d ahead of the players, from map data", "d": true, "notes": ["`zombie_wanderers` in the map's data; no map lists any yet (S051 and the five places will)"], "c": []}, {"n": "Specials on a budget: at most N of each special type alive (`Config.SPECIAL_BUDGET`, only the leaper for now)", "d": true, "notes": [], "c": []}, {"n": "Stragglers that lose the players are recycled to a closet ahead", "d": true, "notes": [], "c": []}, {"n": "`--director` debug overlay: state, stress, heat", "d": true, "notes": ["The city has no closets yet, so there the director still asks `CityMap.zombie_spawn_point` (a street corner out of sight); the closets come with S051"], "c": []}]}, {"id": "S154", "n": "Helicopter model 2", "d": false, "start": false, "needs": ["S141", "S179"], "size": "L", "rounds": 4, "test": "`tests/test_helicopter.gd`", "see": "`--prop-rack=helicopter`, `--host --map=corridor --heli --shot-at=3,6,9`", "notes": ["Today it is twenty boxes (S024), and it ends every mission. `Helicopter`'s nodes and `HeliFlight` stay; the look is rebuilt."], "c": [{"n": "Card: a medium military transport helicopter of a French-style army (no one army's markings copied) (photos in `references/elements/` first), its real length and rotor span", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the fuselage's curves, the nose and its glazing, the cabin, the tail boom's taper, the fin and stabiliser, the engine housing; skids or wheels as in the photos", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: sliding doors on rails, window frames, engine intakes and exhausts, the rotor head with its hub and pitch links, blade tips, the tail rotor's gearbox, steps, antennas, the door gun's mount", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: matt olive paint with panel lines and rivet rows baked, soot behind the exhausts, oil streaks, worn walkway paint, stencilled national markings and serials", "d": false, "notes": [], "c": []}, {"n": "Round 4 · inside and night: seats along the cabin walls, cargo nets, the cockpit's panels and seats; the nav lights, strobe and beacon as emission", "d": false, "notes": [], "c": []}, {"n": "Review: the three flight shots and the rack sheet beside the photos", "d": false, "notes": [], "c": []}]}]}, {"id": "P04", "n": "Gun feel", "c": [{"id": "S029", "n": "Muzzle flash and smoke", "d": true, "start": false, "needs": ["S004"], "size": "M", "rounds": 0, "test": "`tests/test_muzzle_fx.gd`", "see": "`--host --demo --weapon=4 --bot --shot-at=1,1.05,1.1`", "notes": [], "c": [{"n": "Flash mesh at the muzzle for one or two frames: star of 3 to 5 crossed quads, random roll, random scale", "d": true, "notes": [], "c": [{"n": "Shape per gun class: small round for pistols, long forked for rifles, wide ball for shotguns, side jets for braked snipers", "d": true, "notes": [], "c": []}, {"n": "Suppressed guns: no flash, a thin grey puff", "d": true, "notes": [], "c": []}]}, {"n": "Light: one pooled omni, warm orange, 0.05 s, no shadows, only on the shooter's gun", "d": true, "notes": [], "c": []}, {"n": "It lights the viewmodel hands and the nearest walls", "d": true, "notes": [], "c": []}, {"n": "Smoke: two or three soft puffs drifting up and with the wind, 0.8 s", "d": true, "notes": [], "c": []}, {"n": "Sustained fire: barrel heat shimmer and a steady wisp from the muzzle for 2 s after a long burst", "d": true, "notes": [], "c": []}, {"n": "Remote players flash too, cheaper tier", "d": true, "notes": ["`MuzzleFlash` (shapes by `Weapons.flash_shape`), `Viewmodel.smoke` → `Game.muzzle_smoke`, `heat` / `wisp_left` / `shimmer`; the host tells the others who fired (`Game.shot_seen`, which S030 can draw tracers from)"], "c": []}]}, {"id": "S030", "n": "Tracers and bullet whiz", "d": true, "start": false, "needs": ["S004"], "size": "M", "rounds": 0, "test": "`tests/test_tracers.gd`", "see": "`tools\\play2.ps1`", "notes": [], "c": [{"n": "Tracer: thin emissive streak from muzzle to hit, 40 m long segment moving at bullet speed, fades at the end", "d": true, "notes": [], "c": []}, {"n": "Every shot for others' guns, every third for your own (clean view)", "d": true, "notes": [], "c": []}, {"n": "Colour by calibre: yellow-white rifles, faint for pistols, a fan of short ones for shotguns", "d": true, "notes": [], "c": []}, {"n": "Sniper shot: a vapour trail line that lingers 0.6 s and wobbles apart", "d": true, "notes": [], "c": []}, {"n": "Near miss from a teammate's line: whiz sound and a tiny view flinch", "d": true, "notes": [], "c": []}, {"n": "Capped, pooled", "d": true, "notes": ["`Tracers` (`game.tracers`, one MultiMesh), fed by `Game._fire` (yours) and `shot_seen` (theirs, with where the bullet stopped: `_bullet_end`); `_near_miss` whizzes; a sniper's vapour line shows on every shot"], "c": []}]}, {"id": "S031", "n": "Shell casings", "d": true, "start": false, "needs": ["S004"], "size": "M", "rounds": 0, "test": "`tests/test_casings.gd`", "see": "`--host --demo --weapon=4 --bot --shot-at=2`", "notes": [], "c": [{"n": "Casing mesh per class: brass pistol, brass rifle, red shotgun hull, long sniper case", "d": true, "notes": [], "c": []}, {"n": "Ejects from the port with the gun's own direction, speed and spin, timed with the action (bolt guns eject on the bolt pull, pumps on the pump)", "d": true, "notes": [], "c": []}, {"n": "Cheap physics: one bounce off the floor with a tumble, a second small one, then rest", "d": true, "notes": [], "c": []}, {"n": "Tink on each bounce by surface", "d": true, "notes": [], "c": []}, {"n": "Rests for a while, then sinks, capped by MultiMesh", "d": true, "notes": [], "c": []}, {"n": "A wisp of smoke from the ejection port", "d": true, "notes": ["`Casings` (`game.casings`), `Weapons.GUN_EJECT` / `casing_kind`, `Viewmodel.eject`; the tink's pitch is by kind of case until S032 gives floors their surface"], "c": []}]}, {"id": "S032", "n": "Surfaces and impacts", "d": true, "start": false, "needs": ["S004"], "size": "L", "rounds": 0, "test": "`tests/test_impacts.gd`", "see": "`--host --fx-rack`", "notes": [], "c": [{"n": "Surface kinds on collision bodies via metadata: concrete, asphalt, brick, metal, wood, glass, dirt, grass, water, flesh, tile", "d": true, "notes": [], "c": []}, {"n": "Impact per surface", "d": true, "notes": [], "c": [{"n": "Concrete: grey dust cone, chips flying, round pocked hole", "d": true, "notes": [], "c": []}, {"n": "Brick: red dust, larger chips", "d": true, "notes": [], "c": []}, {"n": "Metal: sparks with gravity that bounce once, bright flash, dented hole with a shine ring, ricochet chance with a tracer", "d": true, "notes": [], "c": []}, {"n": "Wood: splinters, pale torn hole", "d": true, "notes": [], "c": []}, {"n": "Glass: star crack decal, a spray of shards", "d": true, "notes": [], "c": []}, {"n": "Dirt and grass: clod spray, dark puff, blades of grass", "d": true, "notes": [], "c": []}, {"n": "Water: vertical splash column, ring ripples", "d": true, "notes": [], "c": []}, {"n": "Tile: white shards, cracked decal", "d": true, "notes": [], "c": []}]}, {"n": "Hole decals in the MultiMesh pool, aligned to the normal", "d": true, "notes": [], "c": []}, {"n": "Shotgun: one combined puff for the pattern plus individual holes", "d": true, "notes": [], "c": []}, {"n": "Penetration data per surface stored now, used by S101", "d": true, "notes": ["`Surface` (`scripts/world/surface.gd`: `tag`, `of_hit`, `PENETRATION`), `Fx.Kind.IMPACT` with the surface as `arg` (`IMPACT_HOLE_ONLY`, `IMPACT_PUFF_ONLY` for a shotgun's pattern); the corridor, doors, crates and lootboxes are tagged, the city is still all concrete until its streets and blocks are built (S041, S043); `--fx-rack` has a row of impacts"], "c": []}]}, {"id": "S033", "n": "Gun voices", "d": true, "start": false, "needs": ["S005"], "size": "L", "rounds": 0, "test": "`tests/test_gun_sounds.gd`", "see": "", "notes": [], "c": [{"n": "One synthesised shot per gun from layers: crack (noise burst), body (low thump by calibre), mechanical click, tail", "d": true, "notes": [], "c": [{"n": "P19 short pop, P90 buzzy snap, Type 95 and AK47 heavy bark, AS Val soft thud", "d": true, "notes": [], "c": []}, {"n": "USAS-12 and SPAS-12 boom with a long tail, T-5000 crack with a rolling echo, Dragunov sharp slap", "d": true, "notes": [], "c": []}]}, {"n": "Tail by place: short and boxy indoors, long slapback between buildings, open on the hill", "d": true, "notes": [], "c": []}, {"n": "Distance versions: far shots lose the crack and keep a dull thump", "d": true, "notes": [], "c": []}, {"n": "Suppressed variants", "d": true, "notes": [], "c": []}, {"n": "Dry fire click", "d": true, "notes": [], "c": []}, {"n": "Small pitch and level variation per shot, seeded per shot index", "d": true, "notes": ["`GunVoice` (`scripts/gun_voice.gd`: `RECIPES`, `sound(id)` + `_far` / `_sup`, `tail(place)`, `variation(i)`), `Game.place_at`; checked by measurement in the tests (length, loudness, brightness), not yet by ear"], "c": []}]}, {"id": "S034", "n": "Handling animation and sound", "d": true, "start": false, "needs": ["S033"], "size": "L", "rounds": 0, "test": "`tests/test_viewmodel.gd`", "see": "`--weapon=1..9 --pose=reload`", "notes": [], "c": [{"n": "Reload has parts with their own sound and pose: mag release, mag out, new mag in, slap, bolt or charging handle", "d": true, "notes": [], "c": [{"n": "Empty reload differs from a tactical reload", "d": true, "notes": [], "c": []}, {"n": "The old magazine falls and stays on the floor a while", "d": true, "notes": [], "c": []}, {"n": "Shotgun: shell in per round, pump at the end", "d": true, "notes": [], "c": []}, {"n": "Bolt rifle: bolt up, back, forward, down, with the scope leaving the eye", "d": true, "notes": [], "c": []}]}, {"n": "Inspect animation on a key: roll the gun left and right, check the chamber", "d": true, "notes": [], "c": []}, {"n": "Idle life: slow breathing, micro-adjustments of the grip", "d": true, "notes": [], "c": []}, {"n": "Draw and holster with cloth and sling sounds", "d": true, "notes": [], "c": []}, {"n": "Low ammo: the last rounds of a magazine sound thinner and click", "d": true, "notes": ["`Viewmodel.handling` (each part once, `reload_events`, `cycle_events`) → `Sfx` \"h_\" sounds; `mag_dropped` → `Casings` (`Weapons.Casing.MAG`); `WeaponState.reload_empty`; `scope_break`; `inspect()` (F, `--pose=inspect`); idle breathing and grip shifts; `low_ammo_click` under `Config.LOW_AMMO_ROUNDS`"], "c": []}]}, {"id": "S035", "n": "Camera feel", "d": true, "start": false, "needs": ["S018"], "size": "M", "rounds": 0, "test": "`tests/test_camera_feel.gd`", "see": "", "notes": [], "c": [{"n": "Walk and sprint bob as a figure eight, synced with footsteps", "d": true, "notes": [], "c": []}, {"n": "Weapon sway lags the mouse, spring back, more with heavy guns", "d": true, "notes": [], "c": []}, {"n": "Strafe tilt of a degree or two", "d": true, "notes": [], "c": []}, {"n": "Recoil as a spring: kick up, recover most of the way, horizontal wander by gun", "d": true, "notes": [], "c": []}, {"n": "FOV opens a little while sprinting, pinches on a sniper shot", "d": true, "notes": [], "c": []}, {"n": "Shake sources mixed and capped: explosions, hits taken, leaper landing, helicopter", "d": true, "notes": [], "c": []}, {"n": "All of it scaled by a setting, off at zero", "d": true, "notes": ["`CameraFeel` (`local_player.feel`: `step`, `add_shake`, `pinch`, `rumble`), the recoil spring (`punch_vel`, `step_recoil`), `Game.shake_near` / `got_hit` / `_fx_shake`, the \"camera_motion\" setting; recoil itself is gameplay and is not scaled by it"], "c": []}]}, {"id": "S036", "n": "HUD 2", "d": true, "start": false, "needs": ["S011", "S021"], "size": "L", "rounds": 0, "test": "`tests/test_hud.gd`", "see": "`--host --shot-at=2`", "notes": [], "c": [{"n": "Bottom right: weapon name, magazine as individual pips or a number, reserve, fire mode", "d": true, "notes": [], "c": []}, {"n": "Bottom left: health bar with a bleed marker, stamina, item counts", "d": true, "notes": [], "c": []}, {"n": "Top: compass strip with bearings, objective and teammate ticks", "d": true, "notes": [], "c": []}, {"n": "Objective text with a typed-in reveal, strike-through and slide-out when done", "d": true, "notes": [], "c": []}, {"n": "World markers: objective diamond with distance, clamped to the screen edge with an arrow", "d": true, "notes": [], "c": []}, {"n": "Teammates: name over the head, outline through walls when far, downed icon with a timer", "d": true, "notes": [], "c": []}, {"n": "Interaction prompt with the bound key and a hold ring", "d": true, "notes": [], "c": []}, {"n": "Everything fades when not needed, HUD scale setting", "d": true, "notes": [], "c": []}, {"n": "Built in code, no draw-call growth", "d": true, "notes": ["Parts: `AmmoPanel`, `VitalsBar`, `Compass`, `ObjectiveText`, `WorldMarkers` (`HudParts` draws for them), all under `Hud.root` (`apply_scale`, the `hud_scale` setting); `Hud.set_gun`, `set_vitals`, `set_compass`, `set_prompt(text, action)`, `step_fades`; `RemotePlayer.step_tag` counts a downed teammate's time; `Controls.label_of`. A downed teammate's clock is counted on each peer from when they went down (the host's own is not sent)"], "c": []}]}, {"id": "S037", "n": "Hit feedback", "d": true, "start": false, "needs": ["S036"], "size": "M", "rounds": 0, "test": "`tests/test_hit_feedback.gd`", "see": "", "notes": [], "c": [{"n": "Hit marker: four ticks that snap in and ease out, red and larger for a kill, a skull tick for a headshot", "d": true, "notes": [], "c": []}, {"n": "Limb sever: a brief extra tick and a wet sound", "d": true, "notes": [], "c": []}, {"n": "Damage direction: red arc on the side the hit came from, fades over a second", "d": true, "notes": [], "c": []}, {"n": "Taking a hit: view punch away from the attacker, red edge flash, short muffling of sound", "d": true, "notes": [], "c": []}, {"n": "Low HP: pulsing dark red vignette, desaturation, heartbeat, blurred edges", "d": true, "notes": [], "c": []}, {"n": "Blood on the lens after a close kill: a few drops that run down and fade", "d": true, "notes": ["`HitMarker`, `DamageArcs`, `LensBlood`, the `low_hp` shader on the HUD; `Game.hit_confirm(killed, headshot, severed, dist)` and `got_hit(amount, from)` (protocol 4); `Sfx.muffle` / `step_muffle` (a low-pass on Master); the `sever_wet` sound"], "c": []}]}, {"id": "S038", "n": "Other players' animations", "d": true, "start": false, "needs": ["S016", "S019"], "size": "L", "rounds": 0, "test": "`tests/test_remote_anim.gd`", "see": "`tools\\play2.ps1`", "notes": [], "c": [{"n": "Player snapshot carries an action byte: aim, reload, shove, heal, throw, downed, vault, crouch", "d": true, "notes": [], "c": []}, {"n": "Rig states in `Humanoid.Anim`", "d": true, "notes": [], "c": [{"n": "Aim: shouldered gun, head tracks the look pitch", "d": true, "notes": [], "c": []}, {"n": "Reload: support hand to the pouch and back, gun tilted", "d": true, "notes": [], "c": []}, {"n": "Sprint with the gun carried low", "d": true, "notes": [], "c": []}, {"n": "Shove, throw (wind-up, release), heal", "d": true, "notes": [], "c": []}, {"n": "Hit flinch, death fall forward or backward by hit direction", "d": true, "notes": [], "c": []}]}, {"n": "Upper and lower body blend: legs run while the arms reload", "d": true, "notes": [], "c": []}, {"n": "Gun recoil kick on the remote rig per shot", "d": true, "notes": ["`PlayerWire` 26 bytes (u16 action: AIM, RELOAD, SHOVE, THROW, VAULT added; s8 look pitch), protocol 5; `Humanoid.Upper` layered by `_write_upper` over the legs, `look_pitch`, `kick`; `RemotePlayer.upper_for`, `_place_gun`; the death falls along `players[id].last_push`; `--survivor-rack`. Aiming arms and gun line up roughly, not exactly (the gun hangs from the spine, not the hands)"], "c": []}]}, {"id": "S142", "n": "First-person hands and sleeves", "d": false, "start": true, "needs": ["S140", "S136"], "size": "L", "rounds": 4, "test": "`tests/test_viewmodel.gd`", "see": "`--weapon=4 --pose=aim`, `--hands-rack`", "notes": ["Today each arm is two boxes (a glove and a sleeve, `Viewmodel._make_arm`) while the zombies have real hands: the most-seen model of the game is the worst one."], "c": [{"n": "Card: the hand of `tools/models/body.py` (the bodies' measured proportions), forearm and wrist; references of hands on a pistol grip, a rifle grip and a handguard", "d": false, "notes": [], "c": []}, {"n": "Rig: wrist, palm, five fingers in three segments, the thumb with its base; grip poses as data per gun and per moment (hip, aim, trigger pulled, magazine grab, pump, bolt, shove, bandage), blended like the rest of the viewmodel", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: hand size and finger lengths against every gun's grip, the thumb over the web, no finger through a grip in any pose", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: knuckles, finger pads, nails, the web of the thumb, the wrist's bones, tendons on the back of the hand; sleeves with a cuff, a seam and folds that follow the elbow's bend", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: skin colour per player slot, dirt in the creases, scratches; tactical gloves as a variant (knuckle pads, stitching, cut fingertips); a watch on the left wrist", "d": false, "notes": [], "c": []}, {"n": "Round 4 · motion: the index finger pulls on each shot, the support hand slides on the pump, fingers spread on a magazine, the fingers wrap the bandage (S015)", "d": false, "notes": [], "c": []}, {"n": "The sleeves follow the player's survivor look (S243 when it exists)", "d": false, "notes": [], "c": []}, {"n": "Review: hip and aim on all nine guns at 1080p and the hands rack, beside the zombies' hands", "d": false, "notes": [], "c": []}]}, {"id": "S143", "n": "Gun model 2: P19 pistol", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=1 --pose=aim`, `--weapon=1 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (a modern polymer-frame pistol) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: slide, frame, the grip's angle and beavertail, trigger guard, the magazine in the grip; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: front and rear slide serrations, the ejection port with the barrel's hood, sights with white dots, takedown lever, slide stop, magazine release, the accessory rail's slots, the trigger with its safety blade", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: the grip's stippled panels, a matte slide with holster wear on its edges, stamped markings, grime", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S144", "n": "Gun model 2: P90", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=2 --pose=aim`, `--weapon=2 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the bullpup personal defence weapon) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the bullpup shell, the thumbhole grip, the translucent magazine along the top, the stubby barrel and flash hider; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the ring sight on top, both charging handles, the cartridges visible in the magazine, the ejection chute under the stock, the fire selector disc, sling points", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: polymer with mould seams, scuffs on the grip, the magazine's tint, markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S145", "n": "Gun model 2: Type 95", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=3 --pose=aim`, `--weapon=3 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the bullpup assault rifle) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the bullpup body, the carry handle with its sight, the magazine behind the pistol grip, the cheek rest, the short barrel; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the rear aperture and front post, the charging handle under the carry handle, the ejection port, the selector behind the magazine, vent slots in the handguard, the flash hider", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: dark polymer texture, worn edges, stamped markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S146", "n": "Gun model 2: AK47", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=4 --pose=aim`, `--weapon=4 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the rifle) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the receiver, the gas tube over the barrel, wooden handguards and stock, the curved magazine, the pistol grip; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the dust cover's ribs and rivets, the rear sight leaf with its range scale, the hooded front post, the slant brake, the cleaning rod, the selector lever, the charging handle, sling loops, the trigger guard", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: bluing worn on the edges, scratched wood with grain, the magazine's ribs catching the light, a serial stamp, grime in the corners", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S147", "n": "Gun model 2: AS Val", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=5 --pose=aim`, `--weapon=5 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the suppressed rifle) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the integral suppressor along the whole front, the receiver, the skeleton stock folded or out, the 20-round box magazine; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the suppressor's perforated sleeve and end cap, the side scope rail, the iron sights on the suppressor, the safety lever, the charging handle, the stock's tube frame and butt plate", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: black finish worn bare on the suppressor's edges, the magazine's ribs, markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S148", "n": "Gun model 2: USAS-12", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=6 --pose=aim`, `--weapon=6 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the automatic shotgun) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the long boxy receiver, the carry handle, the pistol grip and fixed stock, the box magazine; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the handle's sight channel, the front sight, the charging handle, the barrel shroud's vents, sling swivels, the magazine release", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: matte black polymer and steel, scuffs, markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S149", "n": "Gun model 2: SPAS-12", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=7 --pose=aim`, `--weapon=7 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the pump shotgun) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the receiver, the perforated heat shield over the barrel, the pump fore-end, the tube magazine, the pistol grip, the folding stock with its hook; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the heat shield's holes, the fore-end's ribs, the pump and semi selector, the sights, the stock's hinge and hook, sling swivels", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: parkerised finish with wear, scratches on the shield, markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S150", "n": "Gun model 2: Orsis T-5000", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=8 --pose=aim`, `--weapon=8 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the bolt-action sniper rifle) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the chassis stock with its skeleton butt, the long free-floated barrel, the big scope, the bolt with its large knob, the box magazine, the bipod; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the adjustable cheek riser and butt pad, the top rail, the scope's turrets and caps, the muzzle brake's ports, the folding hinge, the bipod's legs and feet", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: a ceramic-coat finish worn at the edges, scratches on the brake, tinted lens glass, markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}, {"id": "S151", "n": "Gun model 2: Dragunov", "d": false, "start": false, "needs": ["S141", "S142"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--gun-rack`, `--weapon=9 --pose=aim`, `--weapon=9 --pose=reload`", "notes": [], "c": [{"n": "Card: photos of the real gun (the marksman rifle) from the left, the right and three-quarter, sizes from its overall length; the magazine and the moving action stay separate parts", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the long thin barrel, the skeleton wooden thumbhole stock, the handguards, the scope offset to the left, the 10-round magazine; the profile matches the photo at the same scale", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the slotted flash hider, the bayonet lug, the handguards' vent holes, the cheek piece, the scope's rubber eyecup and turrets, the dust cover, the safety lever", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: lacquered wood with grain and dents, worn bluing, markings", "d": false, "notes": [], "c": []}, {"n": "Review: first person at the hip, aimed and reloading, and the gun rack, beside the photos; the hands (S142) close on the right places", "d": false, "notes": [], "c": []}]}]}, {"id": "P05", "n": "The town", "c": [{"id": "S039", "n": "Trace the OpenStreetMap tiles", "d": true, "start": false, "needs": [], "size": "L", "rounds": 0, "test": "`tests/test_city_osm.gd`", "see": "redraw `references/city_plan.png`", "notes": [], "c": [{"n": "`tools/trace_osm.py` reads `references/1.png` to `9.png` into `scripts/world/city_osm.gd` (generated, never edited by hand)", "d": true, "notes": [], "c": [{"n": "Each tile registered to `joinville.png` pixels by two named control points per tile, kept in the tool", "d": true, "notes": [], "c": []}, {"n": "Building footprints: the brown-grey polygons, simplified to a few corners, area and centroid", "d": true, "notes": [], "c": []}, {"n": "Street casings by colour class: red trunk, orange, yellow, white residential, grey pedestrian", "d": true, "notes": [], "c": []}, {"n": "Water, parks, parking lots, forest stipple as polygons", "d": true, "notes": [], "c": []}]}, {"n": "Overlay picture `references/osm_on_reference.png` proves the registration by eye", "d": true, "notes": [], "c": []}, {"n": "Test: the terminal, the Prefeitura and the hospital footprints land inside their `CityData.POIS` lots", "d": true, "notes": [], "c": []}, {"n": "Gaps between tiles reported, not guessed", "d": true, "notes": ["What this gives the town: a plan to simplify (S040) and a density map for the blocks (S043), not footprints to rebuild one by one.", "The tiles are at four times joinville.png's zoom (their scale bars); `--register` finds each tile's place by cross-correlating its buildings with joinville.png's (match 0.64 to 0.77) and the control points are kept in `TILES`. 1301 footprints (convex, simplified), streets as 1-pixel cells per class, areas as polygons; the overlay is generated, not committed. The nine tiles cover the centre in an uneven patchwork: what their bounding box leaves uncovered is `CityOsm.GAPS`"], "c": []}]}, {"id": "S040", "n": "Street network 2", "d": true, "start": false, "needs": ["S039"], "size": "L", "rounds": 0, "test": "`tests/test_street_net.gd`, `tests/test_city_map.gd`", "see": "`--city-plan`", "notes": ["Joinville's own streets, not an invented plan: the street grid is Joinville's, dressed as a French town (setts, pavements, pans coupés, invented French names). The map is the whole of `joinville.png` (and the hill road's hairpin above it), not a part cut out round the POIs; what is kept in detail and what only as a far LOD is decided after a performance pass."], "c": [{"n": "`CityData.STREETS` traced off `joinville.png` by `tools/trace_streets.py` into `CityStreets`: the main streets (`principale`) where the bus routes of `joinville_main_streets.png` run, every other street a `rue`; the hill road by hand off the topography", "d": true, "notes": [], "c": []}, {"n": "Invented French street names for every street (`CityData.name_of`); never a real street of a real town on purpose", "d": true, "notes": [], "c": []}, {"n": "Per street: carriageway width, one-way direction, pavement width each side, surface kind (setts or asphalt)", "d": true, "notes": [], "c": []}, {"n": "Junctions as real shapes: chamfered corners (pans coupés), T and skewed cross", "d": true, "notes": [], "c": []}, {"n": "Streets as meshes following the polyline with mitred joints, not grid cells; the 4 m grid stays for navigation only", "d": true, "notes": [], "c": []}, {"n": "Only what lies inside a mission area is built in detail (S051)", "d": true, "notes": [], "c": []}, {"n": "`--city-plan` and the menu's map redrawn from the new plan", "d": true, "notes": ["Done: 328 traced streets (76 main) and the hill road, `StreetNet` for junctions and strips, meshes in `CityMap._street_surfaces`. A first version invented an old core, a boulevard ring with a rond-point and faubourgs, inside a map cut to the hull of the POIs; both were dropped for Joinville's streets and the whole picture. Buildings still stand on the 4 m grid's BLOCK cells until S043 builds the îlots along the street lines. The detail area is a parameter of `CityMap` that nothing sets yet (S051 will)."], "c": []}]}, {"id": "S041", "n": "Road surface", "d": false, "start": false, "needs": ["S040", "S155"], "size": "L", "rounds": 3, "test": "`tests/test_road_surface.gd`", "see": "`--host --shot-cam` over the rue du Marché, `--street-rack`", "notes": [], "c": [{"n": "Surfaces as vertex colour and one shared material, no textures", "d": false, "notes": [], "c": [{"n": "Pavés: square sandstone and granite setts in rows on the old streets, the squares and the quays, slightly domed each, the joints dark; drawn in vertex colour with height noise", "d": false, "notes": [], "c": []}, {"n": "The old lanes dished to a gutter (ruisseau) down the middle, as before pavements", "d": false, "notes": [], "c": []}, {"n": "Asphalt on the main streets: dark, patched, a lighter worn track per lane", "d": false, "notes": [], "c": []}]}, {"n": "Markings as thin overlay meshes in one draw per street, French style", "d": false, "notes": [], "c": [{"n": "White dashed centre and lane lines on the asphalt, none on the setts", "d": false, "notes": [], "c": []}, {"n": "Zebra crossings (passages piétons) as white bars, on the setts too", "d": false, "notes": [], "c": []}, {"n": "BUS lettering and lanes near the bus station, painted arrows, give-way triangles, yellow zigzags at the bus stops, parking bays and PAYANT lettering", "d": false, "notes": [], "c": []}]}, {"n": "The road details of S155 placed: manholes, gutters and kerb drains, raised crossings, cracks and potholes seeded per street, setts missing in patches", "d": false, "notes": [], "c": []}, {"n": "Camber: the main streets crowned, the old lanes falling to the middle", "d": false, "notes": [], "c": []}, {"n": "`--street-rack`: a 30 m strip of every surface and marking side by side", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the strips' crowns and dishes, kerb lines and the markings' widths against the card's French references", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the setts' rows and joints, sunk and lifted ones, asphalt patches over setts, faded and cracked paint", "d": false, "notes": [], "c": []}, {"n": "Round 3 · wet and night: the same strips at night and wet (S110 when it exists), lamp pools, the setts' shine, water running in the ruisseau", "d": false, "notes": [], "c": []}, {"n": "Review: the street rack sheet and the rue du Marché shot", "d": false, "notes": [], "c": []}]}, {"id": "S042", "n": "Sidewalks", "d": false, "start": false, "needs": ["S040", "S156"], "size": "M", "rounds": 3, "test": "`tests/test_sidewalks.gd`", "see": "`--host --shot-cam` on a street corner, `--street-rack`", "notes": [], "c": [{"n": "Kerb as a real 12 to 15 cm step of long granite blocks, players and zombies walk it without a jump", "d": false, "notes": [], "c": []}, {"n": "Paving kinds by street", "d": false, "notes": [], "c": [{"n": "Poured grey asphalt pavements with the granite kerb, the Parisian kind", "d": false, "notes": [], "c": []}, {"n": "Stone flags on the squares and in front of the public buildings", "d": false, "notes": [], "c": []}, {"n": "No pavement in the narrowest lanes: setts wall to wall, stone bollards (bornes chasse-roues) guarding the house corners and the carriage gates", "d": false, "notes": [], "c": []}]}, {"n": "Dropped kerbs at the portes cochères and crossings, studded tactile strips at corners", "d": false, "notes": [], "c": []}, {"n": "Tree pits with cast-iron grilles on the main streets; the walls, railings and gates of S156 where buildings stand back", "d": false, "notes": [], "c": []}, {"n": "Sidewalks are nav cells: zombies use them, hordes spill onto the road", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: kerb heights and pavement widths per street, the flags' sizes against the photos", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: joints, cracked and patched asphalt, broken kerb stones, the bornes' worn tops", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: grime, gum, stains, moss and weeds in the joints, darker where wet", "d": false, "notes": [], "c": []}, {"n": "Review: the street rack and the corner shot beside the references", "d": false, "notes": [], "c": []}]}, {"id": "S043", "n": "Block massing", "d": false, "start": true, "needs": ["S039", "S040"], "size": "L", "rounds": 2, "test": "`tests/test_city_blocks.gd`", "see": "`--host --shot-cam` skyline", "notes": ["The traced footprints say how dense each part of town is and where the big buildings sit; the blocks are Paris's before Haussmann, not Joinville's lots."], "c": [{"n": "Îlots: each block between the new streets is closed by a row of narrow houses along its edge with courtyards and passages inside, seeded widths per house (two to four windows); footprints from `CityOsm` inside it set its density and where a big hall, court or garden breaks the row", "d": false, "notes": [], "c": []}, {"n": "Height from a class picked by street, place and seed", "d": false, "notes": [], "c": [{"n": "Old core: four to six floors on narrow fronts, steep roofs with dormers, leaning a little", "d": false, "notes": [], "c": []}, {"n": "Houses on the main streets: four or five floors, stone ground floor, plastered above, mansard roofs", "d": false, "notes": [], "c": []}, {"n": "Hôtels particuliers: a stone house between a front court behind a gate and a garden behind", "d": false, "notes": [], "c": []}, {"n": "A few post-war blocks at the edge of town, where the hospital tower and the bus station stand; no skyline of towers", "d": false, "notes": [], "c": []}, {"n": "Ateliers: long low halls with glass roofs by the river", "d": false, "notes": [], "c": []}]}, {"n": "Roofs are part of the mass: pitched and mansard roofs with ridges and hips, the tall party-wall chimney stacks left to the kits", "d": false, "notes": [], "c": []}, {"n": "Collision is the block, one mesh per city block, test counts draws", "d": false, "notes": [], "c": []}, {"n": "Blocks outside every mission area: low-detail silhouettes only", "d": false, "notes": [], "c": []}, {"n": "Round 1 · skyline: from the place du marché, the bridge and the hill: a sea of grey slate and red tile roofs bristling with chimney pots, the church tower and the town hall's campanile above it", "d": false, "notes": [], "c": []}, {"n": "Round 2 · roofscape: the îlots and courtyards from the helicopter's height against old Paris views and plans on the card (the Turgot plan's bird's-eye view)", "d": false, "notes": [], "c": []}, {"n": "Review: the three views side by side with the references", "d": false, "notes": [], "c": []}]}, {"id": "S044", "n": "Facades", "d": false, "start": false, "needs": ["S043", "S157", "S158", "S159", "S160", "S161", "S162", "S163", "S164"], "size": "L", "rounds": 2, "test": "`tests/test_facades.gd`", "see": "`--host --shot-cam` street level, day and night", "notes": ["Assembly: the blocks of S043 dressed from the facade kits; nothing modelled here."], "c": [{"n": "Facade grammar per block class: which kit, how many floors, where the shops, carriage gates and signs go, seeded per building", "d": false, "notes": [], "c": [{"n": "Timber-framed houses (S161) in the old core; plastered stone houses (S162) on the main streets with wooden shopfronts (S158) under French windows (S157); the few post-war blocks (S163) at the edge; ateliers (S164) by the river", "d": false, "notes": [], "c": []}, {"n": "Roofs, dormers and balconies (S159), painted and hanging signs (S160) by the shop kinds of the street", "d": false, "notes": [], "c": []}]}, {"n": "The town's mix: plaster fronts in creams, ochres and greys, a stone hôtel behind its gate, a leaning timber house, a later infill where one burnt", "d": false, "notes": [], "c": []}, {"n": "Night: a seeded few windows lit warm or TV-blue behind the shutters, some flickering, most dark", "d": false, "notes": [], "c": []}, {"n": "Decay by street: shutters closed or hanging, broken windows, soot above burnt ones, quarantine tape across doors (the kits' states)", "d": false, "notes": [], "c": []}, {"n": "House numbers on blue enamel plates by the doors", "d": false, "notes": [], "c": []}, {"n": "Round 1 · composition: three street views (old core, a main street, the river ateliers) for variety; no two neighbours alike", "d": false, "notes": [], "c": []}, {"n": "Round 2 · night and decay: the same views at night and in the abandoned state", "d": false, "notes": [], "c": []}, {"n": "Review: the three views, day and night", "d": false, "notes": [], "c": []}]}, {"id": "S045", "n": "The river", "d": false, "start": false, "needs": ["S040", "S004", "S165", "S174"], "size": "L", "rounds": 3, "test": "`tests/test_river.gd`", "see": "`--host --shot-cam` on a bridge", "notes": ["The river runs where Joinville's does; its banks are Paris's quays."], "c": [{"n": "Channel cut below street level: high stone quay walls with mooring rings, cobbled ramps (ports) and stairs down to a lower quay at the water, the quay road above with its parapet; grass banks and willows out of the centre", "d": false, "notes": [], "c": []}, {"n": "Water: one mesh, shader in code with slow flow along the river line, small ripples, dark green-brown, sky and lamp reflections as stretched streaks", "d": false, "notes": [], "c": []}, {"n": "The bridges of S165 at the crossings of the new plan", "d": false, "notes": [], "c": []}, {"n": "Floating things drifting with the flow: debris, a body, a sunk barge, an upturned rowing boat (S184), seeded", "d": false, "notes": [], "c": []}, {"n": "Plane trees (S174) along the upper quay; the parapet's empty bouquinistes' boxes", "d": false, "notes": [], "c": []}, {"n": "Water is not walkable; falling in wades the player to a ramp or stairs slowly, zombies stay out", "d": false, "notes": [], "c": []}, {"n": "Mist over the water at night", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the channel's width, depth, quay walls and ramps against the OSM water and the card's references of the Paris quays", "d": false, "notes": [], "c": []}, {"n": "Round 2 · water: colour, flow, reflections, the line where water meets the wall", "d": false, "notes": [], "c": []}, {"n": "Round 3 · night: the lamps' reflections, mist", "d": false, "notes": [], "c": []}, {"n": "Review: the bridge shot and a view along the lower quay", "d": false, "notes": [], "c": []}]}, {"id": "S046", "n": "Street furniture placement", "d": false, "start": false, "needs": ["S041", "S042", "S166", "S167", "S168", "S169", "S170", "S171", "S172", "S173"], "size": "M", "rounds": 2, "test": "`tests/test_street_furniture.gd`", "see": "`--furniture-rack`, `--host --shot-cam` on a street corner", "notes": ["Assembly: places the finished street furniture; nothing modelled here."], "c": [{"n": "Rules along streets, seeded, merged per block: réverbères hung on ropes over the old streets and lanterns on wall brackets, cast-iron candelabra on the main streets and quays, the ropes and wires of S167, traffic lights at the bigger junctions, street names carved in the corner stones and on blue plates, bus stops where the lines run, a colonne Morris and a kiosk now and then, benches, bins, bornes and railings by the squares and shops", "d": false, "notes": [], "c": []}, {"n": "Lamps follow the two-shadow rule: emission and a cheap light, shadows only from the manager (S108)", "d": false, "notes": [], "c": []}, {"n": "States by street: a few lamps flicker or hang dead, a réverbère down in the street on its rope, a sign bent", "d": false, "notes": [], "c": []}, {"n": "Small props are cover; thin poles do not block bullets", "d": false, "notes": [], "c": []}, {"n": "`--furniture-rack`: every piece of S166 to S173 in a row", "d": false, "notes": [], "c": []}, {"n": "Round 1 · placement: an old lane, the quay and a main street against the card's references", "d": false, "notes": [], "c": []}, {"n": "Round 2 · density and light: enough clutter to read as a lived-in town, the lamps' pools at night", "d": false, "notes": [], "c": []}, {"n": "Review: the corner shot by day and night", "d": false, "notes": [], "c": []}]}, {"id": "S047", "n": "Vegetation placement and wind", "d": false, "start": false, "needs": ["S042", "S174", "S175", "S176", "S177", "S178"], "size": "M", "rounds": 2, "test": "`tests/test_vegetation.gd`", "see": "`--tree-rack`, `--host --shot-cam` on a main street", "notes": ["Assembly and the shared systems: places the finished plants of S174 to S178."], "c": [{"n": "Planting rules: rows of plane trees and elms on the main streets and the quays, the old chestnuts on the squares, limes trained flat in the courts, box parterres in the formal gardens, window boxes and climbing ivy on the old houses, the forest wall where the hill rises", "d": false, "notes": [], "c": []}, {"n": "Wind: vertex sway in a shader, stronger at the tips, gusts that travel across a street", "d": false, "notes": [], "c": []}, {"n": "Grass tufts on lawns and verges as one MultiMesh, pressed down where zombies ran", "d": false, "notes": [], "c": []}, {"n": "Leaves fall and skitter along the gutter in gusts", "d": false, "notes": [], "c": []}, {"n": "`--tree-rack`: every species and size in a row", "d": false, "notes": [], "c": []}, {"n": "Round 1 · placement: a main street, the quay, a square, the edge of the hill", "d": false, "notes": [], "c": []}, {"n": "Round 2 · motion: wind strength by place, gusts, nothing swimming", "d": false, "notes": [], "c": []}, {"n": "Review: the four views beside the card's references", "d": false, "notes": [], "c": []}]}, {"id": "S048", "n": "Apocalypse dressing", "d": false, "start": false, "needs": ["S046", "S180", "S181", "S182", "S183", "S184", "S185", "S186", "S203"], "size": "M", "rounds": 2, "test": "`tests/test_dressing.gd`", "see": "`--host --shot-cam` on the avenue", "notes": ["Assembly: places the finished vehicles and leftovers; the set pieces of `scenery.gd` are rebuilt from them."], "c": [{"n": "Vehicles in their states (S179's generator): parked, abandoned with doors open, crashed into a pole, rolled over, burnt out; hazard lights still blinking on a few, a dome light on, a wiper still moving", "d": false, "notes": [], "c": []}, {"n": "Traffic jam generator along a street: a queue toward the way out of town, buses (S203) among the cars, gaps to walk through", "d": false, "notes": [], "c": []}, {"n": "Evacuation remains (S184) spilled along the jams and the sidewalks", "d": false, "notes": [], "c": []}, {"n": "Military and police leftovers (S185): checkpoints, sandbags, wire, body bags in rows", "d": false, "notes": [], "c": []}, {"n": "Words and posters (S186) on walls, shutters and vehicles", "d": false, "notes": [], "c": []}, {"n": "Blood: drag trails into doorways, handprints, pools under cars", "d": false, "notes": [], "c": []}, {"n": "Small fires in barrels and wrecks (uses S094 when present, a plain flicker before)", "d": false, "notes": [], "c": []}, {"n": "Wrecks are cover and block nav", "d": false, "notes": [], "c": []}, {"n": "Round 1 · story: each scene reads as something that happened (the jam, the checkpoint that fell, the evacuation)", "d": false, "notes": [], "c": []}, {"n": "Round 2 · density: walkable, not a wall of clutter, budgets held", "d": false, "notes": [], "c": []}, {"n": "Review: the avenue shot and a checkpoint shot", "d": false, "notes": [], "c": []}]}, {"id": "S049", "n": "Squares and landmarks", "d": false, "start": false, "needs": ["S044", "S047", "S166", "S173", "S187", "S188", "S189", "S190"], "size": "M", "rounds": 3, "test": "`tests/test_landmarks.gd`", "see": "`--host --shot-cam` on the place du marché", "notes": ["Assembly of the finished landmarks, exterior only. They stand where the plan of S040 puts them (the place du marché where Praça da Bandeira is, the church near it), not on traced footprints."], "c": [{"n": "The place du marché: setts, the fountain (S187) in the middle, old chestnuts, lanterns (S166), benches and bins (S173), the empty market stalls, tall plastered houses with shops closing it", "d": false, "notes": [], "c": []}, {"n": "The church (S188) on its parvis off the market", "d": false, "notes": [], "c": []}, {"n": "The old cemetery (S189) on the slope behind the church", "d": false, "notes": [], "c": []}, {"n": "The jardin public at the foot of the hill (S190), seen only on the lookout mission", "d": false, "notes": [], "c": []}, {"n": "Round 1 · layout: the square's plan against old French market squares on the card (how irregular it is, how the streets enter it)", "d": false, "notes": [], "c": []}, {"n": "Round 2 · style match: fixed `--shot-cam` views of the square and the church beside the card's references (old Paris engravings and photos of its surviving pre-Haussmann streets)", "d": false, "note
