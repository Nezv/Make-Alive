": []}]}, {"id": "S051", "n": "Mission areas", "d": false, "start": false, "needs": ["S002", "S043", "S048"], "size": "L", "rounds": 0, "test": "`tests/test_mission_areas.gd`", "see": "`--mission=<each>`", "notes": [], "c": [{"n": "Each mission builds only its area: the POI and the streets around it, bounds polygon in map data", "d": false, "notes": [], "c": []}, {"n": "Edges closed believably, never an invisible wall in the open: bus across the road, collapsed facade, burning pile-up, military fence, flood water", "d": false, "notes": [], "c": []}, {"n": "Beyond the edge: low-detail blocks and the backdrop", "d": false, "notes": [], "c": []}, {"n": "Build time per area under a limit, measured in the test", "d": false, "notes": [], "c": []}, {"n": "Visibility ranges on small props, block meshes split so culling works", "d": false, "notes": [], "c": []}, {"n": "The whole-city map stays available as free play", "d": false, "notes": [], "c": []}]}, {"id": "S052", "n": "City navigation 2", "d": false, "start": false, "needs": ["S051", "S028"], "size": "M", "rounds": 0, "test": "`tests/test_city_nav.gd`", "see": "", "notes": [], "c": [{"n": "Nav grid built per mission area at 1 m near the POI, 4 m in the streets", "d": false, "notes": [], "c": []}, {"n": "Kerbs, wreck gaps, fences with holes and stairs are walkable links", "d": false, "notes": [], "c": []}, {"n": "Spawn closets authored per area: portes cochères, courtyard passages, impasses, cellar stairs, behind buses, manholes, each proven out of sight", "d": false, "notes": [], "c": []}, {"n": "Horde routes authored per area so streams come down the town's streets and lanes", "d": false, "notes": [], "c": []}, {"n": "Zombies do not walk through hedges, railings or water", "d": false, "notes": [], "c": []}, {"n": "Bot scenario: walk the whole mission route without getting stuck", "d": false, "notes": [], "c": []}]}, {"id": "S155", "n": "Road details: manholes, drains, humps", "d": false, "start": true, "needs": ["S141"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=road_details`", "notes": [], "c": [{"n": "Card: photos of French manhole covers (regards), kerb drains (bouches d'égout) with their cast-iron mouths, the stone gutter channels, raised crossings", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: round and square covers with their frames, the kerb drain's mouth and its stone, the gutter's dish, the raised crossing's ramps", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: cast patterns and lettering on the covers (the town's invented name and arms), the grate bars, the crossing's painted marks, setts laid round the covers", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: rust and polish where tyres pass, leaves and silt in the drains, faded paint, patches and potholes as decals with depth", "d": false, "notes": [], "c": []}, {"n": "States: a missing cover (an open hole), a drain overflowing in rain (S110)", "d": false, "notes": [], "c": []}, {"n": "Review: the rack and a street strip at 1 m and 10 m", "d": false, "notes": [], "c": []}]}, {"id": "S156", "n": "Front walls, railings and gates", "d": false, "start": true, "needs": ["S141"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=boundaries`", "notes": ["Most houses stand on the street; walls and gates are for the courts of the hôtels, the gardens and the villas on the hill road."], "c": [{"n": "Card: photos of old Paris street fronts: portes cochères with their great wooden leaves, a court wall with a carved gateway, stone walls with iron railings on a low plinth, garden walls with copings", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: heights (0.6 m plinths, 2 m railings, 3 to 4 m court walls), pier spacing, gate widths for a carriage and for a person", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: copings and pier caps with urns, the railings' bars and spear finials, the gate leaves' panels, studs, knockers and the wicket door, chasse-roues at the gate's foot", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: stone and plaster with damp rising from the ground, flaking paint, rust on the railings, tags, moss", "d": false, "notes": [], "c": []}, {"n": "Modules that join along any lot line, with corners and ends; states: gate open, rammed, burnt", "d": false, "notes": [], "c": []}, {"n": "Review: a street front of ten lots at 10 m and the rack at 1 m", "d": false, "notes": [], "c": []}]}, {"id": "S157", "n": "Window kit", "d": false, "start": true, "needs": ["S141"], "size": "L", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=windows`", "notes": [], "c": [{"n": "Card: photos of old Paris windows: tall French casements (fenêtres à la française) with small panes, louvred wooden shutters folding against the wall, low iron railings across the opening (garde-corps), the small windows of the timber houses, post-war ribbon glazing for the few new blocks", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: sizes and proportions per kind (tall, narrow, regular), how deep each sits in the wall, sills, the plaster or stone surrounds", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: frames and glazing bars, the shutters' louvres, hinges and catches, the garde-corps' bars and scrolls, drip edges", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: old glass that reflects the sky unevenly, dirt in the frame corners, flaking paint on the frames and shutters, net curtains behind some", "d": false, "notes": [], "c": []}, {"n": "States: open, shut, shutters closed, broken (shards left in the frame), boarded, burnt with soot above; lit warm, TV-blue or dark at night (emission)", "d": false, "notes": [], "c": []}, {"n": "Review: each kind at 1 m and on a test wall at 10 m, by day and night", "d": false, "notes": [], "c": []}]}, {"id": "S158", "n": "Shopfront kit", "d": false, "start": false, "needs": ["S141", "S157"], "size": "L", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=shopfronts`", "notes": [], "c": [{"n": "Card: photos of old Paris shopfronts: the wooden front applied to the house (devanture en applique) with pilasters, a deep fascia and the side boxes that hold the night shutters, painted in dark green, oxblood or black", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: bay widths, the glazed front and its door, the fascia, the shutter boxes, awning depths", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: the panels and mouldings, small-paned shop windows, the wooden shutter panels put up at night, the bars across them, striped fabric awnings (stores) on arms, a stone step, counters and shelves seen through the glass", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: gilded or painted lettering on the fascia, posters and prices in the windows, dirty glass, flaking paint, tags on the shutters", "d": false, "notes": [], "c": []}, {"n": "States: open, shutters up, half shuttered, forced (panels torn off), looted (glass out, shelves bare)", "d": false, "notes": [], "c": []}, {"n": "Review: a row of six fronts at 1 m and 10 m", "d": false, "notes": [], "c": []}]}, {"id": "S159", "n": "Roofs, dormers and balconies", "d": false, "start": true, "needs": ["S141"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=rooftops`", "notes": [], "c": [{"n": "Card: photos of old Paris roofs: slate and tile, mansards with their steep and shallow slopes, dormers (lucarnes), the tall party-wall chimney stacks with rows of pots, wrought-iron balconies", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: roof faces and mansard breaks, dormers with their pediments, chimney stacks, skylights, balconies on brackets", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: slate and tile rows, ridge and hip caps, zinc flashing and gutters, downpipes, chimney pots (mitrons) in rows, the balconies' scrolled railings and stone brackets, TV antennas and dishes", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: moss and lichen, soot round the chimneys, black stains below the gutters, laundry and plants on some balconies", "d": false, "notes": [], "c": []}, {"n": "Review: a roofscape and a balcony at 10 m and 50 m", "d": false, "notes": [], "c": []}]}, {"id": "S160", "n": "Shop signs and lettering", "d": false, "start": true, "needs": ["S141"], "size": "M", "rounds": 3, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=signs_shops`", "notes": [], "c": [{"n": "Card: photos of old French shop signs; the kinds: PHARMACIE with a green cross, BOULANGERIE, BOUCHERIE, CAFÉ, BRASSERIE, TABAC with its red lozenge, QUINCAILLERIE, HERBORISTERIE, OPTICIEN, COIFFEUR, never a real brand", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: lettering painted on the fascia and on the wall over the shop, wrought-iron hanging signs on brackets with a shape cut out (a key, a boot, a bunch of grapes), the pharmacy cross", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: letters painted, gilded or raised, the brackets' scrolls and chains, the cross's box and its cable", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: faded paint, ghost signs of old trades on the blank walls, missing letters, rust running from the fixings", "d": false, "notes": [], "c": []}, {"n": "Seeded per building from its shop kind; states: lit, dead, flickering (S108), half fallen", "d": false, "notes": [], "c": []}, {"n": "Review: a street of signs by day and at night", "d": false, "notes": [], "c": []}]}, {"id": "S161", "n": "The timber-framed house", "d": false, "start": false, "needs": ["S141", "S157"], "size": "L", "rounds": 4, "test": "`tests/test_elements.gd`", "see": "`--prop-rack=half_timber`", "notes": ["Old Paris's houses on narrow medieval lots: timber frames (pans de bois), most plastered over, a few left bare, leaning alse, "start": false, "needs": ["S066", "S041", "S167", "S178", "S232", "S233", "S234"], "size": "L", "rounds": 3, "test": "`tests/test_poi_mirante_road.gd`", "see": "`--mission=mirante --shot-cam` on the hairpin", "notes": [], "c": [{"n": "The hill road (S233) along the road of the plan, the hairpin and the grade from `CityHeights`; everything placed with `map.ground_y`", "d": false, "notes": [], "c": []}, {"n": "Forest walls both sides (S178), canopy closing overhead; wooden poles with their wires following the road (S167)", "d": false, "notes": [], "c": []}, {"n": "The park gate at the foot (S232)", "d": false, "notes": [], "c": []}, {"n": "Side trail (S234) as a risky shortcut: no lamps", "d": false, "notes": [], "c": []}, {"n": "A few lamps only, long dark stretches for flashlights", "d": false, "notes": [], "c": []}, {"n": "Round 1 · layout: the road's line, width and grade against the topography", "d": false, "notes": [], "c": []}, {"n": "Round 2 · style match: fixed `--shot-cam` views of a bend and of the gate beside the card's references", "d": false, "notes": [], "c": []}, {"n": "Round 3 · night: the dark stretches, the few lamps, fog between the trunks", "d": false, "notes": [], "c": []}, {"n": "Review: the style match sheets and the hairpin at night", "d": false, "notes": [], "c": []}]}, {"id": "S068", "n": "Mission: down from the lookout", "d": false, "start": false, "needs": ["S067", "S052", "S022"], "size": "M", "rounds": 0, "test": "`tests/test_mission_mirante.gd`", "see": "`--mission=mirante --bot`", "notes": [], "c": [{"n": "Descend the tower: tight stairs, leapers", "d": false, "notes": [], "c": []}, {"n": "The road: leapers drop out of the trees, runners come up the road in packs, fog between the trunks", "d": false, "notes": [], "c": []}, {"n": "Checkpoint at the hairpin", "d": false, "notes": [], "c": []}, {"n": "Choice: the lit road or the dark trail", "d": false, "notes": [], "c": []}, {"n": "Extraction at the park gate at the foot, a truck instead of the helicopter", "d": false, "notes": [], "c": []}, {"n": "Bot scenario finishes it on easy", "d": false, "notes": [], "c": []}]}]}, {"id": "P07", "n": "Zombies", "c": [{"id": "S070", "n": "Room on the wire", "d": true, "start": false, "needs": [], "size": "M", "rounds": 0, "test": "`tests/test_zombie_wire.gd`", "see": "", "notes": [], "c": [{"n": "Type field widened to hold twelve types, state field to hold the new states, still 13 bytes", "d": true, "notes": ["4 bits of type, 5 of state; the id is 24 bits now"], "c": []}, {"n": "Flags packed into spare bits: burning, armoured parts left, climbing, crawling", "d": true, "notes": ["`ZombieWire.FLAG_*` and a 4-bit `armour`; the host sets only crawling so far, the rest wait for their steps"], "c": []}, {"n": "Packet test at the zombie cap still passes", "d": true, "notes": [], "c": []}, {"n": "Version byte in `welcome` so a mismatched build is refused with a clear message", "d": true, "notes": ["`Config.PROTOCOL_VERSION` (bump it with any change to what is on the wire), sent in `request_join` and `welcome`; `Game.join_refused` takes the client back to the menu with the message"], "c": []}, {"n": "Interest management: when the count exceeds one packet, each client gets the nearest zombies every tick and the far ones every few ticks", "d": true, "notes": ["`Interest.pick`; today's cap of 60 fits in one packet with eight players, so it only starts to matter above `Interest.budget`. Clients keep a zombie that missed a packet for `Config.ZOMBIE_STALE` seconds"], "c": []}]}, {"id": "S136", "n": "Low-poly bodies and skeleton ✅", "d": true, "start": false, "needs": [], "size": "L", "rounds": 0, "test": "`tests/test_body_model.gd`", "see": "`--host --body-rack`", "notes": [], "c": [{"n": "`tools/models/poly.py`: low-poly kit, rings lofted into flat-shaded prisms, a tag per face ✅", "d": true, "notes": [], "c": []}, {"n": "`tools/models/measure.py`: proportions, face layout and colours read off `references/zombies.png` ✅", "d": true, "notes": [], "c": []}, {"n": "Generic male and female bodies (`body.py`): one closed piece per joint, shoulder ledge, torso break that bends closed ✅", "d": true, "notes": [], "c": [{"n": "Faceted head: sunk sockets, V brow, glowing slit eyes, downturned mouth with teeth ✅", "d": true, "notes": [], "c": []}, {"n": "Bone stubs in the wounds a severed part shows ✅", "d": true, "notes": [], "c": []}]}, {"n": "Skeleton model on the same joints, fitted inside the male body (`skeleton.py`) ✅", "d": true, "notes": [], "c": []}, {"n": "`CharacterModel` loads a .glb, binds it to the game's joints, cuts a rigid copy per segment for gibs and ragdolls ✅", "d": true, "notes": [], "c": []}, {"n": "The old SDF cop model removed ✅", "d": true, "notes": [], "c": []}]}, {"id": "S137", "n": "Outfit models ✅", "d": true, "start": false, "needs": ["S136"], "size": "L", "rounds": 0, "test": "`tests/test_outfit_models.gd`", "see": "`--host --outfit-rack=1`", "notes": [], "c": [{"n": "Garment kit `tools/models/clothes.py`, fitted by slicing the body ✅", "d": true, "notes": [], "c": [{"n": "Shirts and jackets: long, short or no sleeves; crew, collar or high neck; tucked or over the trousers; open front ✅", "d": true, "notes": [], "c": []}, {"n": "Trousers and shorts with an optional belt ✅", "d": true, "notes": [], "c": []}, {"n": "Shoes, sneakers, boots ✅", "d": true, "notes": [], "c": []}, {"n": "Headgear: police cap, hard hat, helmet, fire helmet, nurse's cap ✅", "d": true, "notes": [], "c": []}]}, {"n": "One continuous surface per garment: sleeves out of the armhole, legs out of the seat, no break at any joint ✅", "d": true, "notes": [], "c": []}, {"n": "Helper bones turning half as far as each limb joint, so cloth bends without pinching ✅", "d": true, "notes": [], "c": []}, {"n": "Pieces cut below each joint, closed by wounds; piece ids in the .glb's second UV channel ✅", "d": true, "notes": [], "c": []}, {"n": "Nine outfits on the male and the female body (18 models),  []}, {"n": "Inside the hole: wound flesh, the bone section, depth, so no see-through; the piece it belongs to stays closed for gibs", "d": true, "notes": [], "c": []}]}, {"n": "Bites survive the existing rules: helpers bend them, they come off with their piece, stumps still close", "d": true, "notes": [], "c": []}, {"n": "Contact sheet of every bone, clothes and body variant of the female nurse in one isometric picture, shown in chat when done", "d": false, "notes": [], "c": []}]}, {"id": "S139", "n": "Outfit details: uniforms", "d": false, "start": true, "needs": ["S137"], "size": "L", "rounds": 3, "test": "`tests/test_outfit_models.gd`", "see": "`--host --outfit-rack=2`", "notes": ["The nine outfits are plain colours per garment today. This step does the four uniforms; the civilians are S235."], "c": [{"n": "Card per uniform with photos of the real ones: the Santa Catarina military police, the army's field uniform, the firefighters (Corpo de Bombeiros), a prison uniform", "d": false, "notes": [], "c": []}, {"n": "Round 1 · form: the garments' cut against the photos: pocket shapes, collars, belts with their gear, boots", "d": false, "notes": [], "c": []}, {"n": "Round 2 · structure: patches and badges, name tapes, rank, epaulettes, button lines, zips, the firefighters' hi-vis reflective bands, cargo pockets with flaps, holsters and pouches on the belts", "d": false, "notes": [], "c": []}, {"n": "Round 3 · surface: camouflage print, fabric weave, stitching, dirt, blood and tears that follow the seams", "d": false, "notes": [], "c": []}, {"n": "Review: the outfit rack front and back at 1 m beside the photos", "d": false, "notes": [], "c": []}]}, {"id": "S235", "n": "Outfit details: civilians", "d": false, "start": true, "needs": ["S137"], "size": "L", "rounds": 3, "test": "`tests/test_outfit_models.gd`", "see": "`--host --outfit-rack=1`", "notes": [], "c": [{"n": "Card: civilian, worker, office, nurse and doctor, with photos of each kind of clothing", "d": false, "n rt and direction", "d": false, "notes": [], "c": [{"n": "Head snaps back, shoulder is thrown round, gut shot folds the torso", "d": false, "notes": [], "c": []}, {"n": "Leg hit: stumble on that side, a knee touches the ground", "d": false, "notes": [], "c": []}, {"n": "Heavy calibres spin or knock down; a knocked-down zombie rolls over and gets up in stages", "d": false, "notes": [], "c": []}]}, {"n": "Attack variety: two-hand grab, wide swipe, lunge bite, each with wind-up, strike and recovery", "d": false, "notes": [], "c": []}, {"n": "Losing an arm mid-attack: the swing continues with the stump and sprays", "d": false, "notes": [], "c": []}, {"n": "Losing a leg: topple sideways, then the existing lying states", "d": false, "notes": [], "c": []}, {"n": "Runner: head-down sprint with arms pumping wrong, skids on turns", "d": false, "notes": [], "c": []}, {"n": "Leaper: all-fours scuttle, coil with the back arched, land in a roll", "d": false, "notes": [], "c": []}, {"n": "Secondary motion: head and arm lag on stops, jaw and fingers always moving", "d": false, "notes": [], "c": []}]}, {"id": "S072", "n": "Senses and ambient zombies", "d": false, "start": false, "needs": ["S020", "S071"], "size": "L", "rounds": 0, "test": "`tests/test_zombie_senses.gd`", "see": "", "notes": [], "c": [{"n": "States before CHASE: DORMANT (standing still, lying, slumped in a car), FEEDING (kneeling on a corpse), WANDER", "d": false, "notes": [], "c": []}, {"n": "Sight cone and range, shorter in the dark, widened by a flashlight shining on them", "d": false, "notes": [], "c": []}, {"n": "Hearing from the noise system", "d": false, "notes": [], "c": []}, {"n": "Alert: head snaps up, a scream that wakes others within a radius, then the chase", "d": false, "notes": [], "c": []}, {"n": "Feeding animation: kneel, tear, head jerks up with a strip, blood on the mouth", "d": false, "notes": [], "c": []}, {"n": "Trapped ones: behind glass slapping it, seat-belted in cars, under a gate reaching ou tes": [], "c": [{"n": "Every mission inside its budget on every tier, measured at the worst moment (final wave, rain, fire, helicopter)", "d": false, "notes": [], "c": []}, {"n": "Profiler findings fixed: merged meshes, MultiMesh where repeated, scripts off the hot path, pooled everything", "d": false, "notes": [], "c": []}, {"n": "Host with eight players and a full horde keeps its tick rate", "d": false, "notes": [], "c": []}, {"n": "No hitch above a frame when a horde spawns, a building appears or an effect first plays (warm-up at load)", "d": false, "notes": [], "c": []}, {"n": "Memory steady over a 30-minute soak", "d": false, "notes": [], "c": []}]}, {"id": "S134", "n": "Windows build for friends", "d": false, "start": false, "needs": ["S122"], "size": "M", "rounds": 0, "test": "`tools\\build.ps1` then run the exe with `--quit-after=5`", "see": "", "notes": [], "c": [{"n": "`tools\\build.ps1` exports a release folder and a zip, version stamped from git", "d": false, "notes": [], "c": []}, {"n": "First run: asks for a name, picks a tier, shows the LAN address to tell friends", "d": false, "notes": [], "c": []}, {"n": "Firewall prompt explained on the host screen; port in settings", "d": false, "notes": [], "c": []}, {"n": "Version check on join (S070)", "d": false, "notes": [], "c": []}, {"n": "`README.md`: how to host, how to join, controls, troubleshooting", "d": false, "notes": [], "c": []}, {"n": "Crash log written to `user://` with the last hooks fired", "d": false, "notes": [], "c": []}]}, {"id": "S135", "n": "LAN night", "d": false, "start": false, "needs": ["S132", "S133", "S134"], "size": "M", "rounds": 0, "test": "whole suite", "see": "`tools\\shots.ps1`", "notes": [], "c": [{"n": "A checklist played start to finish on two real machines: lobby, each of the five missions, a late join, a disconnect, a failure and a win", "d": false, "notes": [], "c": []}, {"n": "Every rough edge found becomes a test and a fix, or a new step appended to this file", "d": false, "notes": [], "c": []}, {"n": "Credits and a thank-you screen after the fifth mission", "d": false, "notes": [], "c": []}, {"n": "`TODO.md`, `CLAUDE.md` and this file agree with the game", "d": false, "notes": [], "c": []}]}]}];
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg"), view = document.getElementById("view");
const gLinks = document.getElementById("links"), gDeps = document.getElementById("deps"), gNodes = document.getElementById("nodes");
const tip = document.getElementById("tip");
const steps = {};
const open = {};
let showDeps = false, hover = null;

const root = {kind: "root", n: "Make Alive", c: PHASES};
for (const p of PHASES) { p.kind = "phase"; p.d = p.c.every(s => s.d);
  for (const s of p.c) { s.kind = "step"; steps[s.id] = s; open[s.id] = s.start; mark(s.c, s); } }
function mark(list, step) { for (const f of list) { f.kind = "feature"; f.step = step; mark(f.c, step); } }

function kids(n) { return n.kind === "step" && !open[n.id] ? [] : n.c; }
function leaves(n) { const k = kids(n); n.w = k.length ? k.reduce((a, c) => a + leaves(c), 0) : 1; return n.w; }
function depth(n) { return n.kind === "root" ? 0 : n.kind === "phase" ? 1 : n.kind === "step" ? 2 : n.step && n.step.c.includes(n) ? 3 : 4; }

function layout() {
  const total = leaves(root);
  const r2 = Math.max(330, total * 15 / (2 * Math.PI));
  const radii = [0, r2 * 0.5, r2, r2 + 250, r2 + 560];
  let at = 0;
  (function place(n) {
    const k = kids(n);
    n.r = radii[depth(n)];
    if (!k.length) { n.a = (at + 0.5) / total * 2 * Math.PI; at += 1; }
    else { k.forEach(place); n.a = (k[0].a + k[k.length - 1].a) / 2; }
    n.x = n.r * Math.sin(n.a); n.y = -n.r * Math.cos(n.a);
  })(root);
  return radii[4] + 330;
}

function el(name, attrs, parent) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function cut(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function plain(s) { return s.replace(/`/g, ""); }
function status(n) {
  if (n.kind === "root") return "root";
  if (n.kind === "phase") return "phase" + (n.d ? " done" : "");
  if (n.d) return "done";
  const s = n.kind === "step" ? n : n.step;
  return s.start ? (n.kind === "step" ? "start" : "open") : "blocked";
}

let extent = 1000;
function draw() {
  extent = layout();
  gLinks.textContent = ""; gNodes.textContent = ""; gDeps.textContent = "";
  (function walk(n) {
    for (const c of kids(n)) {
      const mid = (n.r + c.r) / 2;
      const ax = mid * Math.sin(n.a), ay = -mid * Math.cos(n.a), bx = mid * Math.sin(c.a), by = -mid * Math.cos(c.a);
      el("path", {class: "link" + (c.d ? " done" : ""), d: `M${n.x} ${n.y}C${ax} ${ay} ${bx} ${by} ${c.x} ${c.y}`}, gLinks);
      walk(c);
    }
    const g = el("g", {class: "node " + n.kind + " " + status(n) + (n.kind === "step" ? (open[n.id] ? "" : " folded") + (n.c.length ? " has" : "") : ""), transform: `translate(${n.x} ${n.y})`}, gNodes);
    const size = n.kind === "root" ? 9 : n.kind === "phase" ? 7 : n.kind === "step" ? 5.5 : 3;
    el("circle", {r: size}, g);
    const deg = n.a * 180 / Math.PI - 90, flip = n.a > Math.PI;
    let label = n.kind === "step" ? n.id + " · " + n.n : n.kind === "phase" ? n.id + " · " + n.n : plain(n.n);
    if (n.kind === "step" && !open[n.id] && n.c.length) label += "  +";
    const t = el("text", n.kind === "root" ? {y: -16, "text-anchor": "middle"} :
      {transform: `rotate(${flip ? deg + 180 : deg})`, x: flip ? -(size + 5) : size + 5, dy: "0.32em", "text-anchor": flip ? "end" : "start"}, g);
    t.textContent = cut(label, n.kind === "feature" ? 46 : 44);
    g.addEventListener("mousemove", e => showTip(n, e));
    g.addEventListener("mouseleave", () => { tip.style.display = "none"; if (hover) { hover = null; drawDeps(); } });
    if (n.kind === "step") {
      g.addEventListener("mouseenter", () => { hover = n.id; drawDeps(); });
      g.addEventListener("click", () => { if (moved) return; open[n.id] = !open[n.id]; tip.style.display = "none"; draw(); });
    }
  })(root);
  drawDeps();
}

function drawDeps() {
  gDeps.textContent = "";
  if (!showDeps && !hover) return;
  for (const id in steps) {
    const s = steps[id];
    for (const need of s.needs) {
      const from = steps[need];
      const mine = hover && (hover === id || hover === need);
      if (!showDeps && !mine) continue;
      const pull = 0.35;
      el("path", {class: "dep" + (hover ? (mine ? " hot" : " cold") : ""), "marker-end": "url(#arrow)",
        d: `M${from.x} ${from.y}Q${(from.x + s.x) / 2 * pull} ${(from.y + s.y) / 2 * pull} ${s.x} ${s.y}`}, gDeps);
    }
  }
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function rich(s) { return esc(s).replace(/`([^`]*)`/g, "<code>$1</code>"); }
function showTip(n, e) {
  let h = "";
  if (n.kind === "step") {
    const all = []; (function w(l) { for (const f of l) { all.push(f); w(f.c); } })(n.c);
    h = `<h4>${n.id} · ${esc(n.n)}</h4><div><span class="k">${n.d ? "done" : n.start ? "can start now" : "blocked"} · size ${n.size || "?"}${n.rounds ? " · " + n.rounds + " rounds" : ""} · ${all.filter(f => f.d).length} / ${all.length} features</span></div>`;
    h += `<div><span class="k">needs:</span> ${n.needs.length ? n.needs.map(i => `${i} ${esc(steps[i].n)} ${steps[i].d ? "✓" : "✗"}`).join(", ") : "none"}</div>`;
    if (n.test) h += `<div><span class="k">test:</span> ${rich(n.test)}</div>`;
    if (n.see) h += `<div><span class="k">see:</span> ${rich(n.see)}</div>`;
  } else if (n.kind === "phase") {
    h = `<h4>${n.id} · ${esc(n.n)}</h4><div class="k">${n.c.filter(s => s.d).length} / ${n.c.length} steps done</div>`;
  } else if (n.kind === "feature") {
    h = `<h4>${rich(n.n)}</h4><div class="k">${n.d ? "done" : "open"} · ${n.step.id} ${esc(n.step.n)}</div>`;
  } else {
    const all = Object.values(steps); h = `<h4>Make Alive</h4><div class="k">${all.filter(s => s.d).length} / ${all.length} steps done</div>`;
  }
  if (n.notes && n.notes.length) h += "<ul>" + n.notes.map(t => `<li>${rich(t)}</li>`).join("") + "</ul>";
  tip.innerHTML = h; tip.style.display = "block";
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 16, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(e.clientY + 16, innerHeight - hh - 8) + "px";
}

let tx = 0, ty = 0, k = 1, moved = false, grab = null;
function apply() { view.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`); }
function fit() { k = Math.min(innerWidth, innerHeight) / (2 * extent); tx = innerWidth / 2; ty = innerHeight / 2; apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0015); tx = e.clientX - (e.clientX - tx) * f; ty = e.clientY - (e.clientY - ty) * f; k *= f; apply(); }, {passive: false});
svg.addEventListener("mousedown", e => { grab = [e.clientX, e.clientY]; moved = false; svg.classList.add("drag"); });
addEventListener("mousemove", e => { if (!grab) return; const dx = e.clientX - grab[0], dy = e.clientY - grab[1]; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; tx += dx; ty += dy; grab = [e.clientX, e.clientY]; apply(); });
addEventListener("mouseup", () => { grab = null; svg.classList.remove("drag"); setTimeout(() => moved = false, 0); });
function setAll(f) { for (const id in steps) open[id] = f(steps[id]); draw(); fit(); }
document.getElementById("unfold").onclick = () => setAll(() => true);
document.getElementById("fold").onclick = () => setAll(() => false);
document.getElementById("foldstart").onclick = () => setAll(s => s.start);
document.getElementById("fit").onclick = fit;
document.getElementById("deps-on").onchange = e => { showDeps = e.target.checked; drawDeps(); };
{ const all = Object.values(steps); document.getElementById("count").textContent = `${all.filter(s => s.d).length} / ${all.length} done, ${all.filter(s => s.start).length} can start`; }
if (location.hash === "#deps") { showDeps = true; document.getElementById("deps-on").checked = true; }
if (location.hash === "#all") for (const id in steps) open[id] = true;
draw(); fit();
addEventListener("resize", fit);
</script>
