<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make Alive: steps</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #cfd6de; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.drag { cursor: grabbing; }
  #bar { position: fixed; left: 12px; top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar b { font-size: 15px; margin-right: 6px; color: #fff; }
  button, label.tog { background: #1a1f26; color: #cfd6de; border: 1px solid #333c47; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; user-select: none; }
  button:hover, label.tog:hover { border-color: #6b7a8c; }
  #legend { position: fixed; left: 12px; bottom: 10px; display: flex; gap: 14px; color: #8b97a5; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  #tip { position: fixed; display: none; max-width: 440px; background: #161b22; border: 1px solid #3a4553; border-radius: 6px; padding: 9px 12px; pointer-events: none; box-shadow: 0 6px 24px #000a; }
  #tip h4 { margin: 0 0 4px; font-size: 14px; color: #fff; }
  #tip .k { color: #8b97a5; }
  #tip ul { margin: 4px 0 0; padding-left: 18px; }
  #tip code { color: #e6c07b; font-family: Consolas, monospace; font-size: 12px; }
  .link { fill: none; stroke: #2b333d; stroke-width: 1; }
  .link.done { stroke: #2f6b45; }
  .dep { fill: none; stroke: #c0843a; stroke-width: 1.1; opacity: .5; }
  .dep.hot { stroke: #ffd27a; opacity: 1; stroke-width: 2; }
  .dep.cold { opacity: .08; }
  text { fill: #8b97a5; font-size: 11px; paint-order: stroke; stroke: #0d0f12; stroke-width: 3px; stroke-linejoin: round; }
  .node { cursor: default; }
  .node.step { cursor: pointer; }
  .done > circle { fill: #3fb968; } .done > text { fill: #6fd391; }
  .start > circle { fill: #ffe066; stroke: #fff3b0; stroke-width: 2; } .start > text { fill: #fff; font-weight: 600; }
  .blocked > circle { fill: #39424d; } .blocked > text { fill: #5d6875; }
  .open > circle { fill: #7d8996; } .open > text { fill: #aab4bf; }
  .phase > circle { fill: #4a90d9; } .phase > text { fill: #dbe7f5; font-size: 13px; font-weight: 600; }
  .phase.done > circle { fill: #3fb968; }
  .root > circle { fill: #fff; } .root > text { fill: #fff; font-size: 15px; font-weight: 700; }
  .step.folded > circle { stroke-dasharray: none; }
  .step.has > circle { stroke: #0d0f12; stroke-width: 1; }
  .step.folded.has > text { text-decoration: none; }
</style>
</head>

<svg id="svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0843a"/></marker></defs><g id="view"><g id="links"></g><g id="deps"></g><g id="nodes"></g></g></svg>
<div id="bar"><b>Make Alive: steps</b><span id="count"></span>

<script>
const PHASES = [{"id": "P01", "n": "Foundations", "c": [{"id": "S001", "n": "Mind map of this file", "d": true, "start": false, "needs": [], "size": "S", "test": "`python tools/steps_map.py --check`", "see": "open `references/steps_map.html`", "notes": [], "c": [{"n": "`tools/steps_map.py` parses the format above", "d": true, "notes": [], "c": [{"n": "Fails with file and line on a broken id, duplicate id, unknown `needs`, or a `needs` cycle", "d": true, "notes": [], "c": []}, {"n": "`--next` prints the steps that can be started now", "d": true, "notes": [], "c": []}, {"n": "`--stats` prints done / total per phase", "d": true, "notes": [], "c": []}]}, {"n": "Writes `references/steps_map.html`, one self-contained file, no libraries", "d": true, "notes": [], "c": [{"n": "Radial tree: root, phases, steps, features, sub-features", "d": true, "notes": [], "c": []}, {"n": "Done nodes green, startable steps bright, blocked steps dim", "d": true, "notes": [], "c": []}, {"n": "Click a step to fold or unfold it, hover shows its spec notes and `needs`", "d": true, "notes": [], "c": []}, {"n": "Dependency arrows between steps as a toggle", "d": true, "notes": [], "c": []}]}, {"n": "Line in `CLAUDE.md` Commands", "d": true, "notes": [], "c": []}]}, {"id": "S002", "n": "Map data format", "d": true, "start": false, "needs": [], "size": "L", "test": "`tests/test_map_data.gd`", "see": "`--host --map=corridor`", "notes": [], "c": [{"n": "`scripts/world/map_data.gd`: one dictionary per mission area", "d": true, "notes": [], "c": [{"n": "Player spawns (one per player slot, facing)", "d": true, "notes": [], "c": []}, {"n": "Zombie spawn closets (position, radius, which wave uses them)", "d": true, "notes": [], "c": []}, {"n": "Horde routes (polyline from closet to the play area)", "d": true, "notes": [], "c": []}, {"n": "Zones (id, polygon or box, floor range) for extraction, checkpoints, triggers", "d": true, "notes": [], "c": []}, {"n": "Doors, lootboxes, ammo crates, weapon spots with enuation and a low-pass by distance on every 3D voice", "d": true, "notes": [], "c": []}, {"n": "`Sfx.play(name, position, pitch_jitter)` and `Sfx.play_ui(name)` as the only entry points", "d": true, "notes": [], "c": []}, {"n": "Existing gunshot moved onto it", "d": true, "notes": [], "c": []}]}, {"id": "S006", "n": "Settings store", "d": true, "start": false, "needs": [], "size": "S", "test": "`tests/test_settings.gd`", "see": "", "notes": [], "c": [{"n": "`scripts/settings.gd` autoload, saved to `user://settings.cfg`", "d": true, "notes": [], "c": [{"n": "Mouse sensitivity, invert Y, FOV, aim-toggle or hold", "d": true, "notes": [], "c": []}, {"n": "Volume per bus", "d": true, "notes": [], "c": []}, {"n": "Graphics tier, fps cap, vsync, window mode, show draws", "d": true, "notes": [], "c": []}, {"n": "Key bindings from `controls.gd`", "d": true, "notes": [], "c": []}, {"n": "Player name", "d": true, "notes": [], "c": []}]}, {"n": "`changed(key)` signal, live apply", "d": true, "notes": [], "c": []}, {"n": "Unknown or broken file falls back to defaults without a crash", "d": true, "notes": [], "c": []}]}, {"id": "S007", "n": "Balance sheet", "d": true, "start": false, "needs": [], "size": "S", "test": "`tools\\test.ps1 balance`", "see": "", "notes": [], "c": [{"n": "`tools\\balance.ps1` prints a table: every gun against every zombie type", "d": true, "notes": [], "c": [{"n": "Shots and seconds to kill for head, torso, legs", "d": true, "notes": [], "c": []}, {"n": "Damage per magazine, kills per magazine, seconds per reload", "d": true, "notes": [], "c": []}, {"n": "Effective range from spread", "d": true, "notes": [], "c": []}]}, {"n": "Test asserts ordering rules (a sniper headshot kills a walker, the pistol is never the best DPS)", "d": true, "notes": [], "c": []}, {"n": "Writes `references/balance.md`", "d": true, "notes": [], "c": []}]}, {"id": "S008", "n": "Bot playtests", "d": true, "start": false, "needs": ["S002"], "size": "M", "test": "`tests/test_bot_s /` (ignored by git)", "d": true, "notes": [], "c": [{"n": "Gun rack, zombie racks front and back, fx rack", "d": true, "notes": [], "c": []}, {"n": "One street view and one landmark view per mission", "d": true, "notes": [], "c": []}, {"n": "Viewmodel in aim, sprint, reload for the current weapon", "d": true, "notes": [], "c": []}]}, {"n": "`--shot-cam=x,y,z,yaw,pitch` places a free camera so shots repeat exactly, `--poi-cam` looks at a mission's place", "d": true, "notes": [], "c": []}, {"n": "Contact sheet `references/shots/index.html`", "d": true, "notes": [], "c": []}]}]}, {"id": "P02", "n": "Survival loop", "c": [{"id": "S011", "n": "Limited ammo", "d": true, "start": false, "needs": [], "size": "M", "test": "`tests/test_ammo.gd`", "see": "", "notes": [], "c": [{"n": "Ammo types by calibre: 9 mm, 5.7, 5.8, 7.62, 9x39, 12 gauge, .338, 7.62R", "d": true, "notes": [], "c": []}, {"n": "Reserve per type in `weapon_state.gd`, reload takes from it, partial reload when short", "d": true, "notes": [], "c": []}, {"n": "Shotgun shell-by-shell reload stops when the reserve is empty", "d": true, "notes": [], "c": []}, {"n": "Dry fire: click, small viewmodel twitch, no shot sent", "d": true, "notes": [], "c": []}, {"n": "Starting reserve per mission in map data, test maps keep infinite ammo behind `GameMap.infinite_ammo`", "d": true, "notes": [], "c": []}, {"n": "Host knows each player's reserve (sent on change, not per snapshot) so pickups are honest", "d": true, "notes": [], "c": []}, {"n": "HUD shows magazine / reserve", "d": true, "notes": [], "c": []}]}, {"id": "S012", "n": "Ammo pickups and crates", "d": true, "start": false, "needs": ["S011", "S002"], "size": "M", "test": "`tests/test_ammo_pickups.gd`", "see": "`--host --map=corridor --shot-at=2`", "notes": [], "c": [{"n": "Ammo box interactable: small carton per calibre, coloured stripe, count printed as box pips", "d": true, "notes": [], "c": []}, {"n": "Ammo crate: military green, gives the held gun's type, limited "n": "Quick-use keys for heal and throwable", "d": false, "notes": [], "c": []}, {"n": "Drop on death as a backpack other players can loot", "d": false, "notes": [], "c": []}]}, {"id": "S015", "n": "Bleeding and healing", "d": false, "start": false, "needs": ["S014"], "size": "M", "test": "`tests/test_bleeding.gd`", "see": "", "notes": [], "c": [{"n": "Bleed chance on a hit, stacks to three, ticks HP, pinned in tests", "d": false, "notes": [], "c": []}, {"n": "Bandage stops bleeding, medkit restores HP over its use time, painkillers give decaying temporary HP", "d": false, "notes": [], "c": []}, {"n": "Use animation in first person: gun lowers, hands wrap a bandage (four eased poses), cancelled by sprint or damage", "d": false, "notes": [], "c": []}, {"n": "Others see the heal pose on the remote player", "d": false, "notes": [], "c": []}, {"n": "Bleeding look: red drops from the lower screen edge, drip trail decals behind the player, heartbeat when low", "d": false, "notes": [], "c": []}, {"n": "`on_player_bleeding`, `on_player_healed` hooks", "d": false, "notes": [], "c": []}]}, {"id": "S016", "n": "Downed and revive", "d": false, "start": false, "needs": ["S015", "S003"], "size": "L", "test": "`tests/test_downed.gd`", "see": "`tools\\play2.ps1`", "notes": [], "c": [{"n": "At 0 HP a player is downed, not dead: bleed-out timer, pistol only, crawl speed", "d": false, "notes": [], "c": []}, {"n": "First-person camera drops to the floor, tilts, desaturates toward grey as the timer runs", "d": false, "notes": [], "c": []}, {"n": "Third-person rig: fall animation, propped on one arm, crawl cycle, reaching hand when a teammate is near", "d": false, "notes": [], "c": []}, {"n": "Revive: hold use within reach for `Config.REVIVE_SECONDS`, progress ring on both HUDs, interrupted by damage to the reviver", "d": false, "notes": [], "c": []}, {"n": "Revived at partial HP with a get-up animation and brief invulnerability", "d": false, "notes": [], "c": []}, {"n": "Zombies prefer  "d": false, "notes": [], "c": []}, {"n": "INTERACT with a thing (switch, radio, generator)", "d": false, "notes": [], "c": []}, {"n": "EXTRACT", "d": false, "notes": [], "c": []}]}, {"n": "State in `welcome` and on change to every peer: objective index, text, timer, marker position", "d": false, "notes": [], "c": []}, {"n": "Fires the mission hooks", "d": false, "notes": [], "c": []}, {"n": "Fail conditions: everyone dead or downed, timer out", "d": false, "notes": [], "c": []}, {"n": "Corridor gets a tiny objective list as the test bed", "d": false, "notes": [], "c": []}]}, {"id": "S022", "n": "Extraction zone", "d": false, "start": false, "needs": ["S021"], "size": "M", "test": "`tests/test_extraction.gd`", "see": "`--host --map=corridor --bot`", "notes": [], "c": [{"n": "Zone opens with `on_extraction_ready`", "d": false, "notes": [], "c": []}, {"n": "Rule: every alive player inside starts the countdown, anyone leaving pauses it, downed players must be carried in or revived", "d": false, "notes": [], "c": []}, {"n": "Zone look: green flare smoke column rising 30 m and leaning with the wind, ground ring of pulsing light strips, particles drifting up inside", "d": false, "notes": [], "c": []}, {"n": "Countdown: big numerals on the HUD, beeps that rise in pitch for the last five", "d": false, "notes": [], "c": []}, {"n": "Success: fade to white, `on_extracted`, end screen", "d": false, "notes": [], "c": []}]}, {"id": "S023", "n": "Defend objective", "d": false, "start": false, "needs": ["S021"], "size": "M", "test": "`tests/test_defend.gd`", "see": "", "notes": [], "c": [{"n": "Waves from map data: size, types, which closets, gap between waves", "d": false, "notes": [], "c": []}, {"n": "Wave grows with player count, each wave bigger and from more directions", "d": false, "notes": [], "c": []}, {"n": "Between waves: a calm with a countdown, time to barricade and restock", "d": false, "notes": [], "c": []}, {"n": "Last wave does not end, it lasts until the helicopter ed are revived, ammo crate unlocks", "d": false, "notes": [], "c": []}, {"n": "Look: a safe room door or a lit military tent, a hand-painted arrow before it", "d": false, "notes": [], "c": []}, {"n": "HUD toast and a short calm from the director", "d": false, "notes": [], "c": []}]}, {"id": "S026", "n": "Scoring and end screen", "d": false, "start": false, "needs": ["S022"], "size": "M", "test": "`tests/test_scoring.gd`", "see": "", "notes": [], "c": [{"n": "Host counts per player: kills, headshots, limbs severed, damage taken, revives, shots fired and hit, distance", "d": false, "notes": [], "c": []}, {"n": "End screen: EXTRACTED in green or MISSION FAILED in red slamming in, mission time, a row per player with counters ticking up", "d": false, "notes": [], "c": []}, {"n": "Titles: most headshots, medic, survivor with least damage, last one standing", "d": false, "notes": [], "c": []}, {"n": "Best time per mission and difficulty saved to `user://records.cfg`", "d": false, "notes": [], "c": []}, {"n": "Buttons: retry (host), back to lobby", "d": false, "notes": [], "c": []}]}, {"id": "S027", "n": "Difficulty", "d": false, "start": false, "needs": ["S023"], "size": "S", "test": "`tests/test_difficulty.gd`", "see": "", "notes": [], "c": [{"n": "Easy / normal / hard / nightmare as multipliers in `Config`: zombie HP, damage, speed share of runners, horde size, ammo found", "d": false, "notes": [], "c": []}, {"n": "Horde size scales with players alive", "d": false, "notes": [], "c": []}, {"n": "Nightmare: no HUD markers, friendly fire on", "d": false, "notes": [], "c": []}, {"n": "Sent in `welcome`", "d": false, "notes": [], "c": []}]}, {"id": "S028", "n": "Horde director 2", "d": false, "start": false, "needs": ["S002", "S020"], "size": "L", "test": "`tests/test_director.gd`", "see": "", "notes": [], "c": [{"n": "Pacing states: CALM, BUILD, PEAK, RELAX, driven by stress (damage taken, zombies near, ammo low)", "d": false, "notes": [], "c": []}, {"n": "Spawns only in closets no alive player can see or is close to, test proves it across 1000 seeded spawns", "d": false, "notes": [], "c": []}, {"n": "Hordes travel along routes so they arrive as a stream round a corner, not a blob", "d": false, "notes": [], "c": []}, {"n": "Wanderers: a few idle zombies placed ahead of the players, from map data", "d": false, "notes": [], "c": []}, {"n": "Specials on a budget: at most N of each special type alive", "d": false, "notes": [], "c": []}, {"n": "Stragglers that lose the players are recycled to a closet ahead", "d": false, "notes": [], "c": []}, {"n": "`--director` debug overlay: state, stress, heat", "d": false, "notes": [], "c": []}]}]}, {"id": "P04", "n": "Gun feel", "c": [{"id": "S029", "n": "Muzzle flash and smoke", "d": false, "start": true, "needs": ["S004"], "size": "M", "test": "`tests/test_muzzle_fx.gd`", "see": "`--host --demo --weapon=4 --bot --shot-at=1,1.05,1.1`", "notes": [], "c": [{"n": "Flash mesh at the muzzle for one or two frames: star of 3 to 5 crossed quads, random roll, random scale", "d": false, "notes": [], "c": [{"n": "Shape per gun class: small round for pistols, long forked for rifles, wide ball for shotguns, side jets for braked snipers", "d": false, "notes": [], "c": []}, {"n": "Suppressed guns: no flash, a thin grey puff", "d": false, "notes": [], "c": []}]}, {"n": "Light: one pooled omni, warm orange, 0.05 s, no shadows, only on the shooter's gun", "d": false, "notes": [], "c": []}, {"n": "It lights the viewmodel hands and the nearest walls", "d": false, "notes": [], "c": []}, {"n": "Smoke: two or three soft puffs drifting up and with the wind, 0.8 s", "d": false, "notes": [], "c": []}, {"n": "Sustained fire: barrel heat shimmer and a steady wisp from the muzzle for 2 s after a long burst", "d": false, "notes": [], "c": []}, {"n": "Remote players flash too, cheaper tier", "d": false, "notes": [], "c": []}]}, {"id": "S030", "n": "Tracers and bullet whiz", "d": false, "start": true, "needs": ["S004"], "size": "M", "test": "`tests/test_tracers.gd`", "see": "`tools\\play2.ps1`", "notes": [], "c": [{"n": "Tracer: thin emissive streak from muzzle to hit, 40 m long segment moving at bullet speed, fades at the end", "d": false, "notes": [], "c": []}, {"n": "Every shot for others' guns, every third for your own (clean view)", "d": false, "notes": [], "c": []}, {"n": "Colour by calibre: yellow-white rifles, faint for pistols, a fan of short ones for shotguns", "d": false, "notes": [], "c": []}, {"n": "Sniper shot: a vapour trail line that lingers 0.6 s and wobbles apart", "d": false, "notes": [], "c": []}, {"n": "Near miss from a teammate's line: whiz sound and a tiny view flinch", "d": false, "notes": [], "c": []}, {"n": "Capped, pooled", "d": false, "notes": [], "c": []}]}, {"id": "S031", "n": "Shell casings", "d": false, "start": true, "needs": ["S004"], "size": "M", "test": "`tests/test_casings.gd`", "see": "`--host --demo --weapon=4 --bot --shot-at=2`", "notes": [], "c": [{"n": "Casing mesh per class: brass pistol, brass rifle, red shotgun hull, long sniper case", "d": false, "notes": [], "c": []}, {"n": "Ejects from the port with the gun's own direction, speed and spin, timed with the action (bolt guns eject on the bolt pull, pumps on the pump)", "d": false, "notes": [], "c": []}, {"n": "Cheap physics: one bounce off the floor with a tumble, a second small one, then rest", "d": false, "notes": [], "c": []}, {"n": "Tink on each bounce by surface", "d": false, "notes": [], "c": []}, {"n": "Rests for a while, then sinks, capped by MultiMesh", "d": false, "notes": [], "c": []}, {"n": "A wisp of smoke from the ejection port", "d": false, "notes": [], "c": []}]}, {"id": "S032", "n": "Surfaces and impacts", "d": false, "start": true, "needs": ["S004"], "size": "L", "test": "`tests/test_impacts.gd`", "see": "`--host --fx-rack`", "notes": [], "c": [{"n": "Surface kinds on collision bodies via metadata: concrete, asphalt, brick, metal, wood, glass, dirt, grass, water, flesh, tile", "d": false, "notes": [], "c": []}, {"n": "Impact per surface", "d": false, "notes": [], "c": [{"n": "Concrete: grey dust cone, chips flying, round pocked hole", "d": false, "notes": [], "c": []}, {"n": "Brick: red dust, larger chips", "d": false, "notes": [], "c": []}, {"n": "Metal: sparks with gravity that bounce once, bright flash, dented hole with a shine ring, ricochet chance with a tracer", "d": false, "notes": [], "c": []}, {"n": "Wood: splinters, pale torn hole", "d": false, "notes": [], "c": []}, {"n": "Glass: star crack decal, a spray of shards", "d": false, "notes": [], "c": []}, {"n": "Dirt and grass: clod spray, dark puff, blades of grass", "d": false, "notes": [], "c": []}, {"n": "Water: vertical splash column, ring ripples", "d": false, "notes": [], "c": []}, {"n": "Tile: white shards, cracked decal", "d": false, "notes": [], "c": []}]}, {"n": "Hole decals in the MultiMesh pool, aligned to the normal", "d": false, "notes": [], "c": []}, {"n": "Shotgun: one combined puff for the pattern plus individual holes", "d": false, "notes": [], "c": []}, {"n": "Penetration data per surface stored now, used by S101", "d": false, "notes": [], "c": []}]}, {"id": "S033", "n": "Gun voices", "d": false, "start": true, "needs": ["S005"], "size": "L", "test": "`tests/test_gun_sounds.gd`", "see": "", "notes": [], "c": [{"n": "One synthesised shot per gun from layers: crack (noise burst), body (low thump by calibre), mechanical click, tail", "d": false, "notes": [], "c": [{"n": "P19 short pop, P90 buzzy snap, Type 95 and AK47 heavy bark, AS Val soft thud", "d": false, "notes": [], "c": []}, {"n": "USAS-12 and SPAS-12 boom with a long tail, T-5000 crack with a rolling echo, Dragunov sharp slap", "d": false, "notes": [], "c": []}]}, {"n": "Tail by place: short and boxy indoors, long slapback between buildings, open on the hill", "d": false, "notes": [], "c": []}, {"n": "Distance versions: far shots lose the crack and keep a dull thump", "d": false, "notes": [], "c": []}, {"n": "Suppressed variants", "d": false, "notes": [], "c": []}, {"n": "Dry fire click", "d": false, "notes": [], "c": []}, {"n": "Small pitch and level variation per shot, seeded per shot index", "d": false, "notes": [], "c": []}]}, {"id": "S034", "n": "Handling animation and sound", "d": false, "start": false, "needs": ["S033"], "size": "L", "test": "`tests/test_viewmodel.gd`", "see": "`--weapon=1..9 --pose=reload`", "notes": [], "c": [{"n": "Reload has parts with their own sound and pose: mag release, mag out, new mag in, slap, bolt or charging handle", "d": false, "notes": [], "c": [{"n": "Empty reload differs from a tactical reload", "d": false, "notes": [], "c": []}, {"n": "The old magazine falls and stays on the floor a while", "d": false, "notes": [], "c": []}, {"n": "Shotgun: shell in per round, pump at the end", "d": false, "notes": [], "c": []}, {"n": "Bolt rifle: bolt up, back, forward, down, with the scope leaving the eye", "d": false, "notes": [], "c": []}]}, {"n": "Inspect animation on a key: roll the gun left and right, check the chamber", "d": false, "notes": [], "c": []}, {"n": "Idle life: slow breathing, micro-adjustments of the grip", "d": false, "notes": [], "c": []}, {"n": "Draw and holster with cloth and sling sounds", "d": false, "notes": [], "c": []}, {"n": "Low ammo: the last rounds of a magazine sound thinner and click", "d": false, "notes": [], "c": []}]}, {"id": "S035", "n": "Camera feel", "d": false, "start": true, "needs": ["S018"], "size": "M", "test": "`tests/test_camera_feel.gd`", "see": "", "notes": [], "c": [{"n": "Walk and sprint bob as a figure eight, synced with footsteps", "d": false, "notes": [], "c": []}, {"n": "Weapon sway lags the mouse, spring back, more with heavy guns", "d": false, "notes": [], "c": []}, {"n": "Strafe tilt of a degree or two", "d": false, "notes": [], "c": []}, {"n": "Recoil as a spring: kick up, recover most of the way, horizontal wander by gun", "d": false, "notes": [], "c": []}, {"n": "FOV opens a little while sprinting, pinches on a sniper shot", "d": false, "notes": [], "c": []}, {"n": "Shake sources mixed and capped: explosions, hits taken, leaper landing, helicopter", "d": false, "notes": [], "c": []}, {"n": "All of it scaled by a setting, off at zero", "d": false, "notes": [], "c": []}]}, {"id": "S036", "n": "HUD 2", "d": false, "start": false, "needs": ["S011", "S021"], "size": "L", "test": "`tests/test_hud.gd`", "see": "`--host --shot-at=2`", "notes": [], "c": [{"n": "Bottom right: weapon name, magazine as individual pips or a number, reserve, fire mode", "d": false, "notes": [], "c": []}, {"n": "Bottom left: health bar with a bleed marker, stamina, item counts", "d": false, "notes": [], "c": []}, {"n": "Top: compass strip with bearings, objective and teammate ticks", "d": false, "notes": [], "c": []}, {"n": "Objective text with a typed-in reveal, strike-through and slide-out when done", "d": false, "notes": [], "c": []}, {"n": "World markers: objective diamond with distance, clamped to the screen edge with an arrow", "d": false, "notes": [], "c": []}, {"n": "Teammates: name over the head, outline through walls when far, downed icon with a timer", "d": false, "notes": [], "c": []}, {"n": "Interaction prompt with the bound key and a hold ring", "d": false, "notes": [], "c": []}, {"n": "Everything fades when not needed, HUD scale setting", "d": false, "notes": [], "c": []}, {"n": "Built in code, no draw-call growth", "d": false, "notes": [], "c": []}]}, {"id": "S037", "n": "Hit feedback", "d": false, "start": false, "needs": ["S036"], "size": "M", "test": "`tests/test_hit_feedback.gd`", "see": "", "notes": [], "c": [{"n": "Hit marker: four ticks that snap in and ease out, red and larger for a kill, a skull tick for a headshot", "d": false, "notes": [], "c": []}, {"n": "Limb sever: a brief extra tick and a wet sound", "d": false, "notes": [], "c": []}, {"n": "Damage direction: red arc on the side the hit came from, fades over a second", "d": false, "notes": [], "c": []}, {"n": "Taking a hit: view punch away from the attacker, red edge flash, short muffling of sound", "d": false, "notes": [], "c": []}, {"n": "Low HP: pulsing dark red vignette, desaturation, heartbeat, blurred edges", "d": false, "notes": [], "c": []}, {"n": "Blood on the lens after a close kill: a few drops that run down and fade", "d": false, "notes": [], "c": []}]}, {"id": "S038", "n": "Other players' animations", "d": false, "start": false, "needs": ["S016", "S019"], "size": "L", "test": "`tests/test_remote_anim.gd`", "see": "`tools\\play2.ps1`", "notes": [], "c": [{"n": "Player snapshot carries an action byte: aim, reload, shove, heal, throw, downed, vault, crouch", "d": false, "notes": [], "c": []}, {"n": "Rig states in `Humanoid.Anim`", "d": false, "notes": [], "c": [{"n": "Aim: shouldered gun, head tracks the look pitch", "d": false, "notes": [], "c": []}, {"n": "Reload: support hand to the pouch and back, gun tilted", "d": false, "notes": [], "c": []}, {"n": "Sprint with the gun carried low", "d": false, "notes": [], "c": []}, {"n": "Shove, throw (wind-up, release), heal", "d": false, "notes": [], "c": []}, {"n": "Hit flinch, death fall forward or backward by hit direction", "d": false, "notes": [], "c": []}]}, {"n": "Upper and lower body blend: legs run while the arms reload", "d": false, "notes": [], "c": []}, {"n": "Gun recoil kick on the remote rig per shot", "d": false, "notes": [], "c": []}, {"n": "Survivor outfits by player slot: four distinct looks, deterministic", "d": false, "notes": [], "c": []}]}]}, {"id": "P05", "n": "The real Joinville", "c": [{"id": "S039", "n": "Trace the OpenStreetMap tiles", "d": false, "start": true, "needs": [], "size": "L", "test": "`tests/test_city_osm.gd`", "see": "redraw `references/city_plan.png`", "notes": [], "c": [{"n": "`tools/trace_osm.py` reads `references/1.png` to `9.png` into `scripts/world/city_osm.gd` (generated, never edited by hand)", "d": false, "notes": [], "c": [{"n": "Each tile registered to `joinville.png` pixels by two named control points per tile, kept in the tool", "d": false, "notes": [], "c": []}, {"n": "Building footprints: the brown-grey polygons, simplified to a few corners, area and centroid", "d": false, "notes": [], "c": []}, {"n": "Street casings by colour class: red trunk, orange, yellow, white residential, grey pedestrian", "d": false, "notes": [], "c": []}, {"n": "Water, parks, parking lots, forest stipple as polygons", "d": false, "notes": [], "c": []}]}, {"n": "Overlay picture `references/osm_on_reference.png` proves the registration by eye", "d": false, "notes": [], "c": []}, {"n": "Test: the terminal, the Prefeitura and the hospital footprints land inside their `CityData.POIS` lots", "d": false, "notes": [], "c": []}, {"n": "Gaps between tiles reported, not guessed", "d": false, "notes": [], "c": []}]}, {"id": "S040", "n": "Street network 2", "d": false, "start": false, "needs": ["S039"], "size": "L", "test": "`tests/test_city_map.gd`", "see": "`--city-plan`", "notes": [], "c": [{"n": "`CityData.STREETS` checked street by street against the tiles: missing ones added, names fixed", "d": false, "notes": [], "c": [{"n": "Centre: Rua do Príncipe, Rua Nove de Março, Rua XV de Novembro, Rua Jerônimo Coelho, Rua Rio Branco, Rua Itajaí, Rua Abdon Batista, Rua Sete de Setembro, Rua Três de Maio, Rua Padre Carlos, Alameda Brüstlein", "d": false, "notes": [], "c": []}, {"n": "River roads: Avenida Hermann August Lepper, Avenida José Vieira, Avenida Doutor Paulo Medeiros, Rua Aubé", "d": false, "notes": [], "c": []}, {"n": "Foot of the hill: Rua Saguaçu, Rua Amazonas, Rua Chapecó, Rua Curitiba, Rua Cantareira, Rua Bela Vista", "d": false, "notes": [], "c": []}]}, {"n": "Per street: carriageway width, lanes, one-way direction, sidewalk width each side, surface kind", "d": false, "notes": [], "c": []}, {"n": "Junctions as real shapes: rounded kerb corners by radius, T and cross, the riverside interchange as slip roads", "d": false, "notes": [], "c" ]}, {"n": "Blocks outside every mission area: low-detail silhouettes only", "d": false, "notes": [], "c": []}]}, {"id": "S044", "n": "Facades", "d": false, "start": false, "needs": ["S043"], "size": "L", "test": "`tests/test_facades.gd`", "see": "`--host --shot-cam` street level, day and night", "notes": [], "c": [{"n": "Facade grammar baked into the block's mesh as vertex colour and shallow relief", "d": false, "notes": [], "c": [{"n": "Ground floor: shopfront glass, roll-down steel shutters, awnings, a doorway recess with a door that does not open", "d": false, "notes": [], "c": []}, {"n": "Upper floors: window grid by class, sills, balconies with railings on the slab blocks, air-conditioner boxes", "d": false, "notes": [], "c": []}, {"n": "Top: parapet, water tanks, antennas, lift overruns", "d": false, "notes": [], "c": []}]}, {"n": "Joinville character: enxaimel half-timbered gables (dark beams on white, steep red roofs), pastel plaster houses, brise-soleil fins on the modernist blocks", "d": false, "notes": [], "c": []}, {"n": "Shop signs as coloured boards with block lettering in Portuguese: FARMÁCIA, PADARIA, LOTÉRICA, LANCHONETE, FERRAGENS, deterministic per building", "d": false, "notes": [], "c": []}, {"n": "Night: a seeded few windows lit warm or TV-blue as emission, some flickering, most dark", "d": false, "notes": [], "c": []}, {"n": "Decay: boarded windows, soot above burnt ones, broken panes, quarantine tape across doors", "d": false, "notes": [], "c": []}, {"n": "House numbers by the door", "d": false, "notes": [], "c": []}]}, {"id": "S045", "n": "Rio Cachoeira", "d": false, "start": false, "needs": ["S040", "S004"], "size": "L", "test": "`tests/test_river.gd`", "see": "`--host --shot-cam` on a bridge", "notes": [], "c": [{"n": "Channel cut below street level: sloped grass and stone banks, a retaining wall where the avenues run beside it", "d": false, "notes": [], "c": []}, {"n": "Water: one mesh, shader in code with slow flow along the river line, small ripples, dark green-brown, sky and lamp reflections as stretched streaks", "d": false, "notes": [], "c": []}, {"n": "Bridges at the traced crossings: deck, kerbs, concrete or steel railings, piers in the water", "d": false, "notes": [], "c": []}, {"n": "Floating things drifting with the flow: debris, a body, an upturned boat, seeded", "d": false, "notes": [], "c": []}, {"n": "Imperial palm row along the riverside avenue as in `prefeitura3.png`", "d": false, "notes": [], "c": []}, {"n": "Water is not walkable; falling in wades the player to the bank slowly, zombies stay out", "d": false, "notes": [], "c": []}, {"n": "Mist over the water at night", "d": false, "notes": [], "c": []}]}, {"id": "S046", "n": "Street furniture", "d": false, "start": false, "needs": ["S041", "S042"], "size": "L", "test": "`tests/test_street_furniture.gd`", "see": "`--furniture-rack`", "notes": [], "c": [{"n": "Props in `props.gd`, placed by rules along streets, seeded, merged per block", "d": false, "notes": [], "c": [{"n": "Avenue lamp: tall grey pole, curved arm, sodium-orange head", "d": false, "notes": [], "c": []}, {"n": "Square lamp: green post with two white globes (Praça da Bandeira)", "d": false, "notes": [], "c": []}, {"n": "Concrete power poles with a transformer, crossarms and sagging bundles of cables between them", "d": false, "notes": [], "c": []}, {"n": "Traffic lights on masts, some blinking yellow, some dead", "d": false, "notes": [], "c": []}, {"n": "Blue street-name plates on corner poles with the real street name", "d": false, "notes": [], "c": []}, {"n": "Bus stop shelter with a bench and an ad panel", "d": false, "notes": [], "c": []}, {"n": "Orelhão phone booth (the egg-shaped hood), green bins, benches, bollards, newsstand kiosk, fire hydrant, post box", "d": false, "notes": [], "c": []}, {"n": "Road signs: PARE, speed limit, one-way arrows, no parking", "d": false, "notes": [], "c": []}]}, {"n": "Lamps follow the two-shadow rule: emission and a cheap light, s  "needs": ["S020", "S071"], "size": "L", "test": "`tests/test_zombie_senses.gd`", "see": "", "notes": [], "c": [{"n": "States before CHASE: DORMANT (standing still, lying, slumped in a car), FEEDING (kneeling on a corpse), WANDER", "d": false, "notes": [], "c": []}, {"n": "Sight cone and range, shorter in the dark, widened by a flashlight shining on them", "d": false, "notes": [], "c": []}, {"n": "Hearing from the noise system", "d": false, "notes": [], "c": []}, {"n": "Alert: head snaps up, a scream that wakes others within a radius, then the chase", "d": false, "notes": [], "c": []}, {"n": "Feeding animation: kneel, tear, head jerks up with a strip, blood on the mouth", "d": false, "notes": [], "c": []}, {"n": "Trapped ones: behind glass slapping it, seat-belted in cars, under a gate reaching out", "d": false, "notes": [], "c": []}, {"n": "Banging on a closed door in rhythm, the door shakes", "d": false, "notes": [], "c": []}, {"n": "Sneaking past is possible: crouch, no light, suppressed guns", "d": false, "notes": [], "c": []}]}, {"id": "S073", "n": "Crowd movement", "d": false, "start": false, "needs": ["S052"], "size": "M", "test": "`tests/test_crowd.gd`", "see": "", "notes": [], "c": [{"n": "Separation steering so a horde spreads across the street instead of stacking", "d": false, "notes": [], "c": []}, {"n": "Lanes: fast ones overtake on the outside", "d": false, "notes": [], "c": []}, {"n": "Funnel at doors and gaps: pressure builds, the ones in front are pushed through", "d": false, "notes": [], "c": []}, {"n": "Shoving reactions: a staggered zombie bumps its neighbours into a stumble", "d": false, "notes": [], "c": []}, {"n": "Tripping over corpses and crawlers at a seeded chance, pinned in tests", "d": false, "notes": [], "c": []}, {"n": "Host tick cost at the zombie cap stays in budget (S009)", "d": false, "notes": [], "c": []}]}, {"id": "S074", "n": "Climbing and vaulting", "d": false, "start": false, "needs": ["S071", "S073"], "size": "L", "test": "`tests/test_zombie_climb.gd`", "see": "`--host --demo --climb`", "notes": [], "c": [{"n": "Nav links typed VAULT (waist high), CLIMB (up to a floor), DROP", "d": false, "notes": [], "c": []}, {"n": "Vault animation: hands slap the top, belly over, tumble down the other side, get up", "d": false, "notes": [], "c": []}, {"n": "Climb animation: jump, grab the edge, feet scrabble, pull up; fingers show on the ledge first", "d": false, "notes": [], "c": []}, {"n": "Drop: fall, heavy landing, a broken ankle limp at a seeded chance", "d": false, "notes": [], "c": []}, {"n": "Windows: head and arms through, drag the body over the sill, glass tears at them", "d": false, "notes": [], "c": []}, {"n": "Shot while climbing: falls back onto the ones below", "d": false, "notes": [], "c": []}, {"n": "Cars are vaulted over, fences climbed, barricades clawed at first", "d": false, "notes": [], "c": []}]}, {"id": "S075", "n": "Crawler", "d": false, "start": false, "needs": ["S071"], "size": "S", "test": "`tests/test_zombie_crawler.gd`", "see": "", "notes": [], "c": [{"n": "Spawns legless: under cars, in stairwells, under beds", "d": false, "notes": [], "c": []}, {"n": "Silent until close, grabs an ankle: the player is slowed until it is shoved or shot", "d": false, "notes": [], "c": []}, {"n": "Look: torn trousers, entrail drag trail decal behind it", "d": false, "notes": [], "c": []}, {"n": "Hard to see: low, in the dark, flashlights help", "d": false, "notes": [], "c": []}]}, {"id": "S076", "n": "Bloater", "d": false, "start": false, "needs": ["S070", "S004"], "size": "M", "test": "`tests/test_zombie_bloater.gd`", "see": "`--zombie-rack=1`", "notes": [], "c": [{"n": "Model: swollen torso and neck, split shirt, pale green skin, pulsing belly (scale wobble on the torso mesh)", "d": false, "notes": [], "c": []}, {"n": "Slow waddle, gurgling", "d": false, "notes": [], "c": []}, {"n": "Death or close contact: bursts", "d": false, "notes": [], "c": [{"n": "Belly swells for 0.4 s first as a warning", "d": false, "notes": [], "c": []}, {"n": "Wet explosion: chunks, a ring of bile on the floor, a green mist cloud that lingers", "d": false, "notes": [], "c": []}, {"n": "Damage and a knock-back in the radius, bile on the screen of players caught", "d": false, "notes": [], "c": []}]}, {"n": "Bile puddle draws other zombies to it", "d": false, "notes": [], "c": []}, {"n": "Kill it at range, or use it against a horde", "d": false, "notes": [], "c": []}]}, {"id": "S077", "n": "Spitter", "d": false, "start": false, "needs": ["S070", "S004"], "size": "M", "test": "`tests/test_zombie_spitter.gd`", "see": "", "notes": [], "c": [{"n": "Model: long neck, distended jaw, burnt chest, thin limbs", "d": false, "notes": [], "c": []}, {"n": "Keeps distance, climbs to high ground, strafes between spits", "d": false, "notes": [], "c": []}, {"n": "Spit: rears the head back with a throat bulge, then a glowing green arc with a drip trail", "d": false, "notes": [], "c": []}, {"n": "Lands as an acid pool: bubbles, steam wisps, eats HP while stood in, fades in seconds", "d": false, "notes": [], "c": []}, {"n": "Host simulates the arc; clients get start, velocity and time", "d": false, "notes": [], "c": []}, {"n": "Dies easily, flees when approached", "d": false, "notes": [], "c": []}]}, {"id": "S078", "n": "Brute", "d": false, "start": false, "needs": ["S070", "S071"], "size": "L", "test": "`tests/test_zombie_brute.gd`", "see": "", "notes": [], "c": [{"n": "Model: a head taller, huge arms, small head, firefighter or riot gear fused on", "d": false, "notes": [], "c": []}, {"n": "Armour plates on torso and arms as separate parts with their own HP; plates crack, then fly off, showing flesh", "d": false, "notes": [], "c": []}, {"n": "Charge: lowers the shoulder, paws the ground, a straight run that throws players and zombies aside and ends in a stumble if it misses", "d": false, "notes": [], "c": []}, {"n": "Smashes doors and barricades in one hit, flips small wrecks aside", "d": false, "notes": [], "c": []}, {"n": "Ground slam at close range with a dust ring and a camera shake", "d": false, "notes": [], "c": []}, {"n": "Weak spot: the head and the back after a missed charge", "d": false, "notes": [], "c": []}, {"n": "At most one or two alive (director budget)", "d": false, "notes": [], "c": []}]}, {"id": "S079", "n": "Screamer", "d": false, "start": false, "needs": ["S070", "S028"], "size": "M", "test": "`tests/test_zombie_screamer.gd`", "see": "", "notes": [], "c": [{"n": "Model: gaunt, torn hospital gown, jaw unhinged, hands clawing its own head", "d": false, "notes": [], "c": []}, {"n": "On sight of a player it stands still, arches back and screams for three seconds", "d": false, "notes": [], "c": []}, {"n": "The scream is visible: ripple rings of distorted air, nearby glass rattles, the player's view trembles", "d": false, "notes": [], "c": []}, {"n": "Finished scream calls a horde through the director; killing it mid-scream stops it", "d": false, "notes": [], "c": []}, {"n": "Runs away between screams", "d": false, "notes": [], "c": []}]}, {"id": "S080", "n": "Armoured dead", "d": false, "start": false, "needs": ["S070"], "size": "M", "test": "`tests/test_zombie_armour.gd`", "see": "", "notes": [], "c": [{"n": "Soldier: helmet stops pistol and SMG headshots until knocked off, vest halves torso damage", "d": false, "notes": [], "c": []}, {"n": "Riot cop: visor helmet, limb pads, sometimes still holding a shield in front", "d": false, "notes": [], "c": []}, {"n": "Firefighter: helmet and thick coat, immune to fire", "d": false, "notes": [], "c": []}, {"n": "Helmets are parts: a hit knocks them off with a clang and they roll away", "d": false, "notes": [], "c": []}, {"n": "Bullets on armour spark and ricochet instead of bleeding", "d": false, "notes": [], "c": []}, {"n": "Weighted by place: soldiers at the Batalhão, cops at checkpoints", "d": false, "notes": [], "c": []}]}, {"id": "S081", "n": "Death and ragdolls", "d": false, "start": false, "needs": ["S071"], "size": "M", "test": "`tests/test_ragdoll.gd`", "see": "`--host --demo --bot --shot-at=2,4`", "notes": [], "c": [{"n": "Death animation before the ragdoll by cause: headshot drop, torso crumple to the knees, run-death tumble that carries momentum", "d": false, "notes": [], "c": []}, {"n": "Ragdoll impulse from the killing shot's direction and calibre; shotguns lift them off the ground", "d": false, "notes": [], "c": []}, {"n": "Twitching: a hand or leg jerks for a few seconds on some corpses", "d": false, "notes": [], "c": []}, {"n": "Corpses settle, then become static corpses as now; caps unchanged", "d": false, "notes": [], "c": []}, {"n": "Piles: corpses stack at choke points without jitter", "d": false, "notes": [], "c": []}, {"n": "Explosions throw ragdolls and loose limbs", "d": false, "notes": [], "c": []}]}]}, {"id": "P08", "n": "Sound", "c": [{"id": "S082", "n": "Zombie voices", "d": false, "start": true, "needs": ["S005"], "size": "L", "test": "`tests/test_zombie_sounds.gd`", "see": "", "notes": [], "c": [{"n": "Synthesised from formant-filtered saw and noise, a voice seeded per zombie id (pitch, rasp, size)", "d": false, "notes": [], "c": [{"n": "Walker: low groans, wet breathing", "d": false, "notes": [], "c": []}, {"n": "Runner: rising screech when it spots someone, panting", "d": false, "notes": [], "c": []}, {"n": "Leaper: clicking snarl, a shriek in the air", "d": false, "notes": [], "c": []}, {"n": "Specials: bloater gurgle, spitter retch, brute roar, screamer's scream", "d": false, "notes": [], "c": []}]}, {"n": "States have sounds: alert, attack grunt, hit yelp, death rattle per type", "d": false, "notes": [], "c": []}, {"n": "Horde bed: beyond a count, single voices are replaced by one crowd roar that swells with their number and nearness", "d": false, "notes": [], "c": []}, {"n": "Voice cap respected, nearest first", "d": false, "notes": [], "c": []}]}, {"id": "S083", "n": "Bodies and footsteps", "d": false, "start": false, "needs": ["S005", "S032"], "size": "M", "test": "`tests/test_footsteps.gd`", "see": "", "notes": [], "c": [{"n": "Footsteps by surface for players: concrete, asphalt, setts, pavers, grass, dirt, metal stair, tile, wood, water, glass shards", "d": false, "notes": [], "c": []}, {"n": "Walk, sprint, crouch, land, each timed with the camera bob and the remote rig's feet", "d": false, "notes": [], "c": []}, {"n": "Gear rattle while sprinting, cloth while turning", "d": false, "notes": [], "c": []}, {"n": "Breathing: heavy after sprint, ragged when hurt, held while aiming a sniper", "d": false, "notes": [], "c": []}, {"n": "Low-HP heartbeat that speeds up", "d": false, "notes": [], "c": []}, {"n": "Zombie feet: shuffle, runner slaps, horde rumble", "d": false, "notes": [], "c": []}, {"n": "Gore sounds: limb tear, bone crack, squelch, splash of a blood burst, a head burst pop", "d": false, "notes": [], "c": []}]}, {"id": "S084", "n": "World sounds", "d": false, "start": true, "needs": ["S005"], "size": "M", "test": "`tests/test_world_sounds.gd`", "see": "", "notes": [], "c": [{"n": "Doors: handle, creak open, slam, locked rattle, splinter and break", "d": false, "notes": [], "c": []}, {"n": "Barricade: hammer knocks, plank crack, plank snap", "d": false, "notes": [], "c": []}, {"n": "Lootbox: latch, lid creak, rummage; pickups: ammo clink, medkit zip, key jingle", "d": false, "notes": [], "c": []}, {"n": "Glass: crack, shatter, shards falling, crunch underfoot", "d": false, "notes": [], "c": []}, {"n": "Vehicles: car alarm, hazard tick, a horn stuck on, engine ticking as it cools", "d": false, "notes": [], "c": []}, {"n": "UI: hover tick, click, back, error, objective chime, wave horn", "d": false, "notes": [], "c": []}, {"n": "Generators, buzzing tube lights, a swinging sign creaking", "d": false, "notes": [], "c": []}]}, {"id": "S085", "n": "Ambience", "d": false, "start": true, "needs": ["S005"], "size": "M", "test": "`tests/test_ambience.gd`", "see": "", "notes": [], "c": [{"n": "Bed per place, crossfaded by zones in map data", "d": false, "notes": [], "c": [{"n": "Streets: wind between buildings, far sirens, a dog, distant gunfire and screams at random times", "d": false, "notes": [], "c": []}, {"n": "Terminal: wide hall reverb, dripping, a loose metal sheet", "d": false, "notes": [], "c": []}, {"n": "Hospital: hum, alarm beeps down a corridor, a monitor flatline", "d": false, "notes": [], "c": []}, {"n": "Forest: insects, frogs, night birds, leaves, twigs snapping somewhere", "d": false, "notes": [], "c": []}, {"n": "Riverside: water, palms rattling", "d": false, "notes": [], "c": []}, {"n": "Summit: strong wind, mast cables singing", "d": false, "notes": [], "c": []}]}, {"n": "One-shots placed in the world, not in the player's head", "d": false, "notes": [], "c": []}, {"n": "Quiet that means something: the bed thins out before a horde", "d": false, "notes": [], "c": []}]}, {"id": "S086", "n": "Space and occlusion", "d": false, "start": false, "needs": ["S085"], "size": "M", "test": "`tests/test_audio_space.gd`", "see": "", "notes": [], "c": [{"n": "Reverb zones from map data: small room, corridor, hall, street canyon, open", "d": false, "notes": [], "c": []}, {"n": "Occlusion: a wall between source and listener low-passes and quietens (one ray per voice, spread across frames)", "d": false, "notes": [], "c": []}, {"n": "Sounds through doors change when the door opens", "d": false, "notes": [], "c": []}, {"n": "Teammates' shots, steps and reloads are positional", "d": false, "notes": [], "c": []}, {"n": "Vertical cues in buildings: floor above is muffled thumps", "d": false, "notes": [], "c": []}]}, {"id": "S087", "n": "Mission audio", "d": false, "start": false, "needs": ["S005", "S024"], "size": "M", "test": "`tests/test_mission_sounds.gd`", "see": "", "notes": [], "c": [{"n": "Horde warning: an air-raid siren winding up across the city, then the roar", "d": false, "notes": [], "c": []}, {"n": "Helicopter: rotor thump with distance (far: low pulse, near: full chop and turbine whine), doppler on the pass, wash noise underneath", "d": false, "notes": [], "c": []}, {"n": "Radio voice as filtered noise bursts and beeps with subtitles on the HUD", "d": false, "notes": [], "c": []}, {"n": "Extraction countdown beeps, success swell, failure drone", "d": false, "notes": [], "c": []}, {"n": "Checkpoint and objective stingers", "d": false, "notes": [], "c": []}]}, {"id": "S088", "n": "Procedural music", "d": false, "start": false, "needs": ["S005", "S028"], "size": "L", "test": "`tests/test_music.gd`", "see": "", "notes": [], "c": [{"n": "A small sequencer in code: drone, pulse, percussion, a detuned piano-like pluck, all synthesised", "d": false, "notes": [], "c": []}, {"n": "Layers follow the director: CALM drone only, BUILD adds a pulse, PEAK adds drums and a rising tone, RELAX thins out", "d": false, "notes": [], "c": []}, {"n": "Per-mission key and tempo", "d": false, "notes": [], "c": []}, {"n": "Stingers: special zombie spotted, teammate down, last player standing", "d": false, "notes": [], "c": []}, {"n": "Menu theme", "d": false, "notes": [], "c": []}, {"n": "Music volume setting, ducked under gunfire", "d": false, "notes": [], "c": []}]}, {"id": "S089", "n": "The mix", "d": false, "start": false, "needs": ["S033", "S082", "S085"], "size": "M", "test": "`tests/test_mix.gd`", "see": "", "notes": [], "c": [{"n": "Ducking: guns duck ambience and music, explosions duck everything briefly", "d": false, "notes": [], "c": []}, {"n": "Explosion near the player: tinnitus tone and a low-pass that recover over seconds", "d": false, "notes": [], "c": []}, {"n": "Low HP and downed: muffled world, loud heart and breath", "d": false, "notes": [], "c": []}, {"n": "Limiter on Master, no clipping with a full horde and four guns", "d": false, "notes": [], "c": []}, {"n": "Loudness per category balanced by ear with a checklist in the step's commit", "d": false, "notes": [], "c": []}]}]}, {"id": "P09", "n": "Arsenal", "c": [{"id": "S090", "n": "Melee weapons: knife and bat", "d": false, "start": false, "needs": ["S013", "S019"], "size": "L", "test": "`tests/test_melee.gd`", "see": "`--weapon=knife --pose=swing`", "notes": [], "c": [{"n": "Melee entries in `Weapons.DEFS`: reach, arc, swing time, recovery, damage, stagger, sever chance, noise, durability", "d": false, "notes": [], "c": []}, {"n": "Host resolves a swing as an arc sweep at the hit frame, part hit decided by height", "d": false, "notes": [], "c": []}, {"n": "Viewmodel swings as blended poses: wind-up, strike with overshoot, follow-through, return; a three-swing combo alternating sides", "d": false, "notes": [], "c": []}, {"n": "Hit stop: 40 ms freeze of the viewmodel and a camera nudge on contact", "d": false, "notes": [], "c": []}, {"n": "Combat knife: fast stabs and slashes, quiet, a held stab to the head from behind kills a dormant zombie", "d": false, "notes": [], "c": []}, {"n": "Baseball bat: two-hand swings, knocks zombies down, dents and blood build up on the bat mesh", "d": false, "notes": [], "c": []}, {"n": "Blood on the weapon and hands that fades over time", "d": false, "notes": [], "c": []}, {"n": "Models in `guns.gd` style, shown in the rack", "d": false, "notes": [], "c": []}]}, {"id": "S091", "n": "Blades: axe, machete, katana", "d": false, "start": false, "needs": ["S090"], "size": "M", "test": "`tests/test_melee_blades.gd`", "see": "", "notes": [], "c": [{"n": "Sever rules: blades cut the limb the arc passes through, with a clean stump", "d": false, "notes": [], "c": []}, {"n": "Fire axe: slow overhead chop, sticks in the body for a beat and is wrenched out, breaks doors", "d": false, "notes": [], "c": []}, {"n": "Machete: fast diagonal cuts, best limb sever per second", "d": false, "notes": [], "c": []}, {"n": "Katana: rare loot, fast wide arcs, decapitation with a held strike, a blood arc flung off the blade after each cut", "d": false, "notes": [], "c": []}, {"n": "Blade trails: a faint   if (n.kind === "step") {
    const all = []; (function w(l) { for (const f of l) { all.push(f); w(f.c); } })(n.c);
    h = `<h4>${n.id} · ${esc(n.n)}</h4><div><span class="k">${n.d ? "done" : n.start ? "can start now" : "blocked"} · size ${n.size || "?"} · ${all.filter(f => f.d).length} / ${all.length} features</span></div>`;
    h += `<div><span class="k">needs:</span> ${n.needs.length ? n.needs.map(i => `${i} ${esc(steps[i].n)} ${steps[i].d ? "✓" : "✗"}`).join(", ") : "none"}</div>`;
    if (n.test) h += `<div><span class="k">test:</span> ${rich(n.test)}</div>`;
    if (n.see) h += `<div><span class="k">see:</span> ${rich(n.see)}</div>`;
  } else if (n.kind === "phase") {
    h = `<h4>${n.id} · ${esc(n.n)}</h4><div class="k">${n.c.filter(s => s.d).length} / ${n.c.length} steps done</div>`;
  } else if (n.kind === "feature") {
    h = `<h4>${rich(n.n)}</h4><div class="k">${n.d ? "done" : "open"} · ${n.step.id} ${esc(n.step.n)}</div>`;
  } else {
    const all = Object.values(steps); h = `<h4>Make Alive</h4><div class="k">${all.filter(s => s.d).length} / ${all.length} steps done</div>`;
  }
  if (n.notes && n.notes.length) h += "<ul>" + n.notes.map(t => `<li>${rich(t)}</li>`).join("") + "</ul>";
  tip.innerHTML = h; tip.style.display = "block";
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 16, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(e.clientY + 16, innerHeight - hh - 8) + "px";
}

let tx = 0, ty = 0, k = 1, moved = false, grab = null;
function apply() { view.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`); }
function fit() { k = Math.min(innerWidth, innerHeight) / (2 * extent); tx = innerWidth / 2; ty = innerHeight / 2; apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0015); tx = e.clientX - (e.clientX - tx) * f; ty = e.clientY - (e.clientY - ty) * f; k *= f; apply(); }, {passive: false});
svg.addEventListener("mousedown", e => { grab = [e.clientX, e.clientY]; moved = false; svg.classList.add("drag"); });
addEventListener("mousemove", e => { if (!grab) return; const dx = e.clientX - grab[0], dy = e.clientY - grab[1]; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; tx += dx; ty += dy; grab = [e.clientX, e.clientY]; apply(); });
addEventListener("mouseup", () => { grab = null; svg.classList.remove("drag"); setTimeout(() => moved = false, 0); });
function setAll(f) { for (const id in steps) open[id] = f(steps[id]); draw(); fit(); }
document.getElementById("unfold").onclick = () => setAll(() => true);
document.getElementById("fold").onclick = () => setAll(() => false);
document.getElementById("foldstart").onclick = () => setAll(s => s.start);
document.getElementById("fit").onclick = fit;
document.getElementById("deps-on").onchange = e => { showDeps = e.target.checked; drawDeps(); };
{ const all = Object.values(steps); document.getElementById("count").textContent = `${all.filter(s => s.d).length} / ${all.length} done, ${all.filter(s => s.start).length} can start`; }
if (location.hash === "#deps") { showDeps = true; document.getElementById("deps-on").checked = true; }
if (location.hash === "#all") for (const id in steps) open[id] = true;
draw(); fit();
addEventListener("resize", fit);
</script>
</body>
</html>
